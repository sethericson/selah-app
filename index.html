<style>
/* Layout: one calm column on a flat dark-violet ground; flat surfaces, hairline borders, one lavender accent; fixed tab bar. */
:root{
  color-scheme: dark;
  --bg:#120e20;
  --surface:#1b162e;
  --surface-2:#252040;
  --line:rgba(255,255,255,.05);
  --line-strong:rgba(255,255,255,.11);
  --fg:#f3f0fa;
  --muted:#aaa3c4;
  --faint:#77708f;
  --accent:#b9a6ff;
  --accent-ink:#171127;
  --accent-soft:rgba(185,166,255,.12);
  --sky:#9fb8f5;
  --rose:#e98ca2;
  --plum:#c9a3ea;
  --amber:#e8b976;
  --sage:#82d3b1;
  --danger:#f0929f;
  --sans: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: var(--sans);
  --r-lg:20px; --r:16px; --r-sm:12px;
  --tab-h:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
a{color:var(--accent)}
.wrap{max-width:540px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.wrap.full{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.serif{font-family:var(--sans)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
h2{font-size:21px;line-height:1.25;font-weight:650;letter-spacing:-.015em}
h3{font-size:16px;font-weight:600;letter-spacing:-.005em}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:14px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{background:transparent}
.card.gold,.card.lav{background:var(--accent-soft);border-color:rgba(185,166,255,.18)}
.tap{transition:transform .16s ease, background .2s ease}
.tap:active{transform:scale(.985)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:600;font-size:16px;letter-spacing:-.005em;transition:transform .14s ease, opacity .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--surface-2);color:var(--fg)}
.btn.ghost{color:var(--muted)}
.btn.danger{background:rgba(240,146,159,.12);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.35;pointer-events:none}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:19px;height:19px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;color:var(--fg);transition:background .18s,border-color .18s,color .18s,transform .14s;text-align:left}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent-soft);border-color:rgba(185,166,255,.45);color:var(--accent)}
.chip.dim{opacity:.4}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}
.pill.sage{background:rgba(130,211,177,.12);color:var(--sage)}

/* Inputs */
.field{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong);color:var(--fg);font-size:17px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical;line-height:1.45}
.field::placeholder{color:var(--faint)}
label.lbl{font-size:13px;color:var(--muted);font-weight:500;display:block;margin-bottom:8px}

/* Header & streak */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.streak{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:68px;padding:10px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
.streak b{font-size:26px;line-height:1;font-weight:700;letter-spacing:-.02em}
.streak span{font-size:11.5px;margin-top:4px;font-weight:500;opacity:.85}
.streak.zero{background:var(--surface);color:var(--muted)}

/* Scripture */
.verse{font-size:18.5px;line-height:1.55;color:var(--fg);letter-spacing:-.005em}
.verse.lg{font-size:20px}
.ref{font-size:13px;color:var(--accent);font-weight:600}
.prayer{font-size:17px;line-height:1.6;color:var(--fg)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--accent)}
.li .ico svg{width:18px;height:18px}
.chev{color:var(--faint);flex:none}
.chev svg{width:17px;height:17px;display:block}

/* Practices */
.prac{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prac:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .2s;color:var(--accent-ink)}
.prac.done .check{background:var(--accent);border-color:var(--accent)}
.prac.done .check svg{opacity:1;transform:none}
.prac.done .pname{color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));background:rgba(18,14,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:600;transition:color .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--fg)}
.tab.on svg{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,5,18,.55);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--line-strong);padding:10px max(20px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));transform:translateY(102%);transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet .in{max-width:540px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line-strong);margin:2px auto 14px}

/* Toast */
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:0 16px 36px -18px rgba(0,0,0,.7);max-width:420px;animation:tin .35s cubic-bezier(.2,.9,.25,1)}
.toast .badge{width:36px;height:36px;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* Onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ob .body{flex:1;display:flex;flex-direction:column;gap:20px;padding-top:14px;position:relative;z-index:1}
.ob .foot{position:sticky;bottom:0;z-index:1;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg, rgba(18,14,32,0), var(--bg) 35%)}
.dots{display:flex;gap:5px}
.dots i{height:3px;flex:1;border-radius:3px;background:var(--line-strong)}
.dots i.on{background:var(--accent)}
.hero-logo{width:84px;height:84px;margin:24px 0 10px}
.group-title{font-size:13px;font-weight:500;color:var(--faint);margin:4px 0 10px}

/* Reflect */
.rate-name{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.score{font-size:68px;line-height:1;font-weight:700;letter-spacing:-.04em;transition:color .25s}
.score small{font-size:20px;color:var(--faint);font-weight:500;letter-spacing:0}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage))}
.range::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.range.untouched::-webkit-slider-runnable-track{opacity:.3}
.range.untouched::-webkit-slider-thumb{background:var(--faint)}
.range.untouched::-moz-range-track{opacity:.3}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.done-num{font-size:96px;line-height:1;font-weight:700;letter-spacing:-.05em;color:var(--accent)}
.sunrise{position:fixed;inset:auto 0 0 0;height:55vh;z-index:0;pointer-events:none;background:radial-gradient(60% 65% at 50% 100%, rgba(185,166,255,.16), transparent 70%);animation:rise 1.4s ease both}
.room > :not(.sunrise){position:relative;z-index:1}
@keyframes rise{from{opacity:0}to{opacity:1}}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-align:center;color:var(--faint);font-weight:500;padding-bottom:2px}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-size:13.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.03);border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.day.has{color:#120e20}
.day.today{border-color:var(--fg)}
.day.future{opacity:.3}
.day.restored::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.has.restored::after{background:#120e20}
.day.blank{background:transparent}
.day.allp::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--sage)}
.day.has.allp::before{background:#120e20}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.legend .bar{flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage));max-width:150px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:12.5px;color:var(--muted)}

.minis{display:flex;gap:4px}
.minis i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.07)}

/* Achievements */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.badge-tile svg{width:44px;height:44px}
.badge-tile .bn{font-size:12.5px;font-weight:600;line-height:1.25}
.badge-tile.locked{opacity:.45}

/* Moods */
.moodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mood{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14.5px;font-weight:500;min-height:48px}
.mood .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* Prayer room */
.room{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center}
.orb{width:168px;height:168px;border-radius:50%;margin:30px auto 24px;background:radial-gradient(circle at 50% 50%, rgba(185,166,255,.45), rgba(185,166,255,.1) 55%, transparent 70%);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.7}45%,55%{transform:scale(1.04);opacity:1}}

/* Weekly review */
.wr{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden}
.wr-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;transition:background-color 1.4s cubic-bezier(.4,0,.2,1)}
.wr-bg::before{content:"";position:absolute;inset:-35%;background:radial-gradient(32% 32% at 30% 32%,rgba(185,166,255,.32),transparent 70%),radial-gradient(28% 28% at 74% 68%,rgba(125,160,255,.22),transparent 70%),radial-gradient(24% 24% at 60% 20%,rgba(233,140,190,.12),transparent 70%);animation:wrdrift 18s ease-in-out infinite alternate}
.wr-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 30%,transparent 70%,rgba(0,0,0,.25))}
@keyframes wrdrift{to{transform:translate3d(7%,-5%,0) rotate(14deg) scale(1.08)}}
.wr-bars{display:flex;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 0 max(20px, env(safe-area-inset-left,0px))}
.wr-bars{position:relative;z-index:3}
.wr-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.wr-bars i b{display:block;height:100%;width:0;background:#fff}
.wr-bars i.done b{width:100%}
.wr-bars i.cur b{animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}
.wr{animation:wropen .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes wropen{from{opacity:0;transform:scale(1.035)}}
.wr.closing{animation:wrclose .38s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes wrclose{to{opacity:0;transform:scale(.97)}}
.wr-slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px max(28px, env(safe-area-inset-right,0px)) 40px max(28px, env(safe-area-inset-left,0px));max-width:540px;margin:0 auto;width:100%;transition:opacity .3s ease, transform .3s ease}
.wr-slide > *{animation:wrin .85s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 110ms + 80ms)}
.wr-slide.from-back > *{animation-name:wrinback}
@keyframes wrinback{from{opacity:0;transform:translateY(-16px);filter:blur(8px)}}
.wr-slide.leave,.wr-slide.leave-back{position:absolute;left:0;right:0;margin:0 auto;pointer-events:none}
.wr-slide.leave > *,.wr-slide.leave-back > *{animation:none}
.wr-slide.leave{animation:wrleave .32s cubic-bezier(.4,0,1,1) forwards}
.wr-slide.leave-back{animation:wrleaveback .32s cubic-bezier(.4,0,1,1) forwards}
@keyframes wrleave{to{opacity:0;transform:translateY(-22px);filter:blur(8px)}}
@keyframes wrleaveback{to{opacity:0;transform:translateY(22px);filter:blur(8px)}}
.wr.held .wr-bars i.cur b{animation-play-state:paused}
.wr.held .wr-slide:not(.leave):not(.leave-back){opacity:.82;transform:scale(.985)}
.wr-foot > *{animation:fadein .5s ease both}
.wr-hint{text-align:center;opacity:.55;letter-spacing:.01em}
.wr-done{background:#fff;color:#171127;min-height:54px;border-radius:18px;box-shadow:0 18px 40px -18px rgba(255,255,255,.5)}
@keyframes wrin{from{opacity:0;transform:translateY(24px);filter:blur(8px)}}
.wr-big{font-size:min(28vw,124px);line-height:.95;font-weight:800;letter-spacing:-.05em}
.wr-h{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.wr-p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);max-width:34ch}
.wr-tapl,.wr-tapr{position:absolute;top:60px;bottom:90px;width:38%;z-index:2}
.wr-tapl{left:0}.wr-tapr{right:0}
.wr-close{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.wr-close svg{width:18px;height:18px}
.wr-foot{position:relative;z-index:3;padding:0 max(28px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(28px, env(safe-area-inset-left,0px));max-width:540px;margin:0 auto;width:100%}
.wr-bar{display:flex;align-items:center;gap:12px;font-size:15px}
.wr-bar .track{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.wr-bar .track b{display:block;height:100%;border-radius:8px;background:#fff;animation:grow 1.3s cubic-bezier(.2,.9,.25,1) .55s both}
@keyframes grow{from{width:0!important}}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--sans)}

/* Lock */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.pins{display:flex;gap:14px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent)}
.pins i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.key{height:74px;border-radius:50%;background:var(--surface);font-size:26px;font-weight:500}
.key:active{background:var(--surface-2)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.fade{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hr{height:1px;background:var(--line);margin:4px 0}
.crisis{background:rgba(233,140,162,.08);border-color:rgba(233,140,162,.22)}
.copyline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-variant-numeric:tabular-nums}


/* ---- Motion + calm layout (v2) ---- */
html{touch-action:manipulation}
.rv{opacity:0}
.rv.in{animation:rvin .75s cubic-bezier(.2,.7,.2,1) var(--d,0ms) both}
.rv.in.fromR{animation-name:rvinR} .rv.in.fromL{animation-name:rvinL}
@keyframes rvin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes rvinR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes rvinL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.leaving{opacity:0;transition:opacity .18s ease;pointer-events:none}
.pbar{height:3px;border-radius:3px;background:var(--line-strong);overflow:hidden}
.pbar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#8fb0ff);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.obhead{padding-top:6px;gap:14px}
.iconbtn.quiet{background:transparent;color:var(--muted)}
.ob::before{content:"";position:fixed;inset:-25% -25% auto -25%;height:80vh;z-index:0;pointer-events:none;background:radial-gradient(42% 52% at 32% 38%,rgba(185,166,255,.20),transparent 70%),radial-gradient(38% 48% at 78% 22%,rgba(125,155,255,.12),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(7%,5%,0) scale(1.1)}}
.ob .body{gap:22px;padding-top:30px}
.ob .body.welcome{padding-top:0;gap:18px;align-items:flex-start;justify-content:center}
.ob .foot{position:sticky;bottom:0}
.hero-logo.glow{width:76px;height:76px;margin:0 0 6px;border-radius:20px;box-shadow:0 0 0 1px var(--line),0 24px 70px -18px rgba(185,166,255,.65);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--line),0 24px 70px -22px rgba(185,166,255,.45)}50%{box-shadow:0 0 0 1px var(--line),0 24px 80px -12px rgba(185,166,255,.8)}}
.wordmark{font-size:58px;line-height:1;font-weight:700;letter-spacing:-.045em;background:linear-gradient(180deg,#fff,#c9bff0);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;line-height:1.5;color:var(--muted);max-width:32ch}
.q-t{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.035em}
.q-t .soft{color:var(--faint)}
.bigfield{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-strong);border-radius:0;padding:10px 0 12px;font-size:34px;font-weight:600;letter-spacing:-.03em;color:var(--fg);outline:none;transition:border-color .3s}
.bigfield:focus{border-bottom-color:var(--accent)}
.bigfield::placeholder{color:var(--faint);font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}

 prayers:[
 "Lord, you know exactly where my mind goes, and you haven't walked away from me. Guard my eyes and my thoughts today. When temptation shows up, remind me there is a way out and give me the strength to take it. Make my heart clean, and help me see people the way you see them. Amen.",

 tips:[
 "Name your triggers. Late nights, being alone with your phone, boredom, and stress are the common ones. Plan around them before they show up.",

anger:{label:"Anger",

 "Jesus, you forgave people who did far worse to you than anyone has done to me. I don't feel like forgiving, but I'm choosing to start. Take this bitterness out of me before it takes root. Amen.",

 tips:[

 prayers:[

 prayers:[

 prayers:[

 prayers:[

 prayers:[

screens:{label:"Screens",

 prayers:[

general:{label:"Growth",

 prayers:[

 "God, search my heart and show me what needs to change. Then give me the power to change it. I trust you with my growth. Amen.",
 "Father, your mercies are new every morning. Thank you for another chance today. Help me take one faithful step at a time. Amen."],
 tips:[
 "Name the moment it usually happens. Awareness is the first step.",
 "Tell one person you trust what you're working on.",
 "Celebrate progress, not perfection. A better day is still a win.",
 "Pray about it specifically, by name, every day this week."]}
};

 {id:"worn", name:"Worn down", hue:"lav"},

 {id:"hurt", name:"Hurting", hue:"rose"},
 {id:"heavy", name:"Heavy heart", hue:"plum"},
 {id:"stir", name:"Stirred up", hue:"amber"},
 {id:"faith", name:"Faith", hue:"gold"},
 {id:"bright", name:"Bright", hue:"sage"}
];

const MOODS = [
/* Worn down */
{id:"weary",g:"worn",name:"Weary",heavy:true,adj:"weary",
 verses:["Matthew 11:28-30","Isaiah 40:29","Isaiah 40:31","Isaiah 40:28","Galatians 6:9","Exodus 33:14","Psalm 23:1-3","2 Corinthians 4:16-18"],
 prayers:["Lord, I'm tired in a way sleep doesn't fix. You said to come to you when I'm heavy-burdened, so here I am. Give me rest for my soul, and strength for just today. Amen.",
 "God, you never grow faint or weary, and I'm running on empty. Lend me your strength. Help me know what I can set down and what I need to keep carrying. Amen.",
 "Jesus, carry this with me. I don't need to do everything today, just the next faithful thing. Renew me like you promised. Amen."],
 tips:["Weariness is a signal, not a failure. Ask what you can drop or move this week.","Protect your sleep tonight. Phone away, lights out earlier than usual.","Even five minutes of quiet with God can refill more than an hour of scrolling."]},
{id:"burnedout",g:"worn",name:"Burned out",heavy:true,adj:"burned out",
 verses:["Mark 6:31","Psalm 23:1-3","Matthew 11:28-30","Psalm 127:2","Isaiah 40:29","Ecclesiastes 3:1","Psalm 116:7"],
 prayers:["Lord, I've been pushing so hard I've lost the joy. Even Jesus took time away to rest. Show me where to slow down without feeling guilty about it. Amen.",
 "God, I'm worn out from school, practice, and everything else. Remind me my worth isn't in how much I get done. Restore what's been drained. Amen.",
 "Father, I hand you my schedule. Show me what really matters this season. Give me courage to rest, and peace while I do. Amen."],
 tips:["Rest is a gift from God, not laziness. Take a real break this week with no guilt.","Look at your week and find one thing you can say no to.","Talk to a parent or coach if the load is too much. People can't help with what they don't know."]},
{id:"overwhelmed",g:"worn",name:"Overwhelmed",heavy:true,adj:"overwhelmed",
 verses:["Psalm 61:2","Psalm 55:22","Matthew 6:34","Isaiah 43:2","Philippians 4:6-7","Psalm 46:1","Exodus 14:14"],
 prayers:["Lord, it's all piling up and I don't know where to start. Lead me to the rock that is higher than I am. Help me take one thing at a time. Amen.",
 "God, I'm drowning in everything I have to do. Remind me the waters won't sweep over me because you're with me. Give me a clear head and the next step. Amen.",
 "Jesus, I give you the whole pile. Help me sort out what's urgent, what can wait, and what isn't mine to carry at all. Amen."],
 tips:["Write everything down. Seeing it on paper makes it smaller than it feels in your head.","Pick the single most important thing and do only that first.","Ask for help with one item. Overwhelmed people rarely need to do it all alone."]},
{id:"stressed",g:"worn",name:"Stressed",heavy:true,adj:"stressed",
 verses:["Philippians 4:6-7","1 Peter 5:7","John 14:27","Isaiah 26:3","Psalm 94:19","Colossians 3:23-24","Psalm 55:22"],
 prayers:["Lord, I'm stressed about school, sports, and what people expect. Take the pressure off my shoulders. Help me do my best and trust you with the results. Amen.",
 "God, keep my mind fixed on you so I can have your perfect peace. When the stress spikes, remind me to breathe and pray. Amen.",
 "Father, I care about doing well, and that's okay. Just don't let it own me. Let me work hard for you and rest in your love no matter how it turns out. Amen."],
 tips:["Breathe in for four, hold four, out for six. Do it three times right now.","Do your best and leave the outcome with God. That's the only part you control.","Short breaks help. Five minutes away from the work can save an hour of stress."]},
{id:"sick",g:"worn",name:"Sick or hurt",heavy:true,adj:"sick or hurting",
 verses:["Jeremiah 17:14","Psalm 41:3","Psalm 103:2-4","Psalm 73:26","2 Corinthians 12:9","Psalm 46:1"],
 prayers:["Lord, my body hurts and I feel weak. Heal me, and while I wait, give me patience and peace. You're still good, even on sick days. Amen.",
 "God, I'm frustrated being hurt and sitting out. Help me trust your timing and use this time to draw closer to you. Restore my strength. Amen.",
 "Jesus, you healed so many people. I'm asking you to touch my body too. And whatever happens, let your grace be enough for me. Amen."],
 tips:["Rest is part of healing. Let yourself actually rest without guilt.","Ask someone to pray with you. It's encouraging to not pray alone.","If you're injured, follow the trainer's plan. Patience now saves time later."]},
{id:"cantsleep",g:"worn",name:"Can't sleep",heavy:true,adj:"restless at night",
 verses:["Psalm 4:8","Proverbs 3:24","Psalm 127:2","Psalm 121:1-3","Isaiah 26:3","Psalm 46:10"],
 prayers:["Lord, my mind won't shut off. I give you every thought that's keeping me awake. You never sleep, so I can. Let me lie down in peace. Amen.",
 "God, quiet my mind. Replace the replaying and worrying with your presence. Give your beloved sleep, like you promised. Amen.",
 "Father, thank you for today, the good and the hard. I'm done with it now. Watch over me tonight and wake me rested. Amen."],
 tips:["Put the phone across the room. Screens keep your brain wired.","Write down whatever's looping in your head so you can let it go until morning.","Pray slowly through Psalm 23 line by line. It's calming."]},
/* Anxious and unsure */
{id:"anxious",g:"anx",name:"Anxious",heavy:true,adj:"anxious",
 verses:["Philippians 4:6-7","1 Peter 5:7","Matthew 6:34","John 14:27","Psalm 94:19","Isaiah 26:3","Psalm 56:3","Matthew 6:26"],
 prayers:["Lord, my chest is tight and my thoughts are racing. I'm bringing every worry to you right now. Trade my anxiety for your peace. Amen.",
 "God, you care about me more than the birds you feed every day. Help me trust that you've got tomorrow handled. Bring me back to this moment with you. Amen.",
 "Jesus, you said peace I leave with you. I need that peace right now. Quiet the what-ifs and fill me with what's true. Amen.",
 "Father, calm my body. Slow my breathing. Remind me that you're near, that I'm safe in you, and that this feeling will pass. Amen."],
 tips:["Name five things you can see, four you can hear, three you can touch. It pulls you back to the present.","Write down the worry, then ask: what's one small thing I can do?","If anxiety is showing up most days, tell a parent or counselor. That's wisdom, not weakness."]},
{id:"afraid",g:"anx",name:"Afraid",heavy:true,adj:"afraid",
 verses:["Isaiah 41:10","Joshua 1:9","2 Timothy 1:7","Psalm 56:3","Psalm 23:4","Psalm 34:4","Psalm 118:6","Deuteronomy 31:8","1 John 4:18"],
 prayers:["Lord, I'm scared. You said not to fear because you're with me. Hold me up with your right hand. Be stronger than this fear. Amen.",
 "God, you haven't given me a spirit of fear. Fill me with your power, love, and a sound mind. Help me take the brave next step. Amen.",
 "Jesus, even in the darkest valley, you're with me. Walk ahead of me into what I'm afraid of. Thank you that I never face it alone. Amen."],
 tips:["Say the fear out loud to God or someone you trust. Fear shrinks when it's named.","Courage isn't the absence of fear. It's doing the right thing while you're afraid.","If you're in danger, tell an adult right away."]},
{id:"nervous",g:"anx",name:"Nervous for something big",heavy:true,adj:"nervous",
 verses:["Joshua 1:9","Philippians 4:13","Isaiah 41:10","Proverbs 16:3","Colossians 3:23-24","Psalm 28:7","Deuteronomy 31:6"],
 prayers:["Lord, I have something big coming up and my stomach is in knots. Help me prepare well, show up calm, and give it everything for you. The result is in your hands. Amen.",
 "God, I can do all things through Christ who strengthens me. Steady my nerves. Let me play, perform, or test from peace, not fear. Amen.",
 "Father, whatever happens, I'm still yours. Take the pressure off. Help me enjoy the moment and give you the glory either way. Amen."],
 tips:["Nerves mean you care. Turn the energy into focus.","Prepare what you can, then let it go. Last-minute cramming adds stress more than skill.","Pray a short line right before you start, like: Lord, this is for you."]},
{id:"insecure",g:"anx",name:"Insecure",heavy:true,adj:"insecure",
 verses:["Psalm 139:14","1 Samuel 16:7","Ephesians 2:10","Isaiah 43:1","1 John 3:1","Galatians 1:10","Luke 12:7"],
 prayers:["Lord, I keep feeling like I'm not enough. You made me on purpose and you call me yours. Help my worth come from you, not from comparing myself. Amen.",
 "God, you look at the heart. Free me from obsessing over how I look, how I play, or what people think. Let me be confident in who you made me. Amen.",
 "Father, even the hairs on my head are numbered. That's how well you know me, and you still love me. Let that sink in today. Amen."],
 tips:["Write down three things God says about you and keep them where you'll see them.","Unfollow accounts that make you feel less than.","Confidence grows from doing small brave things, not from waiting to feel ready."]},
{id:"confused",g:"anx",name:"Unsure about the future",heavy:true,adj:"unsure about the future",
 verses:["Jeremiah 29:11","Proverbs 3:5-6","Proverbs 16:9","Psalm 32:8","Isaiah 30:21","Psalm 31:15","Matthew 6:34"],
 prayers:["Lord, I don't know what's ahead, but you do. I trust you with my future. Direct my paths and give me peace about the parts I can't see yet. Amen.",
 "God, I make my plans but you direct my steps. Help me hold my dreams loosely and follow you closely. Amen.",
 "Father, my times are in your hands. Help me be faithful today and trust you with tomorrow. Amen."],
 tips:["Focus on the next step, not the whole path. God usually shows one step at a time.","Talk to someone older who's been where you're headed.","Write down what you're hoping for and pray over it, then hold it with open hands."]},
/* Hurting */
{id:"sad",g:"hurt",name:"Sad",heavy:true,adj:"down",
 verses:["Psalm 34:18","Psalm 42:11","Psalm 30:5","Matthew 5:4","Psalm 147:3","Romans 15:13","Isaiah 61:3"],
 prayers:["Lord, I feel sad and I'm not totally sure why. You're near to the brokenhearted, so be near to me. Hold me in this, and bring joy back in your timing. Amen.",
 "God, why is my soul so down? I'm going to keep hoping in you. Lift my head. Remind me that weeping lasts for a night, but joy comes in the morning. Amen.",
 "Jesus, you know sorrow. Sit with me in this. I don't need answers right now, just you. Amen."],
 tips:["It's okay to not be okay. Tell God exactly how you feel.","Get outside for ten minutes. Sunlight and movement help more than you'd think.","If the sadness sticks around for weeks, talk to a parent or counselor."]},
{id:"grieving",g:"hurt",name:"Grieving",heavy:true,adj:"weighed down by grief",
 verses:["Matthew 5:4","John 11:35","Psalm 34:18","Revelation 21:4","1 Thessalonians 4:13-14","John 11:25","Psalm 147:3","Psalm 23:4"],
 prayers:["Lord, I miss them so much it hurts. Jesus wept too, so I know you understand. Comfort me. Hold me when the waves of grief come. Amen.",
 "God, thank you that death doesn't get the last word. Give me hope while I grieve. Help me remember the good and trust you with what I don't understand. Amen.",
 "Father, I don't know how to feel some days. Be close. Send people to sit with me, and give me grace for the hard moments. Amen."],
 tips:["Grief isn't something to rush. Let yourself feel it.","Talk about the person you lost with someone who knew them.","Grief can show up as anger, numbness, or exhaustion. All of that is normal. Tell someone you trust how you're doing."]},
{id:"heartbroken",g:"hurt",name:"Heartbroken",heavy:true,adj:"heartbroken",
 verses:["Psalm 147:3","Psalm 34:18","Isaiah 43:18-19","Romans 8:28","Jeremiah 31:3","Psalm 30:5"],
 prayers:["Lord, my heart feels broken. You heal the brokenhearted and bind up their wounds. Heal me. Help me not to rush it or numb it. Amen.",
 "God, I wanted this to work out and it didn't. Help me trust that you're still writing my story. Make a way in this wilderness. Amen.",
 "Jesus, your love doesn't leave. When I feel rejected, remind me I'm loved with an everlasting love. Amen."],
 tips:["Give it time. Hearts heal slower than we want.","Take a break from their social media. It helps more than you'd expect.","Lean on good friends and family. Don't isolate."]},
{id:"lonely",g:"hurt",name:"Lonely",heavy:true,adj:"lonely",
 verses:["Matthew 28:20","Deuteronomy 31:6","Psalm 68:6","Psalm 25:16","Hebrews 13:5","Psalm 139:7-10","Ecclesiastes 4:9-10"],
 prayers:["Lord, I feel alone. You promised you'd never leave me or forsake me. Be close to me right now, and bring good people into my life. Amen.",
 "God, you place the lonely in families. Open doors to real friendships. Give me courage to reach out first. Amen.",
 "Jesus, you know what it's like to be alone. Thank you that wherever I go, you're already there. Fill this empty space with your presence. Amen."],
 tips:["Text someone first today. Most people are waiting for someone else to reach out.","Join something, like a youth group, a club, or a Bible study. Belonging grows from showing up.","Loneliness is a feeling, not the truth about you. God is with you right now."]},
{id:"rejected",g:"hurt",name:"Rejected or left out",heavy:true,adj:"left out",
 verses:["Isaiah 53:3","Psalm 27:10","Isaiah 43:4","1 Peter 2:9","Psalm 118:6","Romans 8:38-39"],
 prayers:["Lord, I got left out and it stings. Jesus, you were rejected too, so you get it. Remind me I'm chosen and wanted by you. Amen.",
 "God, help me not to let this rejection define me. You call me precious in your sight. Heal the hurt and guard me from bitterness. Amen.",
 "Father, show me who my real friends are, and help me be a friend who includes others. Amen."],
 tips:["Rejection hurts, but it doesn't decide your worth.","Notice who else might be left out and include them. It changes how you feel too.","Talk to someone about it instead of replaying it alone."]},
{id:"unloved",g:"hurt",name:"Unloved",heavy:true,adj:"unloved",
 verses:["Jeremiah 31:3","John 3:16","Romans 5:8","1 John 3:1","Zephaniah 3:17","Romans 8:38-39","1 John 4:19"],
 prayers:["Lord, I don't feel loved right now. But you loved me before I did anything. Help me feel that, not just know it. Amen.",
 "God, you rejoice over me with singing. That's hard to believe today. Speak your love louder than the lies I'm hearing. Amen.",
 "Jesus, nothing can separate me from your love. Hold me there today. Amen."],
 tips:["Feelings change. God's love doesn't.","Read Romans 8:31-39 slowly.","Tell someone you trust that you're feeling this way. People who love you want to know."]},
{id:"betrayed",g:"hurt",name:"Someone hurt me",heavy:true,adj:"hurt by others",
 verses:["Colossians 3:13","Romans 12:21","Matthew 5:44","Psalm 34:18","Ephesians 4:31-32","Romans 12:18","Exodus 14:14"],
 prayers:["Lord, someone hurt me and it's hard to let go. I give you this pain. Help me not to hurt them back. Bring justice where it's needed and healing where it's not. Amen.",
 "God, forgiving them feels impossible. I'm asking you to start it in me. Forgiveness doesn't mean what they did was okay, it means I'm trusting you with it. Amen.",
 "Jesus, you prayed for the people who hurt you. Help me pray for them too, even just one sentence. Amen."],
 tips:["Forgiving someone doesn't mean trusting them again right away. Boundaries are okay.","Don't vent online. Talk to God or a trusted person instead.","If someone is harming you, tell a trusted adult right away."]},
{id:"worthless",g:"hurt",name:"Worthless",heavy:true,adj:"down on yourself",
 verses:["Psalm 139:14","Isaiah 43:4","Luke 12:7","Ephesians 2:10","Psalm 8:3-5","1 Peter 2:9","Zephaniah 3:17"],
 prayers:["Lord, I feel worthless today. You made me fearfully and wonderfully. Speak louder than the voice telling me I don't matter. Amen.",
 "God, you crowned people with glory and honor, including me. Help me see myself through your eyes. Amen.",
 "Father, you paid everything for me. That's how much I'm worth to you. Let that truth win today. Amen."],
 tips:["That voice is lying. Write down what God says instead and read it out loud.","Do one kind thing for someone. It reminds you that you matter.","If these feelings are heavy or won't go away, please tell someone today. You matter."]},
{id:"failure",g:"hurt",name:"Like a failure",heavy:true,adj:"like a failure",
 verses:["Proverbs 24:16","Micah 7:8","Lamentations 3:22-23","2 Corinthians 12:9","Psalm 37:23-24","Philippians 3:13-14","Romans 8:28"],
 prayers:["Lord, I messed up and I feel like a failure. Thank you that your mercies are new every morning. Help me get back up again. Amen.",
 "God, your strength is made perfect in my weakness. Use even this. Teach me what I need to learn and help me move forward. Amen.",
 "Father, failing at something doesn't make me a failure. Remind me who I am in you. Amen."],
 tips:["Ask what you can learn from it, then let it go.","Every great player and believer has failed many times. Getting back up is what counts.","Talk to someone you trust instead of replaying it alone."]},
{id:"lost",g:"hurt",name:"Lost a game or fell short",heavy:true,adj:"frustrated after a loss",
 verses:["Romans 8:28","Philippians 3:13-14","2 Corinthians 4:8-9","Proverbs 24:16","Colossians 3:23-24","Psalm 73:26"],
 prayers:["Lord, that loss stings. Help me learn from it without beating myself up. My identity is in you, not the scoreboard. Amen.",
 "God, I gave it what I had and it wasn't enough today. Help me be gracious, be a good teammate, and come back stronger. Amen.",
 "Father, thank you that one result doesn't define me. Use this to grow my character as much as my game. Amen."],
 tips:["Give yourself a set amount of time to be upset, then move on to what you'd do differently.","Encourage a teammate. It gets your head out of the loss.","Remember who you play for. Your worth didn't change with the score."]},
/* Heavy heart */
{id:"hopeless",g:"heavy",name:"Hopeless",heavy:true,adj:"hopeless",
 verses:["Romans 15:13","Jeremiah 29:11","Psalm 42:11","Lamentations 3:22-23","Psalm 40:1-2","Romans 5:3-5","Isaiah 43:18-19"],
 prayers:["Lord, I can't see a way forward. You are the God of hope. Fill me with hope again, even a little. Amen.",
 "God, lift me out of this pit like you did for David. Set my feet on a rock. I'm holding on to you. Amen.",
 "Father, your plans for me are for peace, not harm. Help me believe that when everything in me doubts it. Amen."],
 tips:["Hopelessness lies about the future. Talk to someone today.","If you're thinking about hurting yourself, call or text 988 right now. You deserve help.","Focus on getting through today. Just today."]},
{id:"discouraged",g:"heavy",name:"Discouraged",heavy:true,adj:"discouraged",
 verses:["Galatians 6:9","2 Corinthians 4:16-18","Psalm 31:24","Philippians 1:6","Isaiah 40:31","Joshua 1:9","Psalm 27:14"],
 prayers:["Lord, I'm discouraged. I feel like I'm putting in effort and not seeing results. Help me not give up. Remind me the harvest comes in due season. Amen.",
 "God, you started a good work in me and you'll finish it. Give me courage to keep going today. Amen.",
 "Father, renew my strength. Let me run and not grow weary. Amen."],
 tips:["Look back at how far you've come, not just how far you have to go. Check your progress calendar.","Break the goal into something you can win today.","Encouragement is contagious. Spend time with people who build you up."]},
{id:"numb",g:"heavy",name:"Numb",heavy:true,adj:"numb",
 verses:["Psalm 42:1-2","Psalm 63:1","Ezekiel 36:26","Psalm 51:12","Revelation 3:20","James 4:8"],
 prayers:["Lord, I don't feel much of anything right now. I'm still showing up. Wake my heart up again. Amen.",
 "God, restore to me the joy of your salvation. I want to feel alive again, close to you and close to people. Amen.",
 "Jesus, you're knocking at the door of my heart. Even when I'm numb, I'm opening it. Come in. Amen."],
 tips:["Numbness is often your mind protecting itself. Be gentle with yourself.","Do one small thing you used to enjoy, even if you don't feel like it.","If you've felt numb for a while, talk to a parent or counselor."]},
{id:"ashamed",g:"heavy",name:"Ashamed",heavy:true,adj:"ashamed",
 verses:["Romans 8:1","Psalm 103:12","Isaiah 1:18","1 John 1:9","Hebrews 8:12","Luke 15:20","Psalm 34:18"],
 prayers:["Lord, I feel so ashamed. Thank you that there is no condemnation for me in Christ. Help me receive your forgiveness and stop punishing myself. Amen.",
 "God, you remove my sin as far as the east is from the west. Help me leave it there. Clean me and help me walk forward. Amen.",
 "Father, like the son who came home, I'm coming back to you. Thank you for running to me instead of turning away. Amen."],
 tips:["Shame wants you to hide. Grace invites you to come home.","Confess it to God, and if it helps, to one trusted person.","Your past doesn't get the final word."]},
{id:"guilty",g:"heavy",name:"Guilty",heavy:true,adj:"weighed down by guilt",
 verses:["1 John 1:9","Psalm 32:5","Psalm 51:1-2","Psalm 51:10","Lamentations 3:22-23","Romans 8:1","Hebrews 4:15-16"],
 prayers:["Lord, I did wrong and I know it. I confess it to you now. Thank you that you're faithful to forgive and cleanse me. Amen.",
 "God, have mercy on me. Wash me clean. Give me a clean heart and help me make it right with anyone I've hurt. Amen.",
 "Jesus, I'm coming boldly to your throne of grace. Thank you for mercy when I need it most. Amen."],
 tips:["Guilt can be a gift. It points you back to God and toward making things right.","If you need to apologize to someone, do it soon.","Once you've confessed, believe you're forgiven."]},
{id:"hurtsomeone",g:"heavy",name:"I hurt someone",heavy:true,adj:"weighed down after hurting someone",
 verses:["Matthew 5:16","Colossians 3:13","Romans 12:18","Psalm 51:10","1 John 1:9","Proverbs 15:1"],
 prayers:["Lord, I hurt someone and I feel awful. Help me own it fully, apologize humbly, and make it right however I can. Amen.",
 "God, heal what I broke in them. Give me the courage to say sorry without excuses. Amen.",
 "Father, help me learn from this so I don't do it again. Make me gentler. Amen."],
 tips:["A real apology names what you did, doesn't make excuses, and asks how to make it right.","Do it in person if you can.","They may need time. Respect that."]},
/* Stirred up */
{id:"angry",g:"stir",name:"Angry",heavy:true,adj:"angry",
 verses:["James 1:19-20","Ephesians 4:26-27","Proverbs 15:1","Proverbs 16:32","Psalm 37:7","Romans 12:21"],
 prayers:["Lord, I'm angry right now. Help me not to sin in it. Slow me down before I say or do something I'll regret. Amen.",
 "God, show me what's under this anger. Help me deal with it honestly and calmly. Amen.",
 "Jesus, give me your gentleness. Let me answer softly and let you handle what I can't. Amen."],
 tips:["Step away for ten minutes before responding.","Breathe slowly and unclench your hands.","Write out what you want to say, then wait before you say any of it."]},
{id:"bitter",g:"stir",name:"Bitter",heavy:true,adj:"bitter",
 verses:["Ephesians 4:31-32","Colossians 3:13","Matthew 6:14-15","Hebrews 12:1-2","Romans 12:21","Matthew 5:44"],
 prayers:["Lord, I've been holding on to this for too long. It's poisoning me. Help me let it go and forgive like you forgave me. Amen.",
 "God, take this root of bitterness out of my heart. Replace it with peace. Amen.",
 "Jesus, I choose to forgive, even if I don't feel it yet. Help my heart catch up. Amen."],
 tips:["Bitterness hurts you more than the other person.","Pray a blessing over them by name, even if it feels fake at first.","Talk to someone wise about what happened."]},
{id:"jealous",g:"stir",name:"Jealous",heavy:true,adj:"jealous",
 verses:["Proverbs 14:30","Galatians 6:4","James 3:16","1 Corinthians 13:4-5","Philippians 4:11","Psalm 73:2-3"],
 prayers:["Lord, I'm jealous of what someone else has. Help me be content with what you've given me and happy for them. Amen.",
 "God, take the comparison out of my heart. Thank you for the gifts you gave me. Amen.",
 "Father, love doesn't envy. Teach me to love others the way you love me. Amen."],
 tips:["Name three things you're grateful for right now.","Congratulate the person you're jealous of. It breaks envy's grip.","Mute accounts that feed comparison."]},
{id:"impatient",g:"stir",name:"Impatient",heavy:true,adj:"impatient",
 verses:["Psalm 27:14","Habakkuk 2:3","Romans 12:12","Ecclesiastes 3:11","James 1:2-4","Psalm 37:7"],
 prayers:["Lord, I want it now and it isn't happening. Teach me to wait on you. Everything is beautiful in its time. Amen.",
 "God, give me patience with people, with myself, and with your timing. Amen.",
 "Father, use this waiting to grow something in me. Help me trust you while I wait. Amen."],
 tips:["Waiting isn't wasted time. Ask God what he's growing in you right now.","Focus on what you can do today.","Patience grows the same way muscles do, through resistance."]},
{id:"restless",g:"stir",name:"Restless",heavy:true,adj:"restless",
 verses:["Psalm 46:10","Psalm 62:5-6","Isaiah 26:3","Psalm 116:7","Matthew 11:28-30","Psalm 16:11"],
 prayers:["Lord, I can't settle down. Help me be still and know that you are God. Quiet my heart. Amen.",
 "God, my soul is looking for something. Let me find my rest in you, not in my phone or the next thing. Amen.",
 "Father, return my soul to rest. You've been good to me. Amen."],
 tips:["Sit in silence for two minutes. It's hard at first and gets easier.","Restlessness often means you've been running on noise. Turn something off.","A short walk while praying helps."]},
{id:"tempted",g:"stir",name:"Tempted",heavy:true,adj:"tempted",
 verses:["1 Corinthians 10:13","James 4:7","Matthew 26:41","Hebrews 4:15-16","Galatians 5:16","Psalm 119:11","2 Timothy 2:22"],
 prayers:["Lord, I'm being tempted right now. You promised a way out. Show me the way and give me strength to take it. Amen.",

p:["Lord, I'm sad and I don't fully know why. Be close to me in it. Amen.",

"Jesus, you wept too. Thank you that I don't have to fake being okay with you. Amen.",
"God, weeping may last for the night, but joy comes in the morning. Hold me until morning. Amen.",
"Lord, comfort me, and bring people around me who will too. Amen.",
"Father, I give you this heaviness. Lift what I can't lift. Amen.",
"Jesus, let me feel your love even when I don't feel much else. Amen."],
t:["Tell someone you're feeling down. You don't have to explain it all.",
"Go outside for a few minutes. Light and air help.",
"Listen to a worship song that tells the truth about God.",
"Be gentle with yourself today. Sad is not the same as bad.",
"Write a short prayer about how you feel, honestly.",
"Do one small kind thing for someone else.",
"Let yourself rest without guilt. Sad days need gentleness."]},

grieving:{v:["Psalm 73:26","Psalm 30:5"],
p:["Lord, I miss them so much. Hold me in this grief. Amen.",
"Father, I don't understand why this happened. Be with me in the questions. Amen.",
"Jesus, you are the resurrection and the life. Give me hope beyond this loss. Amen.",
"God, comfort me as I mourn. You promised that those who mourn will be comforted. Amen.",
"Lord, help me remember the good with thankfulness, not just pain. Amen.",
"Father, some days are harder than others. Give me grace for today. Amen.",
"Jesus, you wept at your friend's grave. Thank you for weeping with me. Amen."],
t:["Let yourself cry. Grief is love with nowhere to go.",
"Talk about the person you lost with someone who knew them.",
"Write down a favorite memory and thank God for it.",
"Grief comes in waves. A hard day doesn't mean you're going backward.",
"Let others help you, even with small things.",
"Read Revelation 21:4 and hold onto that promise.",
"If grief feels too heavy to carry, talk to a pastor or counselor.",
"Visit a place that reminds you of them, and thank God for the time you had."]},

heartbroken:{v:["Psalm 73:26","Isaiah 41:10","Psalm 55:22","Psalm 62:8"],
p:["Lord, my heart hurts. You heal the brokenhearted. Begin healing mine. Amen.",
"Father, I feel rejected and empty. Fill that space with your love. Amen.",
"Jesus, I gave my heart and it got hurt. Help me not close it off completely. Amen.",
"God, help me let go of what's gone and trust you with what's next. Amen.",
"Lord, I pour out my heart to you. You are my refuge. Amen.",
"Father, keep me from bitterness. Help me heal with grace. Amen.",
"Jesus, remind me I'm deeply loved by you, no matter who left. Amen."],
t:["Give yourself time. Healing isn't instant.",
"Avoid scrolling through old photos and messages for now.",
"Spend time with friends and family who love you.",
"Write down what you've learned, without blaming yourself.",
"Pray for the other person, even if it's hard.",
"Don't rush into something new to fill the gap.",
"Read Psalm 34:18. God is close to you right now."]},

lonely:{v:["Isaiah 41:10","Psalm 27:10","John 14:18"],
p:["Lord, I feel alone. Remind me that you're with me always. Amen.",
"Father, place me in community. Give me real friends who love you. Amen.",
"Jesus, you won't leave me as an orphan. Come to me now. Amen.",
"God, help me reach out instead of waiting for someone to notice me. Amen.",
"Lord, be my closest friend today. Let me talk to you like one. Amen.",
"Father, show me someone else who's lonely so I can be a friend to them. Amen.",
"Jesus, even when people are far, you are near. Let me feel that. Amen."],
t:["Text one person today and ask how they're doing.",
"Write a short letter to God about how alone you feel.",
"Sit with someone new at lunch or practice.",
"Talk to God out loud like a friend on a walk.",
"Ask God to bring one good friend into your life, and watch for who he sends.",
"Call a grandparent or relative. They'll love hearing from you.",
"Serve somewhere. Working alongside people builds friendship."]},

rejected:{v:["John 6:37","Ephesians 1:6","Psalm 34:18","1 Samuel 16:7"],
p:["Lord, I was left out and it hurts. Thank you that you will never cast me out. Amen.",
"Father, I'm accepted in your Son. Let that matter more than this rejection. Amen.",
"Jesus, you were rejected too. You understand this pain. Stay with me in it. Amen.",
"God, help me not to believe the lie that I'm unwanted. Amen.",
"Lord, give me grace toward the people who hurt me. Amen.",
"Father, show me where I truly belong, with people who love you. Amen.",
"Jesus, you chose me. Let me rest in being chosen. Amen."],
t:["Remember: one person's no is not God's verdict on you.",
"Spend time with people who already love you.",
"Don't replay the moment over and over. Give it to God.",
"Read John 6:37 and let it sink in.",
"Ask whether there's anything to learn, without beating yourself up.",
"Be the one who includes others, because you know how this feels.",
"Talk to someone you trust about what happened."]},

unloved:{v:["Isaiah 54:10","Isaiah 43:4","Psalm 136:1"],
p:["Lord, I don't feel loved right now. Show me your love in a way I can see. Amen.",
"Father, your love for me doesn't change with my feelings. Help me believe it. Amen.",
"Jesus, you died for me while I was still a sinner. That's real love. Let me rest in it. Amen.",
"God, your kindness will not depart from me, even if the mountains do. Thank you. Amen.",
"Lord, open my eyes to the people around me who do care. Amen.",
"Father, help me love others even when I feel empty, and fill me as I do. Amen.",
"Jesus, you know what it's like to feel abandoned. Stay with me in this. Amen."],
t:["Write down three ways God has shown you love this year.",
"Read 1 John 4:9-10 and notice how God showed his love first.",
"Spend time with a family member or friend who's easy to be around.",
"Notice small kindnesses today, and thank God for each one.",
"Love is often shown in actions. Look for those around you.",
"Spend time with family, even if it's just a meal.",
"Do something loving for someone else. It often refills you too."]},

betrayed:{v:["Psalm 55:12-14","Genesis 50:20","Psalm 55:22"],
p:["Lord, someone I trusted hurt me. You understand betrayal. Be my comfort. Amen.",
"Father, I want to get back at them. Help me leave justice in your hands. Amen.",
"Jesus, Judas betrayed you and you still loved. Teach me that kind of love. Amen.",
"God, what they meant for harm, you can use for good. I'm trusting you with that. Amen.",
"Lord, help me forgive without pretending it didn't hurt. Amen.",
"Father, give me wisdom about whether and how to trust them again. Amen.",
"Jesus, guard my heart from bitterness. Heal what's been broken. Amen."],
t:["Don't respond while you're furious. Wait and pray first.",
"Forgiveness isn't saying it's okay. It's giving the debt to God.",
"Talk to a wise adult about what happened.",
"Set healthy boundaries if trust has been broken.",
"Pray for the person who hurt you, even one sentence.",
"Read Joseph's story in Genesis 37 to 50.",
"Don't spread the story around. Bring it to God and one trusted person."]},

worthless:{v:["Romans 5:8","1 John 3:1","Isaiah 43:1"],
p:["Lord, I feel like nothing. You say I'm precious in your sight. Help me believe you. Amen.",
"Father, you knew every part of me and still sent your Son. That's my worth. Amen.",
"Jesus, you call me by name. I'm yours. Let that be enough today. Amen.",
"God, quiet the voices telling me I don't matter. Speak your truth louder. Amen.",
"Lord, I'm your child. Remind me what that means. Amen.",
"Father, I'm fearfully and wonderfully made. Help me see what you see. Amen.",
"Jesus, my worth isn't in my performance. It's in your love. Amen."],
t:["Write down: God says I am loved, chosen, and his. Read it often.",
"Tell someone you trust how you're feeling about yourself.",
"Read Psalm 139:13-16 slowly.",
"Notice negative self-talk and replace it with what God says.",
"Do something you're good at, and thank God for the gift.",
"Spend less time on apps that make you feel small.",
"If you ever feel like you'd be better off gone, call or text 988 right away, or tell an adult."]},

failure:{v:["2 Corinthians 4:8-9","Philippians 1:6","Isaiah 41:10"],
p:["Lord, I messed up and I feel like a failure. Remind me that you're not done with me. Amen.",
"Father, I fall seven times and get back up because of you. Help me get up today. Amen.",
"Jesus, Peter failed you and you restored him. Restore me too. Amen.",
"God, my identity isn't my worst moment. Thank you for that grace. Amen.",
"Lord, teach me what I need to learn, and help me let the rest go. Amen.",
"Father, your mercy is new every morning. I need it this morning. Amen.",
"Jesus, finish the good work you started in me. I trust you with it. Amen."],
t:["Write down what happened and one lesson, then close the notebook.",
"Failure is an event, not your identity.",
"Talk to a coach, teacher, or parent about how to improve.",
"Read Micah 7:8: when I fall, I will rise.",
"Celebrate one small thing you did right this week.",
"Try again, even in a small way, soon.",
"God uses people who failed. The Bible is full of them."]},

lost:{v:["Psalm 32:8","Proverbs 3:5-6","Luke 19:10","Jeremiah 29:11"],
p:["Lord, I feel lost. You came to seek and save the lost. Find me. Amen.",
"Father, I don't know where I'm going. Instruct me and teach me the way. Amen.",
"Jesus, be my shepherd. Lead me back to green pastures. Amen.",
"God, you have plans for me, plans for good. Show me the next step. Amen.",
"Lord, I've wandered. Thank you for coming after me. Amen.",
"Father, give me direction, and the courage to follow it. Amen.",
"Jesus, I'd rather be lost with you than found without you. Stay with me. Amen."],
t:["Go back to the basics: read a Gospel, pray daily, go to church.",
"Talk to a pastor or mentor about where you are.",
"Write down what you know for sure about God.",
"Take one faithful step today, even a small one.",
"Read Luke 15. God runs to the lost.",
"Spend time with people who are walking closely with God.",
"Feeling lost can be the start of being found. Keep seeking."]}
};

Object.assign(EXTRA_MOODS, {
hopeless:{v:["Psalm 34:18","Romans 8:28","Psalm 62:5-6"],
p:["Lord, I'm in a dark place. Be the light I can't find on my own. Amen.",

"Jesus, I'm holding on by a thread. Hold onto me. Amen.",
"God, you lifted David out of the pit. Lift me too. Amen.",
"Lord, your mercies haven't run out. Let me see one today. Amen.",
"Father, I need people around me. Bring someone to me, and help me reach out. Amen.",
"Jesus, I don't need to feel hopeful to trust you. I'm trusting you right now. Amen."],
t:["Tell someone today how you're really doing. Don't carry this alone.",
"Let someone sit with you today. You don't have to talk much.",
"Remember that feelings, even this one, change over time.",

"Do one tiny thing: drink water, step outside, text a friend.",
"Ask a parent, pastor, or counselor for help. That's strength, not weakness.",
"Write down one thing, however small, that is still good."]},

discouraged:{v:["Psalm 42:11","Isaiah 41:10","2 Corinthians 4:8-9"],
p:["Lord, I'm tired of trying and not seeing results. Help me not give up. Amen.",
"Father, in due season I'll reap if I don't lose heart. Keep my heart from losing hope. Amen.",
"Jesus, encourage me like you encouraged your disciples. Amen.",
"God, remind me of how far you've already brought me. Amen.",
"Lord, give me strength for one more step. Amen.",
"Father, bring someone today who can encourage me. Amen.",
"Jesus, you finish what you start. You started something in me. Amen."],
t:["Look back at a month ago and notice one thing that's better now.",
"Encourage someone else today. It often lifts you too.",
"Read Galatians 6:9 and write it somewhere you'll see it.",
"Rest before you quit. Sometimes you're just tired.",
"Tell a friend you're discouraged and ask them to pray.",
"Celebrate a small win, even a tiny one.",
"Progress isn't always visible. Keep showing up."]},

numb:{v:["Psalm 73:26","Isaiah 42:3","Lamentations 3:22-23","Psalm 51:10"],
p:["Lord, I don't feel much of anything right now. Meet me here anyway. Amen.",
"Father, give me a heart of flesh instead of stone. Soften me. Amen.",
"Jesus, you don't break a bruised reed. Be gentle with me. Amen.",
"God, I'm showing up even though I feel nothing. Thank you for receiving me. Amen.",
"Lord, wake my heart up to you again, slowly. Amen.",
"Father, I'm thirsty for you even if I can't feel it. Amen.",
"Jesus, I'm not going to wait to feel close to you before I talk to you. Here I am. Amen."],
t:["Keep praying even without feelings. Faithfulness matters more than feelings.",
"Read a Psalm out loud. Sometimes saying it helps you feel it.",
"Get outside and notice creation. Psalm 19 says the heavens declare God's glory.",
"Tell someone you trust that you've been feeling numb.",
"Cut back on endless scrolling. It can dull everything else.",
"Do something with your hands: serve, build, help.",
"If numbness lasts a long time, talk to a parent or counselor."]},

ashamed:{v:["Psalm 34:5","Isaiah 54:4","2 Corinthians 5:17"],
p:["Lord, I'm ashamed of what I did. Thank you that there's no condemnation in you. Amen.",
"Father, I want to hide, but you call me out of hiding into your mercy. Amen.",
"Jesus, you carried my shame on the cross. I don't have to carry it anymore. Amen.",
"God, wash me clean. Make me white as snow. Amen.",
"Lord, help me look to you and be radiant, not hide my face. Amen.",
"Father, you ran to the prodigal son. Run to me now. Amen.",
"Jesus, let your grace speak louder than my shame. Amen."],
t:["Confess to God, then believe 1 John 1:9 is true for you.",
"Shame says you are bad. Conviction says you did wrong. Listen to conviction.",
"Tell one trusted person. Shame grows in secret.",
"Read Luke 15:11-24 and picture the father running.",
"Don't punish yourself. Jesus already paid.",
"Do the next right thing today.",
"Write down: I am forgiven, and read it when shame comes back."]},

guilty:{v:["Psalm 103:12","Isaiah 1:18","Micah 7:18-19"],
p:["Lord, I want to stop making excuses for what I did. Give me an honest heart. Amen.",
"Father, create a clean heart in me, and renew a right spirit. Amen.",
"Jesus, thank you for paying for this sin. Help me turn away from it. Amen.",
"God, you throw my sins into the depths of the sea. Let me leave them there. Amen.",
"Lord, show me if I need to make something right with someone. Amen.",
"Father, I don't want cheap grace. I want real change. Help me. Amen.",
"Jesus, thank you that your mercy is bigger than my guilt. Amen."],
t:["Confess it to God specifically, not vaguely.",
"If you hurt someone, apologize without excuses.",
"Make it right where you can: return, repair, or replace.",
"Read Psalm 51, David's prayer after his worst sin.",
"Guilt is meant to lead you to God, not away from him.",
"Ask what led to this, and set up one guardrail.",
"Once you've confessed, accept the forgiveness. Don't keep re-confessing."]},

hurtsomeone:{v:["Matthew 5:23-24","James 5:16","Ephesians 4:31-32","Proverbs 28:13"],
p:["Father, show me how my words or actions landed on them, so I can understand and apologize well. Amen.",
"Father, give me humility to apologize without defending myself. Amen.",
"Jesus, heal the hurt I caused, and soften their heart toward me. Amen.",
"God, show me what I need to change so this doesn't keep happening. Amen.",
"Lord, give me the right words and the right timing. Amen.",
"Father, if they don't forgive me right away, help me be patient. Amen.",
"Jesus, help me love them better from here on. Amen."],
t:["Apologize soon. Don't wait for the perfect moment.",
"Say: I was wrong, I'm sorry, and I want to make it right.",
"Don't add but to your apology.",
"Ask how you can make it right, and actually do it.",
"Give them space if they need it.",
"Pray for them by name today.",
"Reflect on what triggered you, and plan a different response."]},

angry:{v:["Proverbs 29:11","Ephesians 4:31-32","Psalm 4:4","Proverbs 19:11"],
p:["Lord, I'm angry right now. Help me not sin in my anger. Amen.",
"Father, slow me down. Help me be quick to listen and slow to speak. Amen.",
"Jesus, take this heat out of my words before I say something I regret. Amen.",
"God, show me what's under this anger: hurt, fear, or pride. Amen.",
"Lord, help me give a soft answer that turns away wrath. Amen.",
"Father, I give you the right to get even. It's yours, not mine. Amen.",
"Jesus, be still in me. Calm this storm. Amen."],
t:["Ask yourself what the other person might be going through.",
"Breathe slowly and pray one sentence.",
"Don't text while angry. Write it, then delete it.",
"Ask: what am I actually upset about?",
"Talk it through with someone calm.",
"Burn off energy with a walk or run, then pray.",
"Come back and talk when you can listen, not just speak."]},

bitter:{v:["Hebrews 12:15","Romans 12:19","Proverbs 19:11","Luke 6:27-28"],
p:["Lord, I keep replaying what they did. Help me let it go. Amen.",
"Father, pull up any root of bitterness in me before it spreads. Amen.",
"Jesus, you forgave the people who crucified you. Help me forgive. Amen.",
"God, vengeance is yours. I'm giving this to you. Amen.",
"Lord, bless the person I'm bitter toward. I mean it, even if it's hard. Amen.",
"Father, heal the hurt underneath the bitterness. Amen.",
"Jesus, I don't want to carry this anymore. Take it. Amen."],
t:["Notice when you bring up the old hurt in conversation, and choose to let it go.",
"Write what they did, then pray over it and tear it up.",
"Stop rehearsing the story to others.",
"Forgiveness is a choice first, a feeling later.",
"Read Matthew 18:21-35.",
"Ask God to show you one good thing about them.",
"If the hurt is deep, talk to a pastor or counselor."]},

jealous:{v:["Exodus 20:17","Hebrews 13:5","Psalm 37:1","Galatians 5:26"],
p:["Lord, I want what they have. Help me be content with what you've given me. Amen.",
"Father, thank you for my own gifts. Help me stop comparing. Amen.",
"Jesus, help me celebrate others instead of envying them. Amen.",
"God, you are enough for me. Let that be true in my heart. Amen.",
"Lord, show me the good you've placed in my own life. Amen.",
"Father, bless the person I'm jealous of. Help me mean it. Amen.",
"Jesus, my story isn't their story. Help me run my own race. Amen."],
t:["Ask God what he's doing in your own life right now.",
"Write down five things God has given you.",
"Limit time on apps that fuel comparison.",
"Pray for the person's success.",
"Ask what the jealousy reveals about what you value.",
"Read Galatians 6:4. Test your own work.",
"Thank God out loud for one specific gift you have."]},

impatient:{v:["Lamentations 3:25-26","Isaiah 40:31","Galatians 5:22-23","Psalm 62:5-6"],
p:["Lord, I want it now. Teach me to wait well. Amen.",
"Father, your timing is better than mine. Help me trust it. Amen.",
"Jesus, grow patience in me, even if that means waiting. Amen.",
"God, help me be patient with people who annoy me. Amen.",
"Lord, it's good to wait quietly for you. Quiet me. Amen.",
"Father, don't let my impatience push me to rush something you're preparing. Amen.",
"Jesus, show me what you're doing in me while I wait. Amen."],
t:["Breathe before you react to a delay.",
"Use waiting time to pray for someone.",
"Remember: patience is a fruit of the Spirit. It grows slowly.",
"Read Habakkuk 2:3.",
"Ask: what can I do faithfully while I wait?",
"Be patient with yourself too.",
"Thank God for one answered prayer from the past."]},

restless:{v:["Psalm 23:1-3","Philippians 4:11","Psalm 62:1","Exodus 33:14"],
p:["Lord, I can't settle down. Be my rest. Amen.",
"Father, my soul waits for you. Teach it to be still. Amen.",
"Jesus, I keep looking for something to fill me. Fill me with you. Amen.",
"God, help me be content right here, right now. Amen.",
"Lord, your presence will go with me and give me rest. Amen.",
"Father, quiet the urge to keep scrolling, moving, chasing. Amen.",
"Jesus, I find my rest in you. Help me stay there. Amen."],
t:["Write down what you're restless for, and talk to God about it.",
"Put your phone in another room for an hour.",
"Take a walk and pray as you go.",
"Ask: what am I looking for right now?",
"Read Psalm 131.",
"Do one thing slowly and on purpose.",
"Restlessness often points to a need for God. Turn to him."]},

tempted:{v:["James 1:12","Romans 6:14","Psalm 119:9"],
p:["Lord, this feels strong, but you are stronger. I'm holding onto you. Amen.",
"Father, I'm weak, but you are strong. Give me strength to say no. Amen.",
"Jesus, remind me that this moment will pass, and you'll still be here. Amen.",
"God, sin won't have power over me because I'm under grace. Help me live it. Amen.",
"Lord, I want you more than this. Help my desire match my words. Amen.",
"Father, help me run from this, not flirt with it. Amen.",
"Jesus, I resist the devil and draw near to you. Come near to me. Amen."],
t:["Leave the situation physically right now.",
"Text a friend: pray for me.",
"Say a verse out loud, like Jesus did in the wilderness.",
"Ask: what led me here? Change it next time.",
"Temptation peaks and fades. Wait it out with God.",
"Remove access: delete the app, block the site, change the setting.",
"Every no makes the next no easier."]},

doubting:{v:["John 20:29","Psalm 13:1,5","Romans 10:17","James 1:5"],
p:["Lord, I believe. Help my unbelief. Amen.",
"Father, I have questions. Thank you that you're not afraid of them. Amen.",
"Jesus, you met Thomas in his doubt. Meet me in mine. Amen.",
"God, show me something real about you this week. Amen.",
"Lord, faith comes by hearing your Word. Help me keep listening. Amen.",
"Father, I'd rather wrestle with you than walk away. Amen.",
"Jesus, you're still faithful even when my faith is weak. Amen."],
t:["Read a book or listen to a talk that takes your questions seriously.",
"Read the Gospel of John slowly.",
"Remember times God was faithful before.",
"Doubt isn't the opposite of faith. Unbelief is. Keep seeking.",
"Look into good resources that address hard questions.",
"Keep praying, even honest, messy prayers.",
"Stay connected to church while you work through it."]},

distant:{v:["Isaiah 55:6","Luke 15:20","Psalm 73:26"],
p:["Lord, I feel far from you. Draw near to me as I draw near to you. Amen.",

"Father, I want to want you more. Amen.",
"Jesus, you're as close as my next prayer. Here it is. Amen."],
t:["Spend five minutes alone with God today.",
"Read one Psalm and pray it back to God.",
"Go to church or youth group this week.",
"Worship with a song, even alone in your room.",
"Ask: what's taken God's place lately?",
"Tell a friend you feel distant and ask them to pray.",
"Feelings follow actions. Start with small faithful habits."]},

waiting:{v:["Lamentations 3:25-26","Psalm 130:5","Romans 12:12","Psalm 31:15"],

"Ask God to give you peace, not just the answer."]},

direction:{v:["Jeremiah 29:11","Psalm 37:23-24","Proverbs 16:3","Psalm 37:4-5"],

grateful:{v:["Psalm 118:24","Psalm 103:1","Ephesians 5:20"],

"Father, thank you for the people in my life. Amen.",

"Thank someone in person today.",

"Remember today's gratitude when tomorrow is hard."]},

joyful:{v:["Romans 15:13","Philippians 4:4","Psalm 126:3","John 15:11"],
p:["Lord, my heart is full. Thank you for this joy. Amen.",

t:["Text someone and tell them why you're thankful for them.",
"Thank God specifically for what made you happy.",
"Encourage someone who's struggling.",
"Write down this moment so you can remember it later.",

function chartFrame(pts, yOf, labels, colorOf){
  const W=320, H=130, L=26, R=8, T=10, B=18, n=pts.length;
  const x = i => L + (W-L-R)*(i/(n-1));
  let grid = labels.map(([val,txt])=>`<line x1="${L}" x2="${W-R}" y1="${yOf(val)}" y2="${yOf(val)}" stroke="rgba(226,214,255,.1)"/><text x="${L-6}" y="${yOf(val)+3}" text-anchor="end">${txt}</text>`).join("");
  let path="", seg=false, dots="";
  pts.forEach((v,i)=>{ if(v==null){ seg=false; return; } path += (seg?"L":"M")+x(i).toFixed(1)+" "+yOf(v).toFixed(1)+" "; seg=true; dots += `<circle cx="${x(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${i===n-1?4:2.6}" fill="${colorOf(v)}"/>`; });
  const any = pts.some(v=>v!=null);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${grid}<path d="${path}" fill="none" stroke="rgba(185,166,255,.5)" stroke-width="1.8" stroke-linejoin="round"/>${dots}
    <text x="${L}" y="${H-3}">30 days ago</text><text x="${W-R}" y="${H-3}" text-anchor="end">Today</text>
    ${any?"":`<text x="${(W+L)/2}" y="${H/2}" text-anchor="middle" style="font-size:12px">Your days will show up here</text>`}</svg>`;
}
function pracChart(pts){ const T=10,B=112; return chartFrame(pts, v=>B-(v/10)*(B-T), [[0,"0"],[5,"½"],[10,"All"]], v=>scoreColor(1+v*.9)); }
function scoreChart(pts){ const T=10,B=112; return chartFrame(pts, v=>B-(v-1)/9*(B-T), [[1,"1"],[5,"5"],[10,"10"]], scoreColor); }

async function hashPin(pin, salt){
  try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pin)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; const s=salt+":"+pin; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return "f"+h; }
}

function wrEnter(el){

  if (reduceMotion()) return;
  el.querySelectorAll(".wr-big").forEach(b=>{
    const tn = b.firstChild; if (!tn || tn.nodeType!==3) return;
    const m = tn.textContent.trim().match(/^(\+?)(\d+(?:\.\d)?)$/); if (!m) return;
    const target = parseFloat(m[2]), dec = m[2].includes(".") ? 1 : 0, t0 = performance.now() + 250;
    tn.textContent = m[1] + (0).toFixed(dec);
    const tick = t => { const p = Math.max(0, Math.min(1, (t-t0)/1100)); tn.textContent = m[1] + (target*(1-Math.pow(1-p,3))).toFixed(dec); if (p<1) requestAnimationFrame(tick); };

  });
}
function wrGo(i){

  if (s.type==="pin"){
    if (S.pin) return sheetHead("Settings","App lock is on")+`<div class="stack"><p class="muted">Selah asks for your PIN each time it opens. It keeps out people who pick up your phone. It's a privacy screen, not encryption.</p><button class="btn danger block" data-a="pinRemove">Turn off app lock</button></div>`;
    return sheetHead("Settings","Set a 4-digit PIN")+`<div class="stack"><p class="muted small">If you forget it, the only way back in is to erase Selah's data on this device, so back up first.</p>
