  else { const b = root.querySelector(":scope > .body"); if (b) targets = [...b.children]; }

function greeting(){ const h = new Date().getHours(); return h<5?"Still up":h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
function verseOfDay(){
  const pool = new Set(["Lamentations 3:22-23","Psalm 118:24","Philippians 1:6","Isaiah 40:31","Proverbs 3:5-6","Romans 8:28","Psalm 46:10"]);
  active().forEach(s=>(THEMES[s.theme]||THEMES.general).verses.forEach(v=>pool.add(v)));
  (S.profile.moods||[]).forEach(id=>MOOD[id]&&MOOD[id].verses.forEach(v=>pool.add(v)));
  ["grateful","hopeful","peaceful"].forEach(id=>MOOD[id].verses.forEach(v=>pool.add(v)));
  const arr = [...pool].sort(), n = dayNum(todayK());
  const order = seeded(arr.length, 7 + Math.floor(n/arr.length));
  return arr[order[n % arr.length]];
}
function focusStruggle(){
  const a = active(); if (!a.length) return null;
  const t = todayK(); let best=null, bv=11;
  a.forEach(s=>{ const v = avgRange(s.id, addDays(t,-1), 7); if (v!=null && v<bv){ bv=v; best=s; } });
  return best || a[dayNum(t) % a.length];
}

function finishReflect(){
  const r = ui.reflect, t = todayK();
  if (!Object.keys(r.vals).length) return;
  const wasDone = reflected(t);
  if (!wasDone){
    const rs = restoredSet(); const prev = reflectedKeys().filter(k=>k<t).pop();
    if (prev && !covered(addDays(t,-1),rs) && !restoreOffer()) S.flags.comeback = true;
  }
  const d = ensureDay(t);
  d.ratings = Object.assign({}, r.vals); d.notes = {};
  Object.entries(r.notes).forEach(([k,v])=>{ if(String(v).trim() && r.vals[k]!=null) d.notes[k]=String(v).trim(); });
  d.dayNote = r.dayNote.trim();
  if (r.grat.trim()){ d.gratitude = r.grat.trim(); d.practices.gratitude = true; }
  d.reflectedAt = Date.now();
  save(); flush();
  let low=null, lv=11; r.items.forEach(it=>{ const v=r.vals[it.id]; if(v!=null&&v<lv){lv=v;low=it;} });
  const s = low && S.struggles.find(x=>x.id===low.id);
  const th = s ? (THEMES[s.theme]||THEMES.general) : THEMES.general;
  const ref = lv>=8 ? MOOD.grateful.verses[pick("doneG",MOOD.grateful.verses.length)] : th.verses[pick("done:"+(s?s.theme:"general"), th.verses.length)];
  const list = buildAdvice(r.items, r.vals); ui.reflect = null;
  if (list.length){ ui.view = {type:"advice", i:0, list, shown:Math.min(3, list.length), done:{ref, wasDone}}; render(); toTop(); }
  else goDone({ref, wasDone});
}

function chartFrame(pts, yOf, labels, colorOf){
  const W=320, H=130, L=26, R=8, T=10, B=18, n=pts.length;
  const x = i => L + (W-L-R)*(i/(n-1));
  let grid = labels.map(([val,txt])=>`<line x1="${L}" x2="${W-R}" y1="${yOf(val)}" y2="${yOf(val)}" stroke="rgba(226,214,255,.1)"/><text x="${L-6}" y="${yOf(val)+3}" text-anchor="end">${txt}</text>`).join("");
  let path="", seg=false, dots="";
  pts.forEach((v,i)=>{ if(v==null){ seg=false; return; } path += (seg?"L":"M")+x(i).toFixed(1)+" "+yOf(v).toFixed(1)+" "; seg=true; dots += `<circle cx="${x(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${i===n-1?4:2.6}" fill="${colorOf(v)}"/>`; });
  const any = pts.some(v=>v!=null);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${grid}<path d="${path}" fill="none" stroke="rgba(185,166,255,.5)" stroke-width="1.8" stroke-linejoin="round"/>${dots}
    <text x="${L}" y="${H-3}">30 days ago</text><text x="${W-R}" y="${H-3}" text-anchor="end">Today</text>
    ${any?"":`<text x="${(W+L)/2}" y="${H/2}" text-anchor="middle" style="font-size:12px">Your days will show up here</text>`}</svg>`;
}
function pracChart(pts){ const T=10,B=112; return chartFrame(pts, v=>B-(v/10)*(B-T), [[0,"0"],[5,"½"],[10,"All"]], v=>scoreColor(1+v*.9)); }
function scoreChart(pts){ const T=10,B=112; return chartFrame(pts, v=>B-(v-1)/9*(B-T), [[1,"1"],[5,"5"],[10,"10"]], scoreColor); }

async function hashPin(pin, salt){
  try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pin)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; const s=salt+":"+pin; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return "f"+h; }
}

const WR_BG = ["#1f1840","#2a1840","#16203f","#2c1a33","#18243a","#221b42","#28193a"];
function buildReview(){
  const t = reviewEnd(), start = addDays(t,-6), pStart = addDays(t,-13), pEnd = addDays(t,-7);

  const slides = [];
  const range = weekRange(t);
  slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.7)">${esc(range)}</div><div class="wr-h" style="font-size:44px">${esc(name)},<br>here's your week.</div><p class="wr-p">Seven days of showing up, being honest, and growing. Tap to keep going.</p>`);
  if (st.current>0) slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.7)">Your streak</div><div class="wr-big num">${st.current}</div><div class="wr-h">${st.current===1?"day":"days"} in a row</div><p class="wr-p">${st.current>=st.best&&st.current>2?"That's the longest you've ever gone. Keep going.":st.best>st.current?"Your best is "+st.best+". You're building back toward it.":"Every day you reflect adds to it."}</p>`);
  slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.7)">You showed up</div><div class="wr-big num">${refl}<span style="font-size:.32em;opacity:.6;letter-spacing:0;margin-left:.25em">of 7</span></div><div class="wr-h">${refl>=7?"Every single day.":refl>=5?"Most days this week.":refl>0?"days you paused with God.":"A fresh week starts now."}</div><p class="wr-p">${refl>reflPrev&&reflPrev>0?"That's "+(refl-reflPrev)+" more than the week before.":refl===reflPrev&&refl>0?"Steady, same as last week. Consistency is how change happens.":"Honest reflection is the first step toward real change."}</p>`);

  const rows = S.struggles.map(s=>{ const a=avg(Object.keys(S.days).filter(inWeek).map(k=>ratingOn(k,s.id)).filter(v=>v!=null)); const b=avg(Object.keys(S.days).filter(inPrev).map(k=>ratingOn(k,s.id)).filter(v=>v!=null)); return {s,a,b,d:a!=null&&b!=null?a-b:null}; }).filter(r=>r.a!=null);
  const ups = rows.filter(r=>r.d!=null&&r.d>0.2).sort((x,y)=>y.d-x.d);
  if (ups.length){
    const u = ups[0];
    slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.7)">Biggest improvement</div><div class="wr-h">${esc(u.s.name)}</div><div class="wr-big num" style="font-size:min(22vw,96px)">+${one(u.d)}</div>
      <div class="stack" style="gap:10px;margin-top:6px"><div class="wr-bar"><span style="width:84px">Last week</span><span class="track"><b style="width:${u.b*10}%;opacity:.5"></b></span><span class="num">${one(u.b)}</span></div><div class="wr-bar"><span style="width:84px">This week</span><span class="track"><b style="width:${u.a*10}%"></b></span><span class="num">${one(u.a)}</span></div></div>
      <p class="wr-p">God is working on this with you. ${ups.length>1?"You also improved in "+ups.slice(1,3).map(r=>esc(r.s.name)).join(" and ")+".":""}</p>`);

function wrEnter(el){
  if (!el) return;
  [...el.children].forEach((c,i)=>c.style.setProperty("--i", i));
  if (reduceMotion()) return;
  el.querySelectorAll(".wr-big").forEach(b=>{
    const tn = b.firstChild; if (!tn || tn.nodeType!==3) return;
    const m = tn.textContent.trim().match(/^(\+?)(\d+(?:\.\d)?)$/); if (!m) return;
    const target = parseFloat(m[2]), dec = m[2].includes(".") ? 1 : 0, t0 = performance.now() + 250;
    tn.textContent = m[1] + (0).toFixed(dec);
    const tick = t => { const p = Math.max(0, Math.min(1, (t-t0)/1100)); tn.textContent = m[1] + (target*(1-Math.pow(1-p,3))).toFixed(dec); if (p<1) requestAnimationFrame(tick); };

}
function wrGo(i){
  const w = ui.wr; if (!w || i<0 || i>=w.slides.length || i===w.i) return;
  const root = appEl.querySelector(".wr"); if (!root){ w.i = i; render(); wrSchedule(); return; }

  root.querySelectorAll(".wr-bars i").forEach((el,j)=>{ el.className = j<i?"done":j===i?"cur":""; el.innerHTML = "<b></b>"; });
  root.querySelector(".wr-foot").innerHTML = wrFoot();
  root.querySelectorAll(".wr-slide.leave,.wr-slide.leave-back").forEach(o=>o.remove());

  if (old){
    old.style.top = old.offsetTop+"px"; old.style.height = old.offsetHeight+"px";

    old.insertAdjacentElement("afterend", next);

/* ---------------- toasts ---------------- */
function toast(html, ms, cls){
  const el = document.createElement("div"); el.className = "toast" + (cls ? " " + cls : ""); el.innerHTML = html; el.setAttribute("role","status");
  toastRoot.appendChild(el);
  setTimeout(()=>{
    if (cls === "achx"){ el.classList.add("out"); setTimeout(()=>el.remove(),420); return; }
    el.style.transition="opacity .3s, transform .3s"; el.style.opacity="0"; el.style.transform="translateY(-8px)"; setTimeout(()=>el.remove(),320);
  }, ms||2600);
}
const simpleToast = t => toast(`<span style="font-weight:600">${esc(t)}</span>`);

/* ---------------- downloads ---------------- */
function download(name, text, type){
  try{ const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500); return true; }catch(e){ return false; }
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e2){ return false; }
  }
}
function backupText(){ return JSON.stringify(Object.assign({}, S, {exportedAt:new Date().toISOString(), app:"selah"})); }
function parseBackup(txt){ try{ const o = JSON.parse(txt); if (!o || typeof o!=="object" || !("days" in o) || !("struggles" in o)) return null; return o; }catch(e){ return null; } }

};
const SERIOUS = new Set(["purity","substances","money","food"]);
function rsTheme(){ const v = ui.view; const s = v.sid && S.struggles.find(x=>x.id===v.sid); return s ? (THEMES[s.theme]?s.theme:"general") : "general"; }
function rsName(){ const v = ui.view; const s = v.sid && S.struggles.find(x=>x.id===v.sid); return s ? s.name : ""; }
/* each piece of content is chosen once per visit, so going back and forth shows the same thing */
function rc(key, arr){ const c = ui.view.c; if (c[key]==null || c[key]>=arr.length) c[key] = pick("rs:"+key, arr.length); return arr[c[key]]; }
function goodNote(sid){
  if (!sid) return null;
  const ks = Object.keys(S.days).sort().reverse();
  for (const k of ks){ const d = S.days[k]; const v = d.ratings && d.ratings[sid]; const n = d.notes && d.notes[sid]; if (v!=null && v>=8 && n && String(n).trim()) return {k, n:String(n).trim(), v}; }
  return null;
}
function rsBuild(){
  const v = ui.view, seq = ["pick"];
  if (v.path && v.path!=="over" && v.askWhich) seq.push("which");
  if (v.path) RS_SEQ[v.path].forEach(st=>{ if (st==="note" && !goodNote(v.sid)) return; if (st==="look" && !v.sid) return; seq.push(st); });
  v.seq = seq;
}
function rescueOpen(sid){
  clearInterval(rsTimer);
  ui.view = { type:"rescue", pos:0, seq:["pick"], path:null, sid:sid||null, presel:!!sid, askWhich:false, c:{}, ret:ui.view, won:false, after:null };
  render(); toTop();
}
function rsGo(pos){
  const v = ui.view; clearInterval(rsTimer);
  v.after = null; v.pos = Math.max(0, Math.min(pos, v.seq.length-1));
  render(); toTop();
  if (v.seq[v.pos]==="wait") rsStartTimer();
}
function rsStartTimer(){
  const v = ui.view; if (!v.waitStart) v.waitStart = Date.now();
  const tick = () => { const el = document.getElementById("rs-timer"); if (!el || !ui.view || ui.view.type!=="rescue"){ clearInterval(rsTimer); return; }
    const left = Math.max(0, 600 - Math.floor((Date.now()-ui.view.waitStart)/1000));
    el.textContent = left ? Math.floor(left/60)+":"+String(left%60).padStart(2,"0") : "Ten minutes. You made it.";
    if (!left) clearInterval(rsTimer); };
  tick(); rsTimer = setInterval(tick, 1000);
}
function rsClose(){ clearInterval(rsTimer); const r = ui.view && ui.view.ret; ui.view = r || null; render(); toTop(); }
function vRescue(){
  const v = ui.view, cur = v.after || v.seq[v.pos], th = THEMES[rsTheme()] || THEMES.general, nm = rsName();
  const head = `<div class="row obhead"><button class="iconbtn quiet" data-a="rsClose" aria-label="Close">${I.close}</button><div class="grow">${progBar()}</div></div>`;
  const next = (label) => `<div class="row"><button class="btn soft" data-a="rsBack">Back</button><button class="btn primary lg grow" data-a="rsNext">${label||"Next"}</button></div>`;
  const big = (eyebrow, text, extra) => `<div class="eyebrow acc">${eyebrow}</div><h1 class="q-t">${esc(text)}</h1>${extra||""}`;
  let body = "", foot = "";
  if (cur==="pick"){
    body = `<div class="eyebrow acc">Right now</div><h1 class="q-t">What's happening?</h1><p class="lead">Tap the closest one. This takes about a minute.</p>
      <div class="opts">${RS_PATHS.map(([id,a,b])=>`<button class="opt" data-a="rsPath" data-v="${id}"><span class="grow"><span style="display:block">${a}</span><span class="small faint" style="font-weight:400">${b}</span></span><span class="chev">${I.chev}</span></button>`).join("")}</div>`;
  } else if (cur==="which"){
    const act = active();
    body = `<div class="eyebrow acc">Which one?</div><h1 class="q-t">What are you fighting right now?</h1>
      <div class="opts">${act.map(s=>`<button class="opt" data-a="rsWhich" data-v="${s.id}"><span class="grow">${esc(s.name)}</span><span class="chev">${I.chev}</span></button>`).join("")}<button class="opt" data-a="rsWhich" data-v=""><span class="grow">Something else</span><span class="chev">${I.chev}</span></button></div>`;
  } else if (cur==="name"){
    body = big("Name it", rc("name", RESCUE.name)); foot = next();
  } else if (cur==="act"){
    body = big("Change your situation", rc("act:"+rsTheme(), th.actions||THEMES.general.actions), `<p class="lead">Do it now, then tap Next.</p><button class="linkbtn" data-a="rsAnother" data-k="act:${rsTheme()}" style="align-self:flex-start">Another idea</button>`); foot = next("Done it");
  } else if (cur==="pray"){
    body = big("Pray", rc("q:"+rsTheme(), th.quick||THEMES.general.quick), `<p class="lead">Say it out loud or in your head. Mean it.</p>`); foot = next();
  } else if (cur==="verse"){
    const pool = v.path==="over" ? MOOD.overwhelmed.verses : th.verses, ref = rc("v:"+(v.path==="over"?"over":rsTheme()), pool);
    body = `<div class="eyebrow acc">Hold onto this</div>${verseBlock(ref,{xl:true})}`; foot = next();
  } else if (cur==="note"){
    const g = goodNote(v.sid);
    body = `<div class="eyebrow acc">Your own words</div><h1 class="q-t" style="font-weight:600">“${esc(g.n)}”</h1><p class="lead">You wrote this on ${esc(fmtDate(g.k,{month:"long",day:"numeric"}))}, a day you rated ${g.v} for ${esc(nm)}. You've done it before.</p>`; foot = next();
  } else if (cur==="wait"){
    body = `<div class="orb" style="width:150px;height:150px;margin:6px auto 4px"></div><div class="eyebrow acc" style="text-align:center">Let it pass</div><h1 class="q-t" style="text-align:center;font-size:26px">${esc(rc("wait", RESCUE.wait))}</h1><p class="num" id="rs-timer" style="text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em">10:00</p>`;
    foot = next("I'm okay now");
  } else if (cur==="check"){
    if (v.won){ body = big("Well done", rc("through", RESCUE.through)); foot = `<button class="btn primary lg block" data-a="rsClose">Done</button>`; }
    else body = `<div class="eyebrow acc">Check in</div><h1 class="q-t">How are you now?</h1><div class="opts">
      <button class="opt" data-a="rsWin"><span class="grow">I got through it</span><span class="chev">${I.chev}</span></button>
      <button class="opt" data-a="rsStill"><span class="grow">I'm still struggling</span><span class="chev">${I.chev}</span></button></div>`;
  } else if (cur==="still"){
    body = big("Keep going", rc("still", RESCUE.still), `<p class="lead">${esc(rc("tell", RESCUE.tell))}</p>`);
    foot = `<div class="stack" style="gap:10px"><button class="btn primary lg block" data-a="rsAgain">Go through it again</button><div class="row"><button class="btn soft grow" data-a="roomOpen">Prayer Room</button><button class="btn ghost grow" data-a="rsClose">Close</button></div></div>`;
  } else if (cur==="grace"){
    const ref = rc("gv", ["1 John 1:9","Lamentations 3:22-23","Psalm 103:12","Romans 8:1","Micah 7:18-19","Isaiah 1:18","Psalm 51:10","Luke 15:20","Hebrews 4:15-16","Proverbs 24:16"]);
    body = big("First, grace", rc("grace", RESCUE.grace), `<div class="card" style="margin-top:4px">${verseBlock(ref)}</div>`); foot = next();
  } else if (cur==="confess"){
    body = `<div class="eyebrow acc">Pray</div><p class="prayer" style="font-size:21px;line-height:1.5">${esc(rc("confess", RESCUE.confess))}</p>`; foot = next();
  } else if (cur==="next"){
    body = big("One next step", rc("tip:"+rsTheme(), th.tips), `<button class="linkbtn" data-a="rsAnother" data-k="tip:${rsTheme()}" style="align-self:flex-start">Another idea</button>`); foot = next();
  } else if (cur==="streak"){
    body = big("Your streak", reflected(todayK()) ? "You already reflected today, and your streak is safe. Be honest if you update it." : rc("streak", RESCUE.streak)); foot = next();
  } else if (cur==="tell"){
    body = big("You're not alone", rc("tell", RESCUE.tell), SERIOUS.has(rsTheme()) ? `<p class="lead">If this feels like it's controlling your life, a pastor, counselor, or doctor is a wise next step. That's strength, not weakness.</p>` : ""); foot = next();
  } else if (cur==="look"){
    const t = todayK(); let cells = "", best = null;
    for (let i=13;i>=0;i--){ const k = addDays(t,-i), r = ratingOn(k, v.sid); cells += `<i style="${r!=null?`background:${scoreColor(r)}`:""}"></i>`; }
    for (let i=0;i<30;i++){ const k = addDays(t,-i), r = ratingOn(k, v.sid); if (r!=null && (!best || r>best.v)) best = {k, v:r}; }
    const g = goodNote(v.sid);
    body = `<div class="eyebrow acc">Look back · ${esc(nm)}</div><h1 class="q-t">The last two weeks</h1><div class="minis rs-minis">${cells}</div>
      ${best?`<p class="lead">Your best day this month was a ${best.v}, on ${esc(fmtDate(best.k,{month:"long",day:"numeric"}))}. That's still you.</p>`:`<p class="lead">Every day you rate builds a picture of where God is moving.</p>`}
      ${g?`<div class="card"><div class="eyebrow">You wrote on a good day</div><p style="margin-top:6px">“${esc(g.n)}”</p></div>`:""}`; foot = next();
  } else if (cur==="rough"){
    body = big("Keep perspective", rc("rough", RESCUE.rough)); foot = next();
  } else if (cur==="goal"){
    body = big("One small goal", rc("goal", RESCUE.goal)); foot = next();
  } else if (cur==="ground"){
    body = `<div class="orb" style="width:150px;height:150px;margin:6px auto 4px"></div><div class="eyebrow acc" style="text-align:center">Slow down</div><h1 class="q-t" style="text-align:center;font-size:26px">${esc(rc("ground", RESCUE.ground))}</h1>`; foot = next();
  } else if (cur==="calm"){
    body = `<div class="eyebrow acc">Pray</div><p class="prayer" style="font-size:21px;line-height:1.5">${esc(rc("calm", RESCUE.calm))}</p>`; foot = next();
  } else if (cur==="crisis"){
    body = `<div class="eyebrow acc">You don't carry this alone</div><h1 class="q-t">Tell someone tonight.</h1><p class="lead">A parent, a pastor, a coach, or a friend. Selah can help you pause, but it can't replace people who love you.</p>${crisisCard()}`; foot = next();
  } else if (cur==="end"){
    const msg = v.path==="gave" ? "Get some rest. Tomorrow is new, and so is His mercy." : v.path==="rough" ? "Keep going. You're not alone in this season." : "Be gentle with yourself tonight. God is with you.";
    body = big("Before you go", msg);
    foot = `<div class="stack" style="gap:10px">${reflected(todayK())?"":`<button class="btn primary lg block" data-a="reflectStart">Reflect now</button>`}<button class="btn ${reflected(todayK())?"primary lg":"soft"} block" data-a="rsClose">Done</button></div>`;
  }
  return `<div class="wrap full ob">${head}<div class="body">${body}</div>${foot?`<div class="foot">${foot}</div>`:""}</div>`;
}

/* ---------------- advice after reflecting ---------------- */
const bandOf = v => v<=4 ? "r" : v<=7 ? "m" : "s";
function buildAdvice(items, vals){
  const list = items.map(it=>{ const s = S.struggles.find(x=>x.id===it.id); return {it, s, v:vals[it.id]}; })
    .filter(o=>o.v!=null && (o.it.id==="_walk" || (o.s && !o.s.custom)))
    .sort((a,b)=>a.v-b.v)
    .map(o=>{ const theme = o.s && THEMES[o.s.theme] ? o.s.theme : "general", th = THEMES[theme], band = bandOf(o.v), pool = ADVICE[theme][band];
      return { id:o.it.id, name:o.it.name, v:o.v, theme, advice:pool[pick("adv:"+theme+":"+band, pool.length)], ref:th.verses[pick("advV:"+theme, th.verses.length)], quick:(th.quick||[])[pick("advQ:"+theme, (th.quick||[]).length)] }; });
  return list;
}
function vAdvice(){
  const v = ui.view, a = v.list[v.i], shown = v.shown, last = v.i>=shown-1;
  const head = `<div class="row obhead"><button class="iconbtn quiet" data-a="advSkip" aria-label="Skip">${I.close}</button><div class="grow">${progBar()}</div></div>`;
  const body = `<div class="eyebrow acc">After your reflection · ${v.i+1} of ${shown}</div>
    <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap"><h1 class="q-t" style="font-size:30px">${esc(a.name)}</h1><span class="pill num" style="background:${scoreTint(a.v,.16)};color:${scoreColor(a.v)}">${a.v} · ${LABELS[a.v]}</span></div>
    <p class="body-lg" style="font-size:20px;line-height:1.45">${esc(a.advice)}</p>
    <div class="card">${verseBlock(a.ref)}</div>
    ${a.quick?`<p class="prayer muted" style="font-style:italic">Pray: ${esc(a.quick)}</p>`:""}
    ${a.v<=3?`<button class="btn soft block" data-a="rescueOpen" data-v="${a.id==="_walk"?"":a.id}">I need help right now</button>`:""}`;
  const more = last && v.list.length>shown ? `<button class="linkbtn" data-a="advMore" style="align-self:center">See the rest (${v.list.length-shown})</button>` : "";
  const foot = `<div class="stack" style="gap:12px">${more}<div class="row">${v.i>0?`<button class="btn soft" data-a="advBack">Back</button>`:""}<button class="btn primary lg grow" data-a="advNext">${last?"Finish":"Next"}</button></div></div>`;
  return `<div class="wrap full ob">${head}<div class="body">${body}</div><div class="foot">${foot}</div></div>`;
}
function goDone(done){
  ui.view = Object.assign({type:"done"}, done); render(); toTop();
  setTimeout(()=>checkAch(), 700);
  const t = todayK();
  if (new Date().getDay()===3 && S.flags.wedAsk!==t){
    S.flags.wedAsk = t; save();
    setTimeout(()=>{ if (ui.view && ui.view.type==="done" && !ui.sheet && !ui.wr){ ui.addSel=[]; ui.pq=""; openSheet({type:"addStr", wed:true, q:RESCUE.wed[pick("wed", RESCUE.wed.length)]}); } }, 1300);
  }
}

Object.assign(A, {
  rescueOpen: el => rescueOpen(el && el.dataset ? (el.dataset.v||null) : null),
  rsClose: () => rsClose(),
  rsPath: el => { const v = ui.view; v.path = el.dataset.v; v.won = false; v.waitStart = 0;
    const act = active();
    if (v.path==="over"){ /* no struggle needed */ }
    else if (!v.presel){ if (act.length===1) v.sid = act[0].id; else if (act.length>1){ v.askWhich = true; v.sid = null; } }
    rsBuild(); rsGo(1); },
  rsWhich: el => { const v = ui.view; v.sid = el.dataset.v || null; v.askWhich = true; rsBuild(); const i = v.seq.indexOf("which"); rsGo(i+1); },
  rsNext: () => { const v = ui.view; if (v.pos < v.seq.length-1) rsGo(v.pos+1); else rsClose(); },
  rsBack: () => { const v = ui.view; if (v.after){ v.after = null; render(); return; } if (v.pos>0) rsGo(v.pos-1); },
  rsAnother: el => { const k = el.dataset.k; delete ui.view.c[k]; render(); },
  rsWin: () => { const v = ui.view; if (!v.won){ v.won = true; S.wins = S.wins||[]; S.wins.push({d:todayK(), sid:v.sid||"", at:Date.now()}); save(); checkAch(); } render(); },
  rsStill: () => { const v = ui.view; v.after = "still"; render(); toTop(); },
  rsAgain: () => { const v = ui.view; v.after = null; v.waitStart = 0; ["act:"+rsTheme(),"q:"+rsTheme(),"wait","still"].forEach(k=>delete v.c[k]); rsGo(Math.max(1, v.seq.indexOf("act"))); },
  advNext: () => { const v = ui.view; if (v.i < v.shown-1){ v.i++; render(); toTop(); } else goDone(v.done); },
  advBack: () => { const v = ui.view; if (v.i>0){ v.i--; render(); toTop(); } },
  advMore: () => { const v = ui.view; v.shown = v.list.length; v.i++; render(); toTop(); },
  advSkip: () => goDone(ui.view.done)
});

/* ---------------- refresh the app every hour ---------------- */
const LOADED_AT = Date.now();
function canReload(){
  const ae = document.activeElement;
  return S.onboarded && !ui.view && !ui.wr && !ui.sheet && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
}
function hourlyReload(){
  if (Date.now()-LOADED_AT < 3600e3 || !canReload()) return;
  try{ flush(); }catch(e){}
  try{ sessionStorage.setItem("selah_reload", JSON.stringify({at:Date.now(), tab:ui.tab, unlocked:!!ui.unlocked})); }catch(e){}
  location.reload();
}
setInterval(hourlyReload, 60e3);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) setTimeout(hourlyReload, 400); });
(function(){ try{ const r = JSON.parse(sessionStorage.getItem("selah_reload")||"null"); sessionStorage.removeItem("selah_reload");
  if (r && Math.abs(Date.now()-r.at) < 300e3){ if (r.tab) ui.tab = r.tab; if (r.unlocked) ui.unlocked = true; } }catch(e){} })();

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
function applyRate(el){
  const v = +el.value, id = el.dataset.id; ui.reflect.vals[id] = v; el.classList.remove("untouched");
  const sc=$("#score"), lb=$("#score-label"); if (sc){ sc.innerHTML = v+"<small>/10</small>"; sc.style.color = scoreColor(v); } if (lb) lb.textContent = LABELS[v];
  const nb = document.querySelector('.foot [data-a="rNext"]'); if (nb) nb.textContent = "Next";
}
document.addEventListener("input", e=>{
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k==="obName"){ ui.ob.name = el.value; const b=$("#ob-next"); if(b) b.disabled = !el.value.trim(); }
  else if (k==="pq"){ ui.pq = el.value; rerenderPicker(el.dataset.ctx); }
  else if (k==="rate"){ applyRate(el); }
  else if (k==="rnote"){ ui.reflect.notes[el.dataset.id] = el.value; }
  else if (k==="dayNote"){ ui.reflect.dayNote = el.value; }
  else if (k==="rGrat"){ ui.reflect.grat = el.value; }
});
document.addEventListener("pointerup", e=>{ const el=e.target; if (el.classList && el.classList.contains("range") && el.classList.contains("untouched") && ui.reflect) applyRate(el); });
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.id==="import-file" && el.files && el.files[0]){
    const fr = new FileReader(); fr.onload = () => { const o = parseBackup(String(fr.result)); if (!o){ const er=sheetRoot.querySelector("#import-err"); if(er) er.textContent="That file isn't a Selah backup."; return; } ui.sheet.pending = {obj:o, refl:Object.keys(o.days||{}).filter(k=>o.days[k].ratings&&Object.keys(o.days[k].ratings).length).length, str:(o.struggles||[]).length}; renderSheet(); }; fr.readAsText(el.files[0]);
  }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && ui.sheet) closeSheet();
  if (ui.wr && (e.key==="ArrowRight"||e.key===" ")) { e.preventDefault(); if (ui.wr.i < ui.wr.slides.length-1) wrGo(ui.wr.i+1); else wrClose(); }
  if (ui.wr && e.key==="ArrowLeft") wrGo(ui.wr.i-1);
  if (ui.wr && e.key==="Escape") wrClose();
  if (e.key==="Enter" && e.target && e.target.id==="custom-str"){ e.preventDefault(); const b = (ui.sheet?sheetRoot:document).querySelector('[data-a="addCustom"]'); if (b) A.addCustom(b); }
  if (e.key==="Enter" && e.target && e.target.id==="ob-name" && ui.ob.name.trim()){ e.preventDefault(); A.obNext(); }
});
/* midnight rollover while open */
/* new day at midnight: refresh automatically */
let lastDay = todayK(), dayTimer = null;
function newDay(){
  const t = todayK(); if (t===lastDay) return; lastDay = t;
  if (ui.view && ["reflect","room","rescue","advice"].includes(ui.view.type)) { scheduleMidnight(); return; }
  if (ui.sheet) closeSheet();
  ui.view = null; ui.wr = null; ui.cal = null; ui.tab = "today"; clearTimeout(wrTimer);
  lastKey = null; render(); toTop();
  if (S.onboarded) checkAch(true);
  maybeAutoReview();
  scheduleMidnight();
}
function scheduleMidnight(){ clearTimeout(dayTimer); const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1, 0, 0, 2); dayTimer = setTimeout(newDay, m-n); }
scheduleMidnight();
setInterval(newDay, 20000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ newDay(); maybeAutoReview(); } });
window.addEventListener("pageshow", newDay);
window.addEventListener("focus", newDay);

/* ---------------- boot ---------------- */
const ls = lsRead(); if (ls) S = hydrate(ls);
render();
if (S.onboarded) checkAch(true);
idbRead().then(o=>{
  if (o && (o.updatedAt||0) > (S.updatedAt||0)){ S = hydrate(o); lsWrite(o); render(); }
  else if (S.updatedAt && (!o || (o.updatedAt||0) < S.updatedAt)) idbWrite(JSON.parse(JSON.stringify(S)));
}).then(()=>maybeAutoReview(), ()=>maybeAutoReview());
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();

</script>
</body>
