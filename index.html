"Holy Spirit, grow contentment in me. Not the kind that stops trying, but the kind that's at peace with where you have me right now. I want to be able to work hard toward goals without feeling miserable until I reach them.\n\nHelp me celebrate where I am. Help me be generous with what I have. Help me love the people around me instead of envying them. When I start comparing, interrupt me and turn my attention back to you. Let me find my joy in your presence, which no one can take from me and no one else's success can shrink. Amen."],
approval:[
"Lord, I care too much about what people think of me. I change how I act depending on who I'm with. I say yes when I want to say no. I check my phone for likes, replay conversations, and worry about whether people actually like me. It's exhausting.\n\nRemind me that your approval is the one that matters, and I already have it. In Jesus, you call me your child, and you're not waiting for me to impress you. Help me live for an audience of one. Give me the courage to be who you made me, even when it's not popular. And free me from needing everyone to like me, because that's a weight I was never meant to carry. Amen.",
"Father, I'm a people-pleaser. I avoid conflict, I go along with things I don't agree with, and I can't stand the thought of letting someone down. I tell myself it's kindness, but a lot of the time it's fear.\n\nTeach me the difference between loving people and being controlled by them. Give me the courage to say no kindly, to stand up for what's right, and to disappoint people when I need to. Help me trust that you'll take care of my relationships when I do what's right. Make me someone whose yes means yes and whose no means no. Amen.",
"Jesus, people rejected you, misunderstood you, and walked away from you, and you still knew exactly who you were. You didn't need the crowd to tell you that you mattered. I want that kind of security.\n\nRoot my identity in your love, not in other people's opinions. When I'm praised, help me not to let it go to my head. When I'm criticized, help me listen for anything true and let the rest go. When I'm ignored, remind me that you see me. Let my confidence come from you, because then nothing anyone says can take it away. Amen.",
"God, I spend a lot of time thinking about how I look, my face, my body, my clothes, and my image. I want people to notice me and think I'm attractive, impressive, or cool. I know looks aren't wrong, but I've made them too important.\n\nRemind me that you look at the heart, not just the outside. Help me take care of myself without obsessing over my reflection. Let me be known more for my character than for my appearance. Teach me that beauty fades, but a heart that fears you lasts. And help me see myself the way you do, fearfully and wonderfully made. Amen.",
"Lord, I've been fake. I act one way around certain people and another way around others. I hide parts of myself, including my faith sometimes, so that I'll fit in. I don't want to be two different people.\n\nGive me the courage to be the same person everywhere. Help me be honest about who I am and what I believe, without being preachy or weird about it. Surround me with friends who like the real me. And if some people don't, help me be okay with that. I'd rather be fully known and loved by you than half-known and liked by everyone. Amen.",
"Holy Spirit, set me free from the fear of man. It's a trap, and I've been caught in it for a long time. I want to live boldly for you, without constantly checking whether people approve.\n\nGrow in me a quiet confidence that comes from knowing I'm loved. Let me serve people because I love them, not because I want their approval. Let me do good things in secret, where only you see. When I'm tempted to perform for others, bring me back to you. Your approval is enough for me. Help me believe that. Amen."],
honor:[
"Lord, I haven't been respectful to my parents lately. I roll my eyes, talk back, ignore what they ask, and act like I know better. Sometimes they really are wrong or unfair, but that doesn't excuse how I've been acting. You told me to honor my father and mother, and I haven't been doing it.\n\nForgive me. Help me see my parents as people, with their own stresses and struggles, who are doing their best, even when it's not perfect. Give me patience when I disagree, and the maturity to talk about it calmly instead of fighting. Help me look for ways to make their lives a little easier. Change my attitude at home. Amen.",
"Father, it's hard to respect people in authority who don't seem to deserve it, like a teacher who's unfair, a coach who plays favorites, or a boss who's rude. My first reaction is to push back, complain, or quietly disrespect them.\n\nTeach me how to show respect even when I don't agree. Help me speak up respectfully when something's truly wrong, and let the small things go. Remind me that you put leaders in place and that you're ultimately in charge. Let my attitude toward authority show people that I follow Jesus. And give the people over me wisdom, because they need it too. Amen.",
"Jesus, even as a kid, you obeyed your parents, and you were God. That humbles me. If you could honor imperfect people, I can too, with your help.\n\nShow me what honoring my parents looks like in my situation. Maybe it's listening without interrupting, or doing what they ask the first time, or saying thank you more, or just being kind. Help me grow up into someone who makes them proud, not because I'm perfect, but because I'm becoming more like you. And where our relationship is broken, begin healing it. Amen.",
"God, there's tension at home right now, and some of it is my fault. I've said things I shouldn't have and acted selfishly. I want our home to be peaceful, but I've been part of the problem.\n\nGive me the humility to apologize first, even if they were wrong too. Help me be quick to listen, slow to speak, and slow to get angry. Show me how to communicate what I'm feeling without blowing up. Bring peace into our home, and let it start with me. I trust you to work in all of our hearts. Amen.",
"Lord, sometimes I don't respect my parents because I think they don't understand me. I feel like they're out of touch, or they don't see what I'm dealing with. Maybe they don't fully. But maybe I haven't let them.\n\nHelp me open up to them more, even when it feels awkward. Give them wisdom and patience with me, and give me patience with them. Help us actually listen to each other. And whatever their flaws, remind me of the ways they've sacrificed for me, often without me noticing. Let gratitude soften my heart toward them. Amen.",
"Holy Spirit, I want to honor you by honoring the people you've put over me. Grow respect in me, not just outward obedience, but a real attitude of humility and care.\n\nWhen I'm frustrated, help me hold my tongue. When I disagree, help me speak with respect. When I mess up, help me own it. Make me someone parents, teachers, and coaches can trust. And let the way I treat authority be a quiet witness to the people around me of what following Jesus looks like. Amen."]
});

Object.assign(LONG.t, {
anxiety:[
"Lord, my mind won't slow down. I keep running through what could go wrong, what people think of me, what's coming next, and what I can't control. My chest feels tight, and it's hard to focus on anything else. You told me not to be anxious about anything, but to bring everything to you in prayer. So that's what I'm doing.\n\nHere's what's weighing on me. I'm handing it to you one piece at a time. I can't carry all of it, and I was never meant to. Give me your peace, the kind that doesn't make sense, that guards my heart and mind even when nothing has changed yet. Help me take the next small step and leave tomorrow with you. Amen.",
"Father, I'm afraid. Some of my fears are real and some of them are probably exaggerated, but they all feel big right now. I keep imagining the worst, and it's stealing my sleep and my joy.\n\nRemind me that you are with me. You said you would never leave me or forsake me. You are my refuge and strength, a very present help in trouble. I don't have to know how everything will turn out, because I know who holds it. Calm my body, slow my breathing, and quiet my racing thoughts. Let me rest in your arms tonight like a child who knows they're safe. Amen.",
"Jesus, you told your disciples not to worry about tomorrow, because tomorrow will worry about itself. I'm living about three weeks ahead of today, stressed about things that haven't happened yet and may never happen.\n\nBring me back to today. Help me focus on what's in front of me right now and do it well. When my mind jumps ahead, gently pull it back. Remind me that you'll give me what I need when I need it, not before. Thank you that I don't have to carry next week's problems with this week's strength. Amen.",
"God, I want control. I feel safer when I know what's going to happen and can plan for it. When things are uncertain, I panic. I think a lot of my anxiety comes from trying to be in charge of things only you can handle.\n\nTeach me to trust you with the things I can't control. Help me do my part, prepare, work hard, and make wise choices, and then let go of the outcome. Remind me that you're good and that you're working everything together for good, even when I can't see how. Loosen my grip, and let me rest in yours. Amen.",
"Lord, I'm not sure if this is just worry or something bigger. Some days the anxiety is so heavy that it's hard to function. If this is more than I can handle on my own, give me the courage to tell someone, like a parent, a counselor, or a doctor. Asking for help isn't a lack of faith.\n\nUntil then, be my peace. Hold me close in the moments when it feels like too much. Help me breathe, pray, and take one small step at a time. Thank you that you never get tired of me bringing you the same worries over and over. You care for me, and you're not frustrated with me. Amen.",
"Holy Spirit, you are called the Comforter. I need comfort right now. My thoughts are loud and my heart is restless, and I don't know how to calm myself down.\n\nSpeak your truth over my fear. You are with me. You are for me. Nothing can separate me from your love. You hold the future. Let those truths sink deeper than my anxious thoughts. Teach me practices that help, like breathing, praying, walking, writing it down, and talking to someone, and help me actually use them. Grow your peace in me, until worry no longer gets the final word. Amen."],
doubt:[
"Lord, I'm having doubts, and I'm scared to say it. Sometimes I wonder if you're real, if you're actually listening, or if I've just been believing what I was told. I don't want to fake faith, so I'm bringing you my honest questions.\n\nThank you that the Bible is full of people who doubted and questioned you, and you didn't turn them away. Thomas wanted proof, and Jesus showed him his hands. Meet me in my doubts like that. Show me you're real in a way I can recognize. Lead me to good answers and good people. And while I'm searching, help me keep showing up, praying, reading, and asking, instead of walking away. Amen.",
"Father, I believe. Help my unbelief. That's the most honest prayer I can pray right now. Part of me trusts you, and part of me isn't sure. I feel like I'm holding on with one hand.\n\nStrengthen whatever faith I have. Remind me of the times you've come through in my life before. Give me eyes to see you working right now, even in small ways. And if this is a season of quiet, where I can't feel you, help me trust that you're still there. Faith isn't the absence of questions. It's choosing to follow you while I'm still asking them. Amen.",
"Jesus, I've heard arguments against Christianity that I don't know how to answer, and they've shaken me. I don't want to bury my head in the sand, but I also don't want to throw away my faith over things I haven't fully thought through.\n\nGive me the courage to look into my questions honestly. Lead me to thoughtful people and good resources that take hard questions seriously. Help me remember that Christianity has stood up to the hardest questions for two thousand years. And in the meantime, keep me close to you, the one who is the way, the truth, and the life. Amen.",
"God, some of my doubt comes from pain. Something happened that I don't understand, and I wonder how a good God could let it happen. I'm hurt, and that hurt has turned into questions about whether you're really good.\n\nYou can handle my anger and my questions. The Psalms are full of people crying out to you, asking why. I'm asking why too. I may not get an answer right away, but please don't let me lose you in this. Show me your goodness, even here. Hold onto me when I'm struggling to hold onto you. Amen.",
"Lord, I feel like everyone else at church is so sure, and I'm the only one wondering. That makes me feel like a fake, or like I'm doing something wrong.\n\nRemind me that faith grows through questions, not around them. Give me someone safe I can talk to honestly about my doubts, without feeling judged. Help me find a community where questions are welcome. And thank you that my salvation doesn't depend on how strong my faith feels on a given day. It depends on how strong you are. Amen.",
"Holy Spirit, I want a faith that is mine, not just something I inherited. I want to know you, not just know about you. That's part of why I'm wrestling with all of this.\n\nUse this season to build something real and lasting in me. Let my questions push me deeper instead of further away. Speak to me through Scripture, through prayer, through creation, and through the people around me. And on the days when my faith feels thin, carry me. I'm choosing to keep seeking you, because you promised that whoever seeks you will find you. Amen."],
devotion:[
"Lord, I've drifted. I haven't prayed much, I haven't opened my Bible in a while, and when I do go to church, my mind is somewhere else. I'm not even sure exactly when it happened, but I feel far from you, and I don't like it.\n\nThank you that you haven't moved. You're right where I left you, waiting, not angry. I want to come back. Rekindle my love for you. Make your Word come alive to me again, and make prayer feel like talking to someone who's really there. Help me start small, even five minutes a day, and be faithful in that. Draw me near, and draw near to me. Amen.",
"Father, I've put other things first. Sports, school, friends, games, my phone, and my plans. They all get my best time and energy, and you get whatever's left, if anything. I know that's backwards.\n\nForgive me for treating you like an afterthought. You are the source of every good thing in my life. Help me rearrange my priorities so that you come first, not just on Sundays but every day. Show me what I need to cut back on to make room for you. And make me want you more than any of the things that have been crowding you out. Amen.",
"Jesus, I'm going through the motions. I say the right words and show up at the right places, but my heart isn't in it. I feel spiritually numb, and I don't know how to fix it.\n\nI don't want just religion. I want you. Wake me up spiritually. Give me a fresh hunger for your presence. Show me who you are in a new way, so that following you feels like a relationship again, not a checklist. Until those feelings come back, help me keep showing up, because faithfulness matters even when it's dry. Amen.",
"God, I'm afraid to talk about my faith with my friends. I worry they'll think I'm weird, judgmental, or preachy. So I stay quiet, even when there's a natural opening. I don't want to be ashamed of you.\n\nGive me courage and gentleness. Help me live in a way that makes people curious about you. When someone asks, help me be ready to explain my hope with kindness and respect. Show me who around me is open, and give me the right words at the right time. And help me remember that sharing my faith is just telling people about someone I love. Amen.",
"Lord, there are things in my life that I treat like they're more important than you. They might not be bad things, but I've made them into idols. I look to them for my identity, my comfort, or my joy. That's a place only you belong.\n\nShow me what I've put on the throne of my heart. Gently take it down and put yourself back where you belong. Help me enjoy the good gifts you give without worshiping them. Let my identity be found in you, not in my performance, my relationships, or my possessions. You alone are worthy of my whole heart. Amen.",
"Holy Spirit, build habits of devotion in me that last. Not perfect, not impressive, just real and consistent. I want my relationship with you to be the most important part of my day, not something I squeeze in when I remember.\n\nHelp me set a time and place to meet with you. Help me read your Word with an open heart and pray honestly. When I miss a day, help me come back without guilt. Let these small daily moments add up to a life that's deeply rooted in you. I want to know you more this year than I did last year. Amen."],
selfworth:[
"Lord, the voice in my head has been brutal lately. I call myself stupid, ugly, worthless, and a failure, things I would never say to a friend. I've believed those words for so long that they feel true. But they don't sound like you.\n\nReplace those lies with your truth. You say I'm fearfully and wonderfully made. You say I'm your child, chosen, loved, and forgiven. You say I'm your workmanship, created for good works. Help me believe what you say about me more than what I say about myself. When the negative thoughts come, help me notice them, name them as lies, and answer them with your words. Amen.",
"Father, I feel ashamed of who I am. Not just what I've done, but who I am. I feel broken in a way that can't be fixed, and I'm afraid that if people really knew me, they wouldn't want me around.\n\nBut you know me completely, every thought and every secret, and you still love me. You didn't wait for me to clean up before you sent Jesus to die for me. Help me receive that love. Lift the shame off me. Help me see myself through the cross, not through my failures. I want to walk in the freedom of being fully known and fully loved. Amen.",
"Jesus, I compare myself to everyone and always come up short. Smarter people, better athletes, better-looking people, people with more friends. It leaves me feeling like I don't measure up and never will.\n\nRemind me that my worth was settled at the cross, not by how I compare to anyone. You gave your life for me. That's how much I'm worth to you. Help me stop competing for value that you've already given me for free. Let me use my gifts with joy, celebrate others without feeling threatened, and rest in who I am in you. Amen.",
"God, I tie my worth to how I perform. When I play well or get good grades, I feel good about myself. When I fail, I feel like nothing. My mood rises and falls with my results.\n\nUntie my identity from my performance. You don't love me more when I win or less when I lose. I want to work hard and compete with everything I have, but from a place of security, not desperation. Help me fail without falling apart and succeed without getting proud. Be my steady ground when everything else is shifting. Amen.",
"Lord, I've been hiding. I hide what I really feel, what I've done, and who I really am, because I'm afraid of being rejected. It's lonely to live like this.\n\nGive me one safe person I can be honest with. Help me take the risk of letting someone see the real me. And remind me that you already see all of it, and you're not going anywhere. Heal the places in me that learned to hide. Let me come out of the shadows and into the light, where there's freedom. Amen.",
"Holy Spirit, renew my mind. My thought patterns about myself have been negative for a long time, and I can't just switch them off. I need you to retrain how I think.\n\nEvery time I start to tear myself down, interrupt me with your truth. Help me speak to myself with the same kindness I'd show a friend. Help me memorize verses that tell me who I am in you. And give me patience with myself while I heal, because this is going to take time. Thank you that you're gentle with me. Teach me to be gentle with myself too. Amen."],
honesty:[
"Lord, I've been lying. Some of them are small lies that seem harmless, and some are bigger ones I've had to keep covering. It's become easier than it should be, and I don't like who I'm becoming.\n\nForgive me. You are the God of truth, and I want to be a person of truth. Give me the courage to be honest even when it costs me something. Help me stop exaggerating to look better or shading the truth to avoid trouble. And where I've lied to someone, show me how and when to make it right. I'd rather face the consequences of telling the truth than live with the weight of a lie. Amen.",
"Father, I cheated, and I've been trying to justify it. Everyone does it, the class is unfair, I didn't have time. But I know it was wrong. It wasn't honest, and it wasn't fair to the people who did the work.\n\nI'm sorry. Give me the integrity to do my own work, even when it's hard and even when I could get away with cutting corners. Help me trust that honest effort is better than dishonest success. If I need to make something right, give me the courage to do it. And help me prepare better next time, so I'm not tempted in the first place. Amen.",
"Jesus, I'm good at manipulating people. I know what to say to get what I want, how to make people feel guilty, and how to bend the story so I look good. I've told myself it's just being smart, but it's not love.\n\nForgive me for using people. Teach me to be straightforward and honest in my relationships. Help me ask for what I need directly instead of working angles. Let my words be simple and true. Where I've hurt people with manipulation, help me make it right. Make me someone people can trust completely. Amen.",
"God, I've been fake. I act like I've got it all together, especially around church people, but there's a lot going on that nobody sees. I'm living a double life, and it's exhausting.\n\nI want to be the same person in private and in public. Help me drop the act. Give me a few people I can be completely honest with. Help me stop performing for others and start living for you. Thank you that you already know everything, and you still love me. There's nothing I need to hide from you. Amen.",
"Lord, I took something that wasn't mine. It may have seemed small, but it wasn't right, and it's been bothering me. I know you see it, and I can't stop thinking about it.\n\nForgive me. Show me how to make this right, whether that's returning it, paying it back, or confessing it to someone. Give me the courage to follow through. Help me be content with what I have and to trust you to provide what I need. And help me be someone who adds to other people's lives instead of taking from them. Amen.",
"Holy Spirit, make me a person of integrity, someone whose words can be trusted, whose yes means yes and whose no means no. I want honesty to be part of who I am, not just something I try to do.\n\nConvict me quickly when I start to bend the truth. Give me the strength to correct myself right away, even mid-sentence. Help me build a reputation for honesty that people can count on. And when telling the truth is hard, remind me that you are with me and that truth sets people free. Amen."],
discipline:[
"Lord, I've been lazy. I know what I need to do, and I just don't do it. I put things off, scroll instead of working, and tell myself I'll start tomorrow. Then tomorrow comes and I do the same thing. I'm tired of being stuck in this pattern.\n\nGive me the discipline to do what needs to be done, even when I don't feel like it. Help me start with one small thing, then the next. Remind me that whatever I do, I'm doing it for you, and that makes even boring work meaningful. Help me build habits that make me stronger, not weaker. I want to be faithful with what you've given me. Amen.",
"Father, I procrastinate all the time. I wait until the last minute, then I'm stressed and rushing and doing worse work than I could have. I know it's a bad pattern, but I keep falling into it.\n\nHelp me figure out why I put things off. Maybe it's fear of failing, or feeling overwhelmed, or just wanting comfort now. Speak to whatever is underneath. Give me the courage to start, even when it's not going to be perfect. Help me break big tasks into small steps. And when I do get things done early, help me notice how much better it feels. Amen.",
"Jesus, I waste so much time. Hours disappear into my phone, games, and shows, and at the end of the day, I wonder where it all went. I know my time is a gift from you, and I'm not using it well.\n\nTeach me to number my days, so I'll live wisely. Help me be intentional with my time and choose what matters before I drift into what doesn't. Give me the self-control to put the distractions away. And help me rest well too, not just escape. I want to use my time in a way that I won't regret. Amen.",
"God, I can't get out of bed. I hit snooze over and over, and my mornings feel rushed and chaotic. It sets the tone for my whole day. I want to start my days better, with you.\n\nHelp me go to bed on time, put my phone away at night, and get the rest my body needs. Give me the discipline to get up when the alarm goes off. Help me give you the first moments of my day before anything else gets my attention. And make my mornings peaceful instead of frantic. Amen.",
"Lord, discipline is hard. I start strong and then fade. I set goals and don't follow through. I want to be someone who finishes what they start, but I keep quitting halfway.\n\nGive me perseverance. Help me stick with things even after the excitement wears off. Remind me that small, consistent steps add up to big results over time. When I miss a day, help me get back on track instead of giving up. And let my discipline come from love for you and not from pressure. You're patient with me. Help me keep going. Amen.",
"Holy Spirit, self-control is part of your fruit. I can't produce it on my own, but you can grow it in me. Work in me, and I'll do my part to cooperate.\n\nHelp me say no to what's easy so I can say yes to what's good. Help me build routines that support the person I want to become. Give me energy when I'm tired and focus when I'm distracted. And help me see discipline not as a punishment, but as a path to freedom. Make me faithful in small things, so you can trust me with bigger things. Amen."],
screens:[
"Lord, my phone has a stronger grip on me than I want to admit. I reach for it without thinking, first thing in the morning, last thing at night, and every spare second in between. I scroll even when it makes me feel worse. I don't think I'm using it anymore. I think it's using me.\n\nHelp me take back control. Give me the self-control to set limits and actually keep them. Help me put the phone away during meals, conversations, and prayer. Remind me that the people in front of me matter more than whatever's on the screen. And fill the empty moments with something better, like your presence, real friends, rest, and creativity. Amen.",
"Father, doomscrolling is wrecking my peace. I keep consuming bad news, drama, and negativity, and I come away anxious and heavy. Then I go back for more. I know it's not good for me.\n\nGuard my mind. Help me fill it with what is true, noble, right, pure, lovely, and admirable. Give me the strength to close the app when I start spiraling. Show me what I'm really looking for when I scroll. Maybe it's connection, distraction, or escape. Help me find that in healthier places. Let me go to sleep with your peace instead of a screen. Amen.",
"Jesus, I play games way too much. What started as fun has started taking over. I lose track of time, skip things I should be doing, and get irritated when I have to stop. I don't want something good to become something that controls me.\n\nHelp me enjoy games without being ruled by them. Give me the self-control to set limits and stop when I said I would. Help me prioritize my responsibilities, my relationships, and my time with you. Let games be a small part of my life, not the center of it. Amen.",
"God, I binge shows to avoid thinking. When I'm stressed, sad, or bored, I just turn something on and disappear for hours. It feels good in the moment, but it doesn't actually help.\n\nHelp me face what I'm avoiding instead of numbing it. Show me healthier ways to rest and recharge. Give me the courage to sit with my feelings and bring them to you. And when I do watch something, help me choose things that don't pull me away from you. I want my rest to actually restore me. Amen.",
"Lord, I check my phone constantly, waiting for messages, likes, and notifications. When nothing comes, I feel ignored. When something comes, I get a small rush. I'm letting a device decide how I feel about myself.\n\nFree me from needing that constant validation. Remind me that you see me and love me, whether my phone is buzzing or not. Help me turn off notifications that don't matter and be fully present where I am. Let my sense of worth come from you, not from a screen. Amen.",
"Holy Spirit, help me build a healthier relationship with technology. I don't want to throw my phone away, but I want it to be a tool, not a master.\n\nGive me wisdom to set boundaries that work: times, places, and apps that are off limits. Help me keep my phone out of my room at night. Help me notice when I'm reaching for it out of habit, and pause instead. Fill the time I win back with things that bring life, like people, prayer, your Word, outdoors, and rest. Thank you for the freedom you're giving me. Amen."]
});

Object.assign(LONG.t, {
food:[
"Lord, I turn to food when I'm not actually hungry. When I'm stressed, bored, sad, or lonely, I eat to make the feeling go away for a little while. It works for a few minutes, and then I feel worse. I'm tired of using food to fill something only you can fill.\n\nHelp me notice what I'm really feeling before I reach for something to eat. Teach me to bring that feeling to you first, to pray, take a walk, call a friend, or just sit with it for a minute. Help me treat my body with care, not with guilt or punishment. And remind me that you care about every part of me, including this. Amen.",
"Father, I don't want my relationship with food to be built on shame. I've felt guilty about eating, and I've felt out of control. Neither of those is the freedom you want for me.\n\nGive me a healthy, peaceful relationship with food, where I eat with thankfulness, enjoy good things, and stop when I've had enough. Help me listen to my body. Free me from extremes, from overdoing it and then feeling terrible about it. And if this is bigger than I can handle on my own, give me the courage to talk to someone I trust or a doctor. Amen.",
"Jesus, you said that people don't live by bread alone, but by every word that comes from God. I've been trying to feed a deeper hunger with food, and it never works.\n\nBe my bread of life. When I feel empty, remind me to come to you. Fill me with your presence, your peace, and your love. Help me find comfort in you and in real relationships, not just in what's in the pantry. Teach me to rest in you when life feels like too much. You satisfy in a way nothing else can. Amen.",
"God, self-control feels impossible with this sometimes. I tell myself I'll stop, and then I don't. I eat way past full, and then I'm frustrated with myself.\n\nGrow self-control in me, one small choice at a time. Help me slow down and actually notice what I'm eating. Help me keep fewer temptations around when I know I'm vulnerable. And when I do overdo it, help me move on with grace instead of beating myself up. You don't give up on me. Help me not give up on myself. Amen.",
"Lord, my body is a temple of your Spirit. I want to take care of it because it's a gift from you, not because I'm chasing a certain look or trying to earn something.\n\nHelp me fuel my body well, so I can serve you, my team, and the people around me with energy. Help me enjoy food as a good gift without letting it rule me. Keep me from obsessing in either direction. Let my care for my body come from gratitude and love, not fear or shame. Amen.",
"Holy Spirit, you know the real reasons I struggle with this, even the ones I haven't put into words. Bring them to the surface gently, so they can be healed.\n\nComfort me when I'm hurting, so I don't need food to do it. Give me people I can be honest with. Help me build simple, steady habits that support me. And thank you that progress here doesn't have to be perfect to be real. I trust you to keep working in me, one meal and one day at a time. Amen."],
substances:[
"Lord, I've been using something to escape. Whether it's drinking, vaping, smoking, or something else, I reach for it when life feels like too much. It takes the edge off for a little while, but it's starting to take more from me than it gives.\n\nI don't want to be controlled by anything but you. Give me the strength to say no, and the honesty to admit if I can't do it alone. Help me find real ways to deal with stress and pain, like prayer, people, rest, and movement. And if this has become an addiction, give me the courage to tell someone and get real help. That's not weakness. It's wisdom. Amen.",
"Father, I feel pressure from my friends to use. It's at parties, it's in group chats, and it seems like everyone's doing it. Saying no feels like I'm going to be left out or judged.\n\nGive me the courage to stand firm, even if it costs me something socially. Help me have a plan before I walk into situations where I'll be tempted. Surround me with friends who don't need substances to have fun. And give me confidence in who I am in you, so I don't need to go along with the crowd to feel like I belong. Amen.",
"Jesus, I keep promising myself I'll stop, and I keep going back. The cravings are strong, and in the moment, it feels like I need it. I'm starting to realize I'm not as in control as I thought.\n\nI need you to set me free. You came to proclaim freedom for captives, and I'm feeling captive to this. Give me strength in the moment of craving. Help me get rid of what tempts me and avoid the places and people that make it easy. And give me the humility to reach out for help, from a parent, a pastor, a counselor, or a doctor. I can't keep doing this alone. Amen.",
"God, I think I've been numbing out. Not just with substances, but with anything that helps me not feel. Underneath it, there's pain I don't want to face, and numbing feels easier than healing.\n\nGive me the courage to feel what I've been avoiding. Be with me in it, because I don't want to face it alone. Help me grieve what needs to be grieved and process what needs to be processed. Lead me to people who can help me heal. I'd rather feel real pain with you than feel nothing without you. Amen.",
"Lord, my body is a temple of your Holy Spirit, and I haven't been treating it that way. I've put things into it that hurt it, and I've risked my health, my future, and my relationships.\n\nForgive me. Help me honor you with my body from now on. Give me the strength to break free from what's been hurting me. Help me be honest with the people who love me. And thank you that it's never too late to turn around. Your mercy is new every morning, including this one. Amen.",
"Holy Spirit, fill me so I don't need to fill myself with anything else. The Bible says not to be drunk with wine, but to be filled with the Spirit. I want that. I want your presence to be what changes how I feel.\n\nGive me real joy that doesn't wear off in a few hours. Give me peace that doesn't leave me feeling worse the next day. Give me courage that doesn't come from a bottle or a pen. Help me take one day at a time, and celebrate each day of freedom. I'm choosing you, and I'm asking you to help me keep choosing you. Amen."],
money:[
"Lord, I think about money and stuff way too much. I want the newest things, the nicest things, the things other people have. When I get them, I'm happy for a little while, and then I want something else. It's never enough.\n\nFree me from the love of money. Help me remember that life isn't measured by how much I own. Teach me to be content with what I have and to hold my possessions loosely. Show me how to use what you've given me to bless others. And remind me that the treasures that matter most are the ones I store up in heaven. Amen.",
"Father, I've been gambling and betting, and it's starting to get out of hand. It started as fun, but now I'm chasing losses, thinking about it all the time, and hiding how much I've spent. I know this isn't good.\n\nGive me the courage to stop. Help me delete the apps, block the sites, and tell someone what's been going on. Free me from the rush and the hope of a big win. If this has become an addiction, help me get real help. And help me trust you to provide for me, instead of trying to get rich quick. Amen.",
"Jesus, you said it's more blessed to give than to receive, and I don't really live like I believe that. I hold onto what I have, and giving feels like losing something.\n\nOpen my hands. Help me give generously, whether it's money, time, or attention, to the people around me and to your work. Help me start tithing, even if it's small, as a way of trusting you. Let me experience the joy of giving. And remind me that everything I have is really yours, and I'm just taking care of it for you. Amen.",
"God, I overspend. I buy things I don't need, and later I regret it. I'm not good at planning or saying no to myself when I see something I want.\n\nGive me wisdom with money. Help me make a plan and stick to it. Help me wait before buying things, so I'm not acting on impulse. Teach me to be faithful with small amounts, so I'll be ready to handle more someday. And keep me from finding my happiness in shopping. You're the source of what really satisfies. Amen.",
"Lord, I'm greedy, and I don't like admitting it. I want more than my share. I'm jealous of people who have more. I count what I have and worry it won't be enough. Greed has a way of shrinking my heart.\n\nMake my heart bigger. Help me see the needs around me and care about them. Help me trust that you'll provide what I need, so I don't have to grab for more. Teach me gratitude for what I already have. And let my life be marked by generosity, not by grasping. Amen.",
"Holy Spirit, teach me to see money the way you do, as a tool, not a master. It can be used for great good or for great harm, and I want to use it well.\n\nGive me a generous spirit, a content heart, and wise habits. Free me from fear about the future and from the pull of always wanting more. Help me use what I have to love people, support your work, and plan wisely. And keep reminding me that my real security is in you, not in my bank account. Amen."],
company:[
"Lord, some of the people I've been spending time with are pulling me away from you. I don't want to be judgmental, and I care about them, but I can see that I'm different when I'm around them, and not in a good way. The Bible says bad company corrupts good character, and I'm starting to see it happen.\n\nGive me wisdom about my friendships. Show me where I need boundaries, and give me the courage to set them. Help me love people without letting them lead me away from you. Bring friends into my life who sharpen me and encourage me in my faith. And help me be that kind of friend for others. Amen.",
"Father, it's hard to walk away from people I've been close to. I'm afraid of being lonely, of being judged, of losing my place in the group. But I know some of these friendships are hurting me.\n\nGive me the strength to make hard choices. Fill the space with better friendships, ones that are honest, encouraging, and centered on you. Help me be kind to the people I'm stepping back from, without hating them or acting better than them. And comfort me in the loneliness that might come for a while. You are a friend who sticks closer than a brother. Amen.",
"Jesus, you spent time with sinners, and you loved them, but you never let them change who you were. You changed them. I want to be like that, close enough to love people, but strong enough not to be pulled away.\n\nGive me a strong sense of who I am in you, so I can be a light in places that are dark. Help me know when I'm strong enough to stay and when I need to leave. Protect me from influences I can't handle. And give me opportunities to show your love to the people around me. Amen.",
"God, I've been a bad influence on someone else. I've pulled friends into things they shouldn't be doing, or encouraged them to make bad choices. I didn't think about it much at the time, but now I feel responsible.\n\nForgive me. Help me change the way I influence people. Let me be someone who leads friends toward good things, not away from them. If I need to apologize to someone, give me the courage to do it. Help me use whatever influence I have to point people toward you. Amen.",
"Lord, I need good friends. Real ones. Friends who will pray with me, call me out when I'm wrong, and stand by me when things are hard. I don't have many of those right now.\n\nBring those friends into my life. Lead me to places where I can find them, like a youth group, a Bible study, a team, or a club. Give me the courage to reach out and make the first move. And help me be the kind of friend I'm looking for, faithful, honest, and kind. Amen.",
"Holy Spirit, guide my relationships. You know who will help me grow and who will hold me back. Give me discernment, because I don't always see clearly.\n\nHelp me choose my friends wisely and love everyone well. Give me the courage to stand alone when I need to. Surround me with people who love you. And let my friendships be a place where your love shows up, where people feel seen, encouraged, and pointed toward you. Amen."],
general:[
"Lord, I'm bringing this struggle to you. It might not have a name in a list somewhere, but you know exactly what it is and how much it's been weighing on me. I've tried to handle it on my own, and it hasn't worked.\n\nGive me wisdom to see it clearly, including where it comes from and what keeps feeding it. Give me the strength to take one small step in the right direction today. And give me grace for the days I fall short. I trust that you care about every part of my life, including this one. I want to grow, and I believe you can change me. Amen.",
"Father, I want to become more like Jesus. Not just avoiding bad things, but growing in love, patience, kindness, and faithfulness. This struggle is one of the places where I feel furthest from that.\n\nUse it to grow me. Help me depend on you more because of it. Teach me what you want me to learn. Give me people who can walk with me through it. And let my growth, even if it's slow, bring you glory. You're the one who began this good work in me, and you'll be faithful to finish it. Amen.",
"Jesus, I'm tired of fighting the same battle over and over. Some days I make progress, and some days I feel like I'm right back where I started. It's discouraging.\n\nGive me endurance. Remind me that growth isn't a straight line and that you are patient with me. Help me notice the progress I have made, even when it's small. Lift my eyes off my failures and onto you, the author and perfecter of my faith. I'm not giving up, because you haven't given up on me. Amen.",
"God, I don't fully understand why I keep doing this. Something underneath it is driving me, and I can't quite put my finger on it.\n\nSearch my heart and show me what's really going on. Bring hidden things into the light, gently. Heal whatever needs healing. Give me the courage to talk to someone I trust about it. And give me patience while you work, because some changes take time. Thank you that you know me better than I know myself. Amen.",
"Lord, I confess this struggle to you honestly. I'm not proud of it, and I don't want to hide it. Forgive me for the ways it's hurt me, hurt others, and pulled me away from you.\n\nThank you that your forgiveness is complete. Help me receive it fully and not keep punishing myself. Give me a fresh start today. Show me one practical thing I can do differently. And walk with me every step of the way. I'm so grateful that I don't have to do this alone. Amen.",
"Holy Spirit, I want your fruit to grow in my life where this struggle has been growing instead. Love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Plant them deep.\n\nGive me daily reminders of who I am in you. Help me reflect honestly each night. Let each day be a small step closer to freedom. And when I look back months from now, let me see clearly how far you've brought me. I trust you with this. Amen."],
modesty:[
"Lord, I've been dressing to get attention. I'm not always honest with myself about it, but if I'm really honest, I want people to look at me, to notice me, to want me. Underneath it is a hunger to feel valuable, and I've been trying to feed it with other people's eyes.\n\nYou already see me. You see all of me, and you love me completely. Help me believe that deeply enough that I don't need to go looking for it from other people. Help me choose what I wear from a place of security and peace. Let the thing people notice most about me be your kindness, your joy, and your light in me. Amen.",
"Father, I don't want to swing into shame about my body. You made it, and you called it good. The problem isn't my body. It's the way I've been using it to get approval and attention.\n\nHelp me honor you with my body, not by hiding it, but by presenting it in a way that reflects who I belong to. Give me wisdom in my choices without making me anxious or legalistic. Help me think about the people around me and love them well. And help me take care of my body with gratitude instead of using it as a way to prove my worth. Amen.",
"Jesus, the world keeps telling me that showing more makes me worth more. Social media rewards it, and some of my friends do it without thinking. It's hard to be different, and sometimes I don't even want to be.\n\nGive me the courage to be different when I need to be. Help me see through the lie that my value is in how much attention I get. Surround me with friends who value me for who I am. And remind me that true beauty is the hidden person of the heart, a gentle and quiet spirit that is precious in God's sight. Let that be what I'm known for. Amen.",
"God, I've been thinking about why I get dressed the way I do. Some days I'm insecure, some days I want to impress someone, and some days I'm comparing myself to people online. My clothes have become a way to manage how I feel about myself.\n\nHeal the insecurity underneath this. Remind me who I am, your child, chosen and loved. Help me find my confidence in you, not in my reflection or in how people react to me. And give me peace in the mornings, so getting ready isn't a battle. Amen.",
"Lord, forgive me for the times I've used my body to get attention, approval, or power over someone. I knew what I was doing, and I did it anyway. I don't want to live like that.\n\nThank you for your forgiveness, which is bigger than my choices. Give me a fresh start. Help me make different choices tomorrow, from a heart that's settled in your love. I don't have to earn being wanted. You already chose me, and that's enough. Amen.",
"Holy Spirit, give me wisdom for this. Modesty isn't about looking plain or following a list of rules. It's about my heart, my motives, and loving the people around me. Help me figure out what that looks like for me.\n\nWhen I'm getting ready, help me pause and ask honest questions. Who am I dressing for? What do I want people to notice? Does this honor God? Then help me let it go and live my day without obsessing. Let my confidence come from you, my beauty come from the inside, and my life point people to you. Amen."]
});

Object.assign(LONG.m, {
grieving:[
"Lord, I'm grieving, and it hurts more than I know how to say. Someone or something I loved is gone, and the world feels wrong without it. Sometimes the sadness hits me out of nowhere, and sometimes it just sits on me all day. I don't know how to make it stop, and part of me doesn't want it to stop, because the pain feels like the last connection I have.\n\nYou said you are close to the brokenhearted. Please be close to me now. I don't need answers right now as much as I need you. Hold me when I cry. Sit with me in the quiet. Help me remember the good without being crushed by the loss. And when I'm ready, help me take small steps forward, not to forget, but to carry this with you. Amen.",
"Jesus, you wept at your friend's tomb. You knew you were about to raise him, and you still cried. That means grief isn't a lack of faith. It's love that has nowhere to go. Thank you for not rushing me past this.\n\nI miss them so much. I keep thinking of things I want to tell them, and then I remember I can't. Comfort me in those moments. Let me feel your presence in the empty places. And give me hope, real hope, that death doesn't get the final word. You are the resurrection and the life. Hold onto that for me when I can't hold onto it myself. Amen.",
"Father, I'm angry and sad and confused all at once. I don't understand why this happened. I prayed, and it still happened. Part of me wants to pull away from you because of it.\n\nI'm bringing you all of it, the questions, the anger, and the ache. You can handle it. The Psalms are full of people crying out to you in grief, and you didn't turn away from them. Please don't turn away from me. I may not understand your ways right now, but I'm asking you to stay close, and to help me trust you even in this. Amen.",
"God, grief is exhausting. I can't focus, I'm tired all the time, and things that used to matter feel pointless. People expect me to be okay by now, and I'm not.\n\nGive me grace for this season. Help me be patient with myself. Give me people who will let me be sad without trying to fix me. Help me take care of my body, eat, sleep, and get outside, even when I don't feel like it. And remind me that grief doesn't have a deadline. You're not rushing me, and I don't have to rush either. Amen.",
"Lord, thank you for the time I had with them. Thank you for the memories, the laughter, the conversations, and the ordinary days I didn't know I'd miss this much. They were a gift from you, and I'm grateful, even through the tears.\n\nHelp me honor them by how I live. Let the good they put into my life keep growing. Help me carry their memory in a way that makes me more loving, not more bitter. And comfort everyone else who is missing them too. Let us hold onto each other through this. Amen.",
"Holy Spirit, you are the Comforter, and I need comfort that goes deeper than words. Some nights the ache is so heavy that I can barely breathe.\n\nPray for me when I don't have words. Wrap me in your peace. Give me moments of rest from the heaviness, even small ones. Let me find you in this valley. And give me hope that someday, you'll wipe away every tear, and there will be no more death, sorrow, or pain. Until then, walk with me through every day of missing them. Amen."],
hopeless:[
"Lord, I feel hopeless. It's hard to see any way things get better. I'm tired of trying, tired of hurting, and tired of waking up feeling the same way. I don't even know what to pray, so I'm just telling you where I am.\n\nYou are the God of hope. Please put some back in me, even a little. I don't need to see the whole way out right now. I just need enough light for the next step. Help me reach out to someone today and tell them how I'm really doing. Don't let me carry this alone. And if my thoughts get dark, give me the courage to get help right away. You haven't given up on me. Help me not give up either. Amen.",
"Father, everything feels heavy and gray. I can't remember the last time I felt really good. I know my feelings aren't always telling me the truth, but right now they're so loud.\n\nSpeak louder than my feelings. Remind me that this season isn't the end of my story. Remind me of times you've come through before. Help me do one small thing today that's good for me, like getting outside, eating something, texting a friend, or reading one verse. Help me hold onto you even when I can't feel you. You are holding onto me. Amen.",
"Jesus, you know what it is to be overwhelmed with sorrow. In the garden, you said your soul was crushed to the point of death. You didn't pretend to be fine. You prayed and asked your friends to stay with you.\n\nGive me that honesty. Help me ask people to stay with me. Help me tell the truth about how I'm doing to my parents, a counselor, a pastor, or a friend. I don't have to fight this by myself. And please hold me while I wait for the light to come back. You are with me, even here. Amen.",
"God, I've been believing that nothing will ever change. That I'll always feel this way. That it's pointless to try. But I know that's not what you say.\n\nYou say you have plans to give me a hope and a future. You say weeping may last for the night, but joy comes in the morning. You say you make all things new. I don't feel it right now, but I'm choosing to put my hope in your words instead of my feelings. Hold me up until my feelings catch up. Amen.",
"Lord, I need help. Real help, from real people. I've been trying to hold it together, and I can't anymore. Give me the courage to say that out loud to someone who can help.\n\nLead me to the right people. Open their eyes to see me. And give me patience with the process, because healing takes time. Thank you that asking for help isn't a sign of weak faith. It's one of the ways you take care of me. I'm going to keep going, one hour and one day at a time. Amen.",
"Holy Spirit, when I have no strength, be my strength. When I have no hope, be my hope. When I have no words, pray for me with groans too deep for words.\n\nI'm still here, and that matters. I'm still reaching for you, even weakly. Meet me in the dark. Remind me that I'm loved, that my life matters, and that there are people who would be heartbroken to lose me. Give me a reason to get up tomorrow, and the next day. You are the God who raises the dead. Raise my hope again. Amen."],
ashamed:[
"Lord, I'm ashamed. Not just of what I did, but of who I feel like I am. I want to hide from you, from the people who love me, and even from myself. Every time I think about it, my stomach drops.\n\nBut you don't want me hiding. When Adam and Eve hid in the garden, you came looking for them. You're looking for me too, not to punish me, but to bring me back. So I'm coming out from behind the trees. Here I am. I confess what I did, and I receive your forgiveness. Lift this shame off me, because Jesus already carried it on the cross. I don't have to carry it again. Amen.",
"Father, shame keeps telling me that I'm disgusting, that I'm too far gone, and that I'll never be any different. It sounds so convincing. But those aren't your words.\n\nYou say there is no condemnation for those who are in Christ Jesus. You say that if I confess my sins, you are faithful and just to forgive me and cleanse me from all unrighteousness. You say I'm a new creation. Help me believe your voice over shame's voice. When the shame comes back, help me answer it with your truth. Amen.",
"Jesus, you endured the cross and despised its shame. You took the most shameful death there was so that I wouldn't have to carry my shame forever. Thank you. I don't fully understand that kind of love, but I want to receive it.\n\nHelp me stop punishing myself. Help me stop replaying what I did over and over. If I need to make something right with someone, give me the courage to do it. And then help me let it go, because you have. You've removed my sins as far as the east is from the west. Let me live in that freedom. Amen.",
"God, I'm afraid that if people knew, they'd see me differently. That fear keeps me isolated and keeps the shame growing in the dark.\n\nGive me one safe person I can tell. Shame loses its power when it comes into the light. Help me take that risk. Prepare their heart to respond with grace. And remind me that you already know everything and you still love me. There's nothing they could find out that would surprise you. Amen.",
"Lord, I'm ashamed of something that wasn't even my fault. Something was done to me, or something happened that I couldn't control, and I still feel dirty and less than. I don't know how to make that feeling go away.\n\nHeal me. Speak to the part of me that feels broken. Remind me that what happened to me doesn't define me. You do. Give me the courage to talk to someone who can help me heal, like a counselor or a trusted adult. And hold me in your love until I can feel clean again. Amen.",
"Holy Spirit, replace my shame with your love. Where I feel worthless, remind me of my worth. Where I feel dirty, remind me that I've been washed. Where I feel alone, remind me that you're with me.\n\nGive me a new way of seeing myself, the way you see me. Help me walk with my head up, not because I'm perfect, but because I'm forgiven and loved. Thank you that your grace is bigger than my worst moment. Let me live like I believe it. Amen."],
guilty:[
"Lord, I feel guilty, and I know why. I did something wrong, and I can't stop thinking about it. My conscience won't let it go, and I don't think it should. I need to deal with this.\n\nI confess it to you. I'm sorry. I know it hurt you, and it might have hurt other people too. Thank you that Jesus died for this sin, and that your forgiveness is real and complete. Help me receive it. Then show me what I need to do to make it right, whether that's apologizing, paying something back, or changing something in my life. Give me the courage to follow through. Amen.",
"Father, I keep asking you to forgive me for the same thing, and I wonder if you're getting tired of me. I feel like I've used up my chances.\n\nRemind me that your mercy doesn't run out. Jesus told Peter to forgive seventy times seven, and your forgiveness is even bigger than that. Help me come to you every time, without hiding. And help me take real steps to change, not to earn your forgiveness, but because I love you and want to live differently. Amen.",
"Jesus, I owe someone an apology, and I've been avoiding it. Every day I wait, it gets harder. The guilt is sitting on me, and I know it won't lift until I make this right.\n\nGive me courage. Help me apologize without making excuses or blaming them. Help me listen to how I hurt them. Prepare their heart, and prepare mine for whatever they say. Even if they don't forgive me right away, help me do the right thing. And thank you that you've already forgiven me. Amen.",
"God, I don't know if what I'm feeling is real guilt or just shame and fear. Sometimes I feel guilty about things that aren't even wrong, and sometimes I don't feel guilty about things that are.\n\nGive me a clear conscience. Help me tell the difference between the Holy Spirit's conviction, which leads me toward you, and condemnation, which pushes me away. When I've really done wrong, help me confess and change. When I'm carrying guilt that isn't mine, help me lay it down. Teach me to trust your voice. Amen.",
"Lord, I can't undo what I did. I wish I could go back and make a different choice, but I can't. Now I have to live with what happened.\n\nHelp me learn from this instead of being crushed by it. Show me what led me to make that choice, so I can make better ones in the future. Help me accept the consequences with humility. And redeem this somehow. You're the God who brings good out of even our worst mistakes. I'm trusting you to do that here. Amen.",
"Holy Spirit, thank you for convicting me. I know that feeling guilty means you're still working in me and that my heart hasn't gone completely cold. That's actually good news.\n\nNow lead me through repentance into freedom. Help me turn from what I did and walk in a new direction. Give me a clean heart and a right spirit. And once I've confessed and made things right, help me walk forward without carrying this weight. Let me live in the joy of being forgiven. Amen."],
lonely:[
"Lord, I feel lonely. Sometimes it's when I'm by myself, and sometimes it's even when I'm surrounded by people. I feel like nobody really knows me, and nobody would notice if I disappeared for a while. It's a heavy, aching feeling.\n\nYou see me. You know me completely. You know every thought before I think it. Please let me feel your presence right now. And please bring real people into my life, people I can be honest with, who care about me and want to know me. Give me the courage to reach out first, even when it's scary. Amen.",
"Father, I don't feel like I fit anywhere. Not with my team, not at school, not at church, and sometimes not even at home. Everyone seems to have their people, and I'm on the outside looking in.\n\nRemind me that I belong to you, and that I'm part of your family. Lead me to people who will welcome me. Help me notice others who are lonely too, and give me the courage to reach out to them. Maybe they're waiting for someone like me. And on the nights when it's just me and you, be enough for me. Amen.",
"Jesus, you know loneliness. Your friends fell asleep when you needed them most. They ran away when you were arrested. You were alone on the cross. You understand this ache better than anyone.\n\nBe my friend right now. Sit with me in the quiet. Remind me that you will never leave me or forsake me. And please, heal the loneliness by bringing people into my life. I don't want to just survive this. I want to be known and loved. Amen.",
"God, I've been isolating myself. I say no when people invite me, I stay in my room, and I spend too much time on my phone instead of with real people. Part of me wants connection, and part of me is afraid of it.\n\nGive me the courage to take a small step toward people. Help me say yes to the next invitation. Help me text someone first. Help me show up somewhere, even if it's uncomfortable. And heal the fear that keeps me pulling away. I don't want to be alone anymore. Amen.",
"Lord, I miss having someone close. A best friend, a brother or sister in faith, someone I can call when things are hard. I feel like I'm doing life alone.\n\nPlease bring that kind of friend into my life. Make me the kind of friend who deserves one. Help me be patient while I wait. And meanwhile, help me be faithful in the friendships I do have, even if they're not as deep as I want. You set the lonely in families. I'm trusting you to do that for me. Amen.",
"Holy Spirit, you live in me, which means I'm never actually alone. Help me remember that, especially at night when the loneliness feels loudest.\n\nComfort me with your presence. Remind me that I'm loved by the God of the universe, and that I'm part of a family that stretches across the whole world and through all of history. Give me patience, courage, and hope. And lead me, day by day, toward the people you've prepared for me. Amen."],
heartbroken:[
"Lord, my heart is broken. Someone I cared about deeply hurt me, left, or let me go, and it feels like something inside me tore. I keep replaying it, asking what I did wrong, and wishing things were different. It hurts to breathe sometimes.\n\nYou heal the brokenhearted and bind up their wounds. Please heal mine. Be gentle with me, because I'm fragile right now. Help me not to rush into something new just to stop the pain. Help me not to hate them, and not to hate myself. And slowly, help me believe that I'll be okay, because you're holding me. Amen.",
"Father, I gave someone a big part of my heart, and now it's gone. I feel foolish for hoping, and I'm afraid to trust anyone again.\n\nDon't let this make my heart hard. Help me grieve what I lost without closing myself off forever. Remind me that my worth wasn't in that relationship. It's in you. And when I'm ready, help me love again, more wisely but still openly. Your love is steady when every other love feels shaky. Let me rest in it. Amen.",
"Jesus, I'm so tempted to check their profile, reread old messages, and look for any sign that they still care. It keeps the wound open, but I keep doing it.\n\nGive me the strength to let go. Help me block, mute, or delete whatever I need to, so I can heal. Fill the time I would have spent looking back with things that move me forward. And remind me that letting go doesn't mean it didn't matter. It means I'm trusting you with my future. Amen.",
"God, I don't understand why this happened. I prayed about this relationship. I thought it was right. Now I'm confused and hurt, and I'm wondering if I heard you wrong.\n\nHelp me trust you even when your plan doesn't make sense to me. Maybe you're protecting me from something I can't see. Maybe you have something better ahead. Either way, I choose to believe that you're good and that you love me. Help me hold on to that, even through the tears. Amen.",
"Lord, it's hard to see them moving on while I'm still stuck. They seem fine, and I'm falling apart. It makes me feel like I mattered less to them than they mattered to me.\n\nHelp me stop comparing my healing to theirs. Help me take care of my own heart instead of watching theirs. Give me good friends to lean on. Give me things to look forward to. And remind me that healing isn't a race. You're with me at my pace, and you're not leaving. Amen.",
"Holy Spirit, put my heart back together. Not the same as it was, but stronger, wiser, and more rooted in you. Use this pain to make me more compassionate toward other people who are hurting.\n\nComfort me in the lonely moments. Give me peace when I can't sleep. Fill the empty places with your love. And one day, let me look back on this and see how you carried me through it. Until then, carry me. Amen."],
worthless:[
"Lord, I feel worthless. Like I don't matter, like I'm a burden, like the world would be fine without me. I know these thoughts are dark, and I'm scared of how loud they've gotten. I need you to speak louder.\n\nTell me the truth about who I am. You made me on purpose. You know every hair on my head. You sent Jesus to die for me, which means I'm worth more to you than I can imagine. Help me believe that, even a little. And if these thoughts get darker, give me the courage to tell someone right away, a parent, a counselor, or a crisis line. My life matters to you. Help it matter to me. Amen.",
"Father, I keep measuring my worth by what I accomplish, how I look, or what people think of me. And by those measures, I always fall short. I feel like I'll never be enough.\n\nThrow out those measuring sticks. Remind me that my worth was settled before I did anything. You loved me before I was born. You call me your child. Nothing I do can add to that, and nothing I fail at can take it away. Let me rest in being loved, not in being impressive. Amen.",
"Jesus, people have said things to me that stuck. Words that made me feel small, stupid, ugly, or unwanted. I've been carrying them for a long time, and they've shaped how I see myself.\n\nHeal those wounds. Replace those words with yours. You say I'm chosen, beloved, forgiven, and wonderfully made. Help me forgive the people who hurt me, and help me stop repeating their words to myself. Let your voice be the loudest one in my head. Amen.",
"God, I feel like a burden to the people around me. Like I take more than I give, like I'm too much or not enough. So I pull back and stay quiet, and that makes me feel even more alone.\n\nRemind me that the people who love me want to know how I'm doing. Help me reach out instead of pulling away. Help me let people care for me. And show me that I have something to give too, that you've put gifts and purpose in me that the world needs. Amen.",
"Lord, I need help seeing myself clearly. My mind has been lying to me about my worth, and I can't seem to fix it on my own. Give me the courage to talk to someone who can help, like a counselor, a pastor, or a doctor.\n\nUntil then, be my anchor. Remind me every hour if you have to that I'm loved. Put people in my path who encourage me. And let me take small steps to care for myself, because you care for me. I'm worth taking care of. Amen.",
"Holy Spirit, testify to my spirit that I am a child of God. I need to hear it again and again. When I feel worthless, remind me of the price that was paid for me.\n\nRenew my mind. Help me catch the lies and replace them with truth. Let me see myself through your eyes, with compassion and hope. Give me a reason to keep going today. You have a purpose for me, even if I can't see it yet. I'm choosing to trust you with my life. Amen."],
failure:[
"Lord, I failed, and it hurts. I worked hard, I wanted it badly, and it didn't happen. Now I feel embarrassed and frustrated, and part of me wonders if I'm just not good enough.\n\nRemind me that failing at something doesn't make me a failure. My worth isn't in my results. Help me learn what I can from this, without beating myself up. Give me the courage to try again. And thank you that you use our failures to shape us, humble us, and make us more like Jesus. This isn't the end of my story. Amen.",
"Father, I let people down. My team, my family, my coach, or my friends. I feel like I wasted their trust and their investment in me. That's almost worse than letting myself down.\n\nHelp me face them honestly. Help me own my part without falling apart. Give me the grace to receive their grace, if they offer it. And remind me that you never look at me with disappointment. You look at me with love and see who I'm becoming. Let me work hard from that place. Amen.",
"Jesus, Peter failed you badly. He denied you three times, after promising he never would. And you came back to him, cooked him breakfast, and gave him a mission. You didn't give up on him.\n\nThat gives me hope. You haven't given up on me either. Help me get back up the way Peter did. Help me receive your restoration. And use this failure to make me more humble, more dependent on you, and more compassionate toward others who fail. Amen.",
"God, I keep failing at the same things. Same habits, same mistakes, same disappointments. I'm starting to think I'll never change.\n\nGive me endurance. Help me see the small progress I'm making, even when the big picture looks the same. Show me what I need to do differently, not just harder. Surround me with people who can help. And remind me that you're patient with me. The righteous fall seven times and rise again. Help me keep rising. Amen.",
"Lord, I'm afraid of failing again, so part of me wants to stop trying. If I don't try, I can't fail. But I know that's no way to live.\n\nGive me courage that's bigger than my fear. Help me try again, with my whole heart, knowing that my worth isn't on the line. Let me take risks for things that matter. And whether I succeed or fail, help me do it all for your glory and not for my own image. Amen.",
"Holy Spirit, use this. Don't let it go to waste. Turn my failure into wisdom, humility, and compassion. Let it make me stronger, not bitter.\n\nComfort me in the disappointment. Help me rest tonight instead of replaying everything. Tomorrow, give me fresh motivation. And remind me that the God who calls me is faithful. You'll finish what you started in me, even if the road has some falls along the way. Amen."],
betrayed:[
"Lord, someone I trusted hurt me. They betrayed my trust, said things about me, or turned on me, and I didn't see it coming. I feel stupid for trusting them, and I'm angry, and I'm hurt. All of it at once.\n\nYou know what betrayal feels like. Judas was one of your closest friends, and he sold you out with a kiss. You understand this pain. Please comfort me. Help me not to respond with revenge or cruelty. Help me set wise boundaries. And over time, help me forgive, not because they deserve it, but because I don't want this to poison me. Amen.",
"Father, I keep replaying what they did. I keep coming up with things I should have said, ways I should have responded, and ways to get back at them. It's taking over my thoughts.\n\nI'm handing them to you. You are the judge, not me. You see everything that happened, and you'll make it right in your time. Help me let go of my need for revenge. Fill my mind with something better. And protect my heart from bitterness, because I don't want them to have that kind of control over me. Amen.",
"Jesus, forgiving them feels impossible. What they did was wrong, and it really hurt. But you forgave the people who crucified you, while they were doing it. I can't do that on my own.\n\nGive me your heart. I'm not ready to feel warm toward them yet, but I'm choosing to start the process of forgiveness. I release my right to get even. I'm asking you to bless them, even though my feelings don't agree yet. Change my heart, and give me peace. Amen.",
"God, this betrayal has made me afraid to trust people. I'm wondering who else might turn on me. I'm guarding myself and keeping people at a distance.\n\nHeal this wound so it doesn't spread to every relationship. Give me wisdom to trust carefully, but not to stop trusting entirely. Show me who is safe. Help me rebuild trust slowly with people who've proven themselves. And remind me that you are always faithful, even when people aren't. Amen.",
"Lord, I need to decide what to do about this relationship. I don't know if I should try to work things out, step back, or end it completely. I'm confused, and my emotions are all over the place.\n\nGive me wisdom. Help me see clearly, without letting anger or hurt make the decision. If there's a way to reconcile, help us find it. If I need to walk away, give me peace about it. And whatever happens, help me act with integrity and grace. Amen.",
"Holy Spirit, heal the hurt they caused. Some of it is deep, and I don't know how to fix it. Comfort me when it comes back up.\n\nHelp me remember that what they did says more about them than about me. Help me keep being kind, honest, and loyal, even though someone wasn't to me. Don't let this make me cynical. And use it to make me more faithful to the people I love, because now I know how much it hurts to be betrayed. Amen."],
hurtsomeone:[
"Lord, I hurt someone. I said or did something that caused them real pain, and I can't stop thinking about it. I wish I could take it back. I feel terrible, and I know I should.\n\nI'm sorry. I'm sorry to you, and I need to be sorry to them. Give me the courage to apologize honestly, without making excuses or explaining it away. Help me listen to how it affected them. Help me make it right in whatever way I can. And thank you that your forgiveness is there for me, even when I'm the one who did the hurting. Amen.",
"Father, I didn't mean to hurt them, but I did. Even if it wasn't intentional, the pain is still real. I want to own it, not defend myself.\n\nHelp me apologize in a way that focuses on them and not on me. Help me ask how I can make it right. Give me patience if they need time before they're ready to forgive. And show me what I need to change so I don't hurt people the same way again. Amen.",

church:[

/* ---- merge extra verses, prayers and tips into the existing content ---- */
(function(){
  const add = (arr, more) => { (more||[]).forEach(x=>{ if (x && !arr.includes(x)) arr.push(x); }); };
  const wc = p => p.trim().split(/\s+/).length;
  Object.entries(EXTRA_THEMES).forEach(([k,x])=>{ const t = THEMES[k]; if (!t) return; add(t.verses, (x.v||[]).filter(r=>V[r])); add(t.tips, x.t); t.quick = x.q || []; t.actions = x.a || []; });
  Object.entries(THEMES).forEach(([k,t])=>{ if (typeof MORE_TP!=="undefined" && MORE_TP[k]) { t.prayers = t.prayers.filter(p=>wc(p)>=22).concat(MORE_TP[k]); } });
  MOODS.forEach(m=>{ const x = EXTRA_MOODS[m.id]; if (x){ add(m.verses, (x.v||[]).filter(r=>V[r])); add(m.tips, x.t); }
    if (typeof MORE_MP!=="undefined" && MORE_MP[m.id]) m.prayers = m.prayers.filter(p=>wc(p)>=22).concat(MORE_MP[m.id]); });
})();

/* Apply replacements and extra sentences to the prayer sets */
(function(){
  const arr = (g,k) => g==="t" ? (THEMES[k]||{}).prayers : g==="m" ? (MOODS.find(m=>m.id===k)||{}).prayers : g==="mo" ? (MOMENTS.find(m=>m.id===k)||{}).prayers : null;
  Object.entries(REPLACE).forEach(([key,txt])=>{ const [g,k,i] = key.split("."); const a = arr(g,k); if (a && a[+i]!=null) a[+i] = txt; });
  Object.entries(EXPAND).forEach(([key,add])=>{ if (REPLACE[key]) return; const [g,k,i] = key.split("."); const a = arr(g,k); if (!a || a[+i]==null) return;
    a[+i] = /\sAmen\.$/.test(a[+i]) ? a[+i].replace(/\s*Amen\.$/, " "+add+" Amen.") : a[+i]+" "+add; });
})();

const RX = {H:/\b(he|him|his|himself)\b/gi, Y:/\b(you|your|yours|yourself)\b/gi, M:/\b(me|my|mine|myself)\b/gi};
function cap(s, cls, skip){
  let i = 0;
  return s.replace(RX[cls], function(m, w, off){
    i++;
    if (skip && skip.indexOf(i) >= 0) return m;
    if (m !== m.toLowerCase()) return m;
    const p = s.charAt(off-1), n = s.charAt(off+m.length);
    if (p === "-" || n === "-") return m;
    return CAP[m];
  });
}

  else d.split(" ").forEach(function(tok){
    const parts = tok.split("!");
    s = cap(s, parts[0], parts.slice(1).map(Number));
  });
  V[ref] = s;
});

   the second item is what gets put back (it can add a capital where Jesus is quoted). */
const PROT = [
  ["'Come to me, all who are weary and burdened, and I will give you rest.'", "'Come to me, all who are weary and burdened, and I will give you rest.'"],
  ["'Peace I leave with you; my peace I give to you.'", "'Peace I leave with you; my peace I give to you.'"],
  ["peace I leave with you", "peace I leave with you"],
  ["come to me, all who are weary", "come to me, all who are weary"],
  ["but you\u2026", "but you\u2026"],
  ["someone you're cheering for", "someone you're cheering for"],
  ["showed him his hands", "showed him his hands"],
  ["I need you. Jesus, I'm yours.", "I need you. Jesus, I'm yours."],
  ["Jesus, you were rejected too, so you get it.", "Jesus, you were rejected too, so you get it."],
  ["Jesus, you were God and you still washed feet.", "Jesus, you were God and you still washed feet."],
  ["Jesus was tempted too, and he's with you", "Jesus was tempted too, and he's with you"],
  ["walk with him again", "walk with him again"],
  ["I will trust in you.", "I will trust in You."],
  ["his worst sin", "his worst sin"],
  ["ran to him", "ran to him"],
  ["until he went", "until he went"]
];
const TO_JESUS = /^(Lord |Dear )?Jesus[,.!]/;
function fix(s, cls){
  if (TO_JESUS.test(s)) return s; /* spoken to Jesus: leave every pronoun as written */
  const slots = [];
  PROT.forEach(function(p){
    if (s.indexOf(p[0]) >= 0){ const tag = "\u0001" + slots.length + "\u0001"; s = s.split(p[0]).join(tag); slots.push(p[1]); }
  });
  s = cap(s, cls);
  slots.forEach(function(r, i){ s = s.split("\u0001" + i + "\u0001").join(r); });
  return s;
}
const pray = function(s){ return fix(s, "Y"); };
const plain = function(s){ return fix(s, "H"); };
function eachStr(o, fn, skipKeys){
  if (Array.isArray(o)){ for (let i = 0; i < o.length; i++){ if (typeof o[i] === "string") o[i] = fn(o[i]); else eachStr(o[i], fn, skipKeys); } }
  else if (o && typeof o === "object"){ for (const k in o){ if (skipKeys && skipKeys.indexOf(k) >= 0) continue; if (typeof o[k] === "string") o[k] = fn(o[k]); else eachStr(o[k], fn, skipKeys); } }
}
const PRAYER_KEYS = ["prayers", "quick"];
for (const k in THEMES){ eachStr(THEMES[k].prayers, pray); eachStr(THEMES[k].quick, pray); eachStr(THEMES[k], plain, PRAYER_KEYS); }

eachStr(ROOM_STEPS, plain);

function afterEnter(o){
