<style>
/* Layout: one calm column on a flat dark-violet ground; flat surfaces, hairline borders, one lavender accent; fixed tab bar. */
:root{
  color-scheme: dark;
  --bg:#120e20;
  --surface:#1b162e;
  --surface-2:#252040;
  --line:rgba(255,255,255,.05);
  --line-strong:rgba(255,255,255,.11);
  --fg:#f3f0fa;
  --muted:#aaa3c4;
  --faint:#77708f;
  --accent:#b9a6ff;
  --accent-ink:#171127;
  --accent-soft:rgba(185,166,255,.12);
  --sky:#9fb8f5;
  --rose:#e98ca2;
  --plum:#c9a3ea;
  --amber:#e8b976;
  --sage:#82d3b1;
  --danger:#f0929f;
  --sans: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: var(--sans);
  --r-lg:20px; --r:16px; --r-sm:12px;
  --tab-h:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
a{color:var(--accent)}
.wrap{max-width:540px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.wrap.full{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.serif{font-family:var(--sans)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
h2{font-size:21px;line-height:1.25;font-weight:650;letter-spacing:-.015em}
h3{font-size:16px;font-weight:600;letter-spacing:-.005em}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:14px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{background:transparent}
.card.gold,.card.lav{background:var(--accent-soft);border-color:rgba(185,166,255,.18)}
.tap{transition:transform .16s ease, background .2s ease}
.tap:active{transform:scale(.985)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:600;font-size:16px;letter-spacing:-.005em;transition:transform .14s ease, opacity .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--surface-2);color:var(--fg)}
.btn.ghost{color:var(--muted)}
.btn.danger{background:rgba(240,146,159,.12);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.35;pointer-events:none}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:19px;height:19px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;color:var(--fg);transition:background .18s,border-color .18s,color .18s,transform .14s;text-align:left}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent-soft);border-color:rgba(185,166,255,.45);color:var(--accent)}
.chip.dim{opacity:.4}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}
.pill.sage{background:rgba(130,211,177,.12);color:var(--sage)}

/* Inputs */
.field{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong);color:var(--fg);font-size:17px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical;line-height:1.45}
.field::placeholder{color:var(--faint)}
label.lbl{font-size:13px;color:var(--muted);font-weight:500;display:block;margin-bottom:8px}

/* Header & streak */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.streak{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:68px;padding:10px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
.streak b{font-size:26px;line-height:1;font-weight:700;letter-spacing:-.02em}
.streak span{font-size:11.5px;margin-top:4px;font-weight:500;opacity:.85}
.streak.zero{background:var(--surface);color:var(--muted)}

/* Scripture */
.verse{font-size:18.5px;line-height:1.55;color:var(--fg);letter-spacing:-.005em}
.verse.lg{font-size:20px}
.ref{font-size:13px;color:var(--accent);font-weight:600}
.prayer{font-size:17px;line-height:1.6;color:var(--fg)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--accent)}
.li .ico svg{width:18px;height:18px}
.chev{color:var(--faint);flex:none}
.chev svg{width:17px;height:17px;display:block}

/* Practices */
.prac{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prac:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .2s;color:var(--accent-ink)}
.prac.done .check{background:var(--accent);border-color:var(--accent)}
.prac.done .check svg{opacity:1;transform:none}
.prac.done .pname{color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));background:rgba(18,14,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:600;transition:color .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--fg)}
.tab.on svg{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,5,18,.55);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid var(--line-strong);padding:10px max(20px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));transform:translateY(102%);transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet .in{max-width:540px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line-strong);margin:2px auto 14px}

/* Toast */
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:0 16px 36px -18px rgba(0,0,0,.7);max-width:420px;animation:tin .35s cubic-bezier(.2,.9,.25,1)}
.toast .badge{width:36px;height:36px;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* Onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ob .body{flex:1;display:flex;flex-direction:column;gap:20px;padding-top:14px;position:relative;z-index:1}
.ob .foot{position:sticky;bottom:0;z-index:1;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg, rgba(18,14,32,0), var(--bg) 35%)}
.dots{display:flex;gap:5px}
.dots i{height:3px;flex:1;border-radius:3px;background:var(--line-strong)}
.dots i.on{background:var(--accent)}
.hero-logo{width:84px;height:84px;margin:24px 0 10px}
.group-title{font-size:13px;font-weight:500;color:var(--faint);margin:4px 0 10px}

/* Reflect */
.rate-name{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.score{font-size:68px;line-height:1;font-weight:700;letter-spacing:-.04em;transition:color .25s}
.score small{font-size:20px;color:var(--faint);font-weight:500;letter-spacing:0}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage))}
.range::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.range.untouched::-webkit-slider-runnable-track{opacity:.3}
.range.untouched::-webkit-slider-thumb{background:var(--faint)}
.range.untouched::-moz-range-track{opacity:.3}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.done-num{font-size:96px;line-height:1;font-weight:700;letter-spacing:-.05em;color:var(--accent)}
.sunrise{position:fixed;inset:auto 0 0 0;height:55vh;z-index:0;pointer-events:none;background:radial-gradient(60% 65% at 50% 100%, rgba(185,166,255,.16), transparent 70%);animation:rise 1.4s ease both}
.room > :not(.sunrise){position:relative;z-index:1}
@keyframes rise{from{opacity:0}to{opacity:1}}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-align:center;color:var(--faint);font-weight:500;padding-bottom:2px}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-size:13.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.03);border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.day.has{color:#120e20}
.day.today{border-color:var(--fg)}
.day.future{opacity:.3}
.day.restored::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.has.restored::after{background:#120e20}
.day.blank{background:transparent}
.day.allp::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--sage)}
.day.has.allp::before{background:#120e20}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.legend .bar{flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--sage));max-width:150px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:12.5px;color:var(--muted)}

.minis{display:flex;gap:4px}
.minis i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.07)}

/* Achievements */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.badge-tile svg{width:44px;height:44px}
.badge-tile .bn{font-size:12.5px;font-weight:600;line-height:1.25}
.badge-tile.locked{opacity:.45}

/* Moods */
.moodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mood{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14.5px;font-weight:500;min-height:48px}
.mood .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* Prayer room */
.room{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center}
.orb{width:168px;height:168px;border-radius:50%;margin:30px auto 24px;background:radial-gradient(circle at 50% 50%, rgba(185,166,255,.45), rgba(185,166,255,.1) 55%, transparent 70%);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.7}45%,55%{transform:scale(1.04);opacity:1}}

/* Weekly review */
.wr{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden}
.wr-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;transition:background-color 1.4s cubic-bezier(.4,0,.2,1)}
.wr-bg::before{content:"";position:absolute;inset:-35%;background:radial-gradient(32% 32% at 30% 32%,rgba(185,166,255,.32),transparent 70%),radial-gradient(28% 28% at 74% 68%,rgba(125,160,255,.22),transparent 70%),radial-gradient(24% 24% at 60% 20%,rgba(233,140,190,.12),transparent 70%);animation:wrdrift 18s ease-in-out infinite alternate}
.wr-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 30%,transparent 70%,rgba(0,0,0,.25))}
@keyframes wrdrift{to{transform:translate3d(7%,-5%,0) rotate(14deg) scale(1.08)}}
.wr-bars{display:flex;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 0 max(20px, env(safe-area-inset-left,0px))}
.wr-bars{position:relative;z-index:3}
.wr-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.wr-bars i b{display:block;height:100%;width:0;background:#fff}
.wr-bars i.done b{width:100%}
.wr-bars i.cur b{animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}
.wr{animation:wropen .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes wropen{from{opacity:0;transform:scale(1.035)}}
.wr.closing{animation:wrclose .38s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes wrclose{to{opacity:0;transform:scale(.97)}}
.wr-slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px max(28px, env(safe-area-inset-right,0px)) 40px max(28px, env(safe-area-inset-left,0px));max-width:540px;margin:0 auto;width:100%;transition:opacity .3s ease, transform .3s ease}
.wr-slide > *{animation:wrin .85s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 110ms + 80ms)}
.wr-slide.from-back > *{animation-name:wrinback}
@keyframes wrinback{from{opacity:0;transform:translateY(-16px);filter:blur(8px)}}
.wr-slide.leave,.wr-slide.leave-back{position:absolute;left:0;right:0;margin:0 auto;pointer-events:none}
.wr-slide.leave > *,.wr-slide.leave-back > *{animation:none}
.wr-slide.leave{animation:wrleave .32s cubic-bezier(.4,0,1,1) forwards}
.wr-slide.leave-back{animation:wrleaveback .32s cubic-bezier(.4,0,1,1) forwards}
@keyframes wrleave{to{opacity:0;transform:translateY(-22px);filter:blur(8px)}}
@keyframes wrleaveback{to{opacity:0;transform:translateY(22px);filter:blur(8px)}}
.wr.held .wr-bars i.cur b{animation-play-state:paused}
.wr.held .wr-slide:not(.leave):not(.leave-back){opacity:.82;transform:scale(.985)}
.wr-foot > *{animation:fadein .5s ease both}
.wr-hint{text-align:center;opacity:.55;letter-spacing:.01em}
.wr-done{background:#fff;color:#171127;min-height:54px;border-radius:18px;box-shadow:0 18px 40px -18px rgba(255,255,255,.5)}
@keyframes wrin{from{opacity:0;transform:translateY(24px);filter:blur(8px)}}
.wr-big{font-size:min(28vw,124px);line-height:.95;font-weight:800;letter-spacing:-.05em}
.wr-h{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.wr-p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);max-width:34ch}
.wr-tapl,.wr-tapr{position:absolute;top:60px;bottom:90px;width:38%;z-index:2}
.wr-tapl{left:0}.wr-tapr{right:0}
.wr-close{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.wr-close svg{width:18px;height:18px}
.wr-foot{position:relative;z-index:3;padding:0 max(28px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(28px, env(safe-area-inset-left,0px));max-width:540px;margin:0 auto;width:100%}
.wr-bar{display:flex;align-items:center;gap:12px;font-size:15px}
.wr-bar .track{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.wr-bar .track b{display:block;height:100%;border-radius:8px;background:#fff;animation:grow 1.3s cubic-bezier(.2,.9,.25,1) .55s both}
@keyframes grow{from{width:0!important}}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--sans)}

/* Lock */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.pins{display:flex;gap:14px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent)}
.pins i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.key{height:74px;border-radius:50%;background:var(--surface);font-size:26px;font-weight:500}
.key:active{background:var(--surface-2)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.fade{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hr{height:1px;background:var(--line);margin:4px 0}
.crisis{background:rgba(233,140,162,.08);border-color:rgba(233,140,162,.22)}
.copyline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-variant-numeric:tabular-nums}


/* ---- Motion + calm layout (v2) ---- */
html{touch-action:manipulation}
.rv{opacity:0}
.rv.in{animation:rvin .75s cubic-bezier(.2,.7,.2,1) var(--d,0ms) both}
.rv.in.fromR{animation-name:rvinR} .rv.in.fromL{animation-name:rvinL}
@keyframes rvin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes rvinR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes rvinL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.leaving{opacity:0;transition:opacity .18s ease;pointer-events:none}
.pbar{height:3px;border-radius:3px;background:var(--line-strong);overflow:hidden}
.pbar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#8fb0ff);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.obhead{padding-top:6px;gap:14px}
.iconbtn.quiet{background:transparent;color:var(--muted)}
.ob::before{content:"";position:fixed;inset:-25% -25% auto -25%;height:80vh;z-index:0;pointer-events:none;background:radial-gradient(42% 52% at 32% 38%,rgba(185,166,255,.20),transparent 70%),radial-gradient(38% 48% at 78% 22%,rgba(125,155,255,.12),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(7%,5%,0) scale(1.1)}}
.ob .body{gap:22px;padding-top:30px}
.ob .body.welcome{padding-top:0;gap:18px;align-items:flex-start;justify-content:center}
.ob .foot{position:sticky;bottom:0}
.hero-logo.glow{width:76px;height:76px;margin:0 0 6px;border-radius:20px;box-shadow:0 0 0 1px var(--line),0 24px 70px -18px rgba(185,166,255,.65);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--line),0 24px 70px -22px rgba(185,166,255,.45)}50%{box-shadow:0 0 0 1px var(--line),0 24px 80px -12px rgba(185,166,255,.8)}}
.wordmark{font-size:58px;line-height:1;font-weight:700;letter-spacing:-.045em;background:linear-gradient(180deg,#fff,#c9bff0);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;line-height:1.5;color:var(--muted);max-width:32ch}
.q-t{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.035em}
.q-t .soft{color:var(--faint)}
.bigfield{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-strong);border-radius:0;padding:10px 0 12px;font-size:34px;font-weight:600;letter-spacing:-.03em;color:var(--fg);outline:none;transition:border-color .3s}
.bigfield:focus{border-bottom-color:var(--accent)}
.bigfield::placeholder{color:var(--faint);font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:17px;font-weight:500;transition:background .25s,border-color .25s,transform .15s}
.opt:active{transform:scale(.985)}
.opt .tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);color:transparent;transition:all .25s}
.opt .tick svg{width:14px;height:14px}
.opt.on{background:var(--accent-soft);border-color:rgba(185,166,255,.4)}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.roomy{gap:10px}
.chips.roomy .chip{min-height:44px;padding:10px 16px;font-size:15.5px}
.notes{display:flex;flex-direction:column;gap:26px;margin-top:6px}
.note{display:flex;gap:16px;align-items:flex-start}
.note i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none;box-shadow:0 0 0 5px var(--accent-soft)}
.note h3{font-size:17px;margin-bottom:4px}
.btn.lg{min-height:56px;border-radius:18px;font-size:17px}
.btn.primary{box-shadow:0 12px 32px -16px rgba(185,166,255,.6)}

/* Home */
.stack.air{gap:38px}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
h1.big{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.04em}
.grad{background:linear-gradient(100deg,var(--accent),#8fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.streakline{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;margin-top:4px}
.streakline b{color:var(--fg);font-weight:650}
.streakline.off{color:var(--faint)}
.spark{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse2 3s ease-in-out infinite}
.streakline.off .spark{background:var(--faint);box-shadow:0 0 0 4px rgba(255,255,255,.05);animation:none}
@keyframes pulse2{50%{box-shadow:0 0 0 8px rgba(185,166,255,.04)}}
.panel{background:radial-gradient(120% 150% at 0% 0%,rgba(185,166,255,.20),transparent 62%),var(--surface);border:1px solid rgba(185,166,255,.16);border-radius:26px;padding:24px;box-shadow:0 30px 70px -44px rgba(120,90,255,.6)}
.eyebrow.acc{color:var(--accent)}
.h-lg{font-size:28px;letter-spacing:-.03em;font-weight:700}
.verse.xl{font-size:25px;line-height:1.42;font-weight:500;letter-spacing:-.015em}
.body-lg{font-size:17.5px;line-height:1.55;color:var(--fg)}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rl-t{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.quiet{font-size:13.5px;line-height:1.45;color:var(--faint);gap:12px;align-items:center}
.faintbtn{color:var(--faint)}
.tab{position:relative}
.tab.on::after{content:"";position:absolute;top:-6px;width:20px;height:2px;border-radius:2px;background:var(--accent);animation:grow2 .35s cubic-bezier(.2,.8,.2,1)}
@keyframes grow2{from{transform:scaleX(0)}}
@media (hover:hover){
  .btn{transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .25s, opacity .2s, background .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary:hover{box-shadow:0 16px 38px -14px rgba(185,166,255,.75)}
  .chip:hover,.opt:hover,.card.tap:hover{border-color:var(--line-strong)}
  .rowlink:hover .rl-t{color:var(--accent)}
}

/* ---- Flow: soft surfaces, no hard edges, shared ambient light ---- */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 45% at 50% -8%,rgba(185,166,255,.11),transparent 70%),radial-gradient(70% 40% at 100% 105%,rgba(125,155,255,.06),transparent 70%)}
#app{position:relative;z-index:1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-color:rgba(255,255,255,.045);border-radius:24px}

.chip{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
.opt{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border-color:rgba(255,255,255,.05)}
.field{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.btn.soft{background:rgba(255,255,255,.07)}
.iconbtn{background:rgba(255,255,255,.06)}
.li{border-bottom-color:rgba(255,255,255,.045)}
.prac{border-bottom-color:rgba(255,255,255,.045)}
.day{background:rgba(255,255,255,.035);border-radius:12px;transition:transform .2s}
.day:active{transform:scale(.92)}
main header h1{font-size:34px;letter-spacing:-.035em}
.tabbar{border-top:0;padding-top:16px;background:linear-gradient(180deg,rgba(18,14,32,0),rgba(18,14,32,.86) 34%,rgba(18,14,32,.97));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(180deg,transparent,#000 22px);mask-image:linear-gradient(180deg,transparent,#000 22px)}
.tab{transition:color .3s ease}
.tab svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab.on svg{transform:none}
.scrim{background:rgba(8,5,18,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .35s ease}
.sheet{border-top:0;border-top-left-radius:30px;border-top-right-radius:30px;background:linear-gradient(180deg,#1c1631,var(--bg) 220px);box-shadow:0 -30px 80px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.sheet.fresh .in > *{animation:sheetin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetin{from{opacity:0;transform:translateY(12px)}}
.toast{background:rgba(37,32,64,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.08)}
.ob .foot{background:linear-gradient(180deg,rgba(18,14,32,0),rgba(18,14,32,.92) 40%,var(--bg))}
@media (min-width:600px){.moodgrid{grid-template-columns:repeat(3,1fr)} .ach{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

 prayers:[

 "God, show me where pride is hiding in me, especially the parts I can't see. When I'm tempted to judge someone, remind me how much grace you've shown me. Amen.",
 "Jesus, you were the most powerful person who ever lived, and you washed feet. Teach me to serve. Let me care more about your name than mine. Amen."],
 tips:[
 "Ask someone you trust for honest feedback, and just say thanks without defending yourself.",
 "When you catch yourself judging someone, pray for them by name instead.",
 "Give credit away on purpose. Point out a teammate's or classmate's work before your own.",
 "Admit one mistake out loud this week. Humility gets easier with practice."]},
envy:{label:"Contentment",
 verses:["Proverbs 14:30","Galatians 6:4","Philippians 4:11","Hebrews 13:5","James 3:16","1 Thessalonians 5:16-18","Psalm 37:1","Psalm 73:2-3","Colossians 3:15","James 1:17"],
 prayers:[
 "Lord, I keep looking at what other people have and feeling like I'm behind. Help me run my own race. Thank you for what you've given me, even the things I overlook. Amen.",
 "God, when I see someone else succeed, help me be genuinely happy for them. Take the comparison out of my heart and replace it with gratitude. Amen.",
 "Father, I've been focused on what I don't have. Open my eyes to the good things right in front of me. Teach me to be content like Paul was, in every situation. Amen."],
 tips:[
 "Comparison usually starts on a screen. Notice which accounts or apps leave you feeling behind, and mute them.",
 "Write down three specific things you're thankful for tonight. Specific beats general.",
 "When you feel envy, congratulate that person. It feels backwards, but it breaks envy's grip.",
 "Measure yourself against who you were last month, not against someone else."]},
approval:{label:"Approval",
 verses:["Galatians 1:10","Proverbs 29:25","Colossians 3:23-24","1 Samuel 16:7","Psalm 139:14","Ephesians 2:10","Proverbs 31:30","1 John 3:1"],
 prayers:[
 "Lord, I care way too much about what people think of me. Remind me that your opinion is the one that matters, and you already love me. Help me live for an audience of one. Amen.",
 "God, you look at the heart, not the outside. Help me stop measuring my worth by likes, looks, or who's paying attention. Let me rest in being yours. Amen.",
 "Jesus, give me the courage to say no when I need to, and to be honest even if it disappoints someone. Free me from needing everyone to be happy with me. Amen."],
 tips:[
 "Practice a small no this week. Saying no kindly is a skill, not a sin.",
 "Before posting anything, ask who it's for. If the honest answer is approval, wait a day.",
 "Write down what God says about you and read it when you feel invisible.",
 "Notice who you change around. Real friends don't need a different version of you."]},
honor:{label:"Honor",
 verses:["Exodus 20:12","Ephesians 6:1","Philippians 2:3-4","Proverbs 15:1","Colossians 3:13","Romans 12:10","Luke 6:31"],
 prayers:[
 "Lord, honoring my parents isn't always easy, especially when I disagree with them. Help me respect them in how I speak, even when I'm frustrated. Give us patience with each other. Amen.",
 "God, thank you for the people you've put over me: parents, coaches, and teachers. Help me listen well and respond with respect, and help me trust that you can work through them. Amen.",
 "Father, I've been disrespectful lately and I know it. Help me own it and make it right. Soften my heart and my tone at home. Amen."],
 tips:[
 "Tone matters as much as words. Say it slower and quieter than you want to.",
 "Do one thing for your parents this week without being asked.",
 "If you disagree, ask to talk later when you're both calm instead of arguing in the moment.",
 "A quick sorry after an eye-roll or a sharp answer goes a long way."]},
anxiety:{label:"Peace",
 verses:["Philippians 4:6-7","1 Peter 5:7","Matthew 6:34","John 14:27","Isaiah 41:10","2 Timothy 1:7","Psalm 56:3","Isaiah 26:3","Psalm 94:19","Psalm 55:22","Matthew 6:26"],
 prayers:[
 "Lord, my mind is racing. I'm handing you every worry I can name right now. Give me your peace, the kind that doesn't make sense. Help me take today one step at a time. Amen.",
 "God, you haven't given me a spirit of fear but of power, love, and a sound mind. When my thoughts spiral, bring me back to what's true. You're in control and I'm not, and that's good news. Amen.",
 "Jesus, you told me not to worry about tomorrow. Help me do the next right thing and leave the rest with you. Thank you that you care about every detail of my life. Amen.",
 "Father, calm my body and my mind. Slow my breathing. Remind me that you are with me right now, in this exact moment. Amen."],
 tips:[
 "Write the worry down. Then write one small thing you can actually do about it, and let go of the rest in prayer.",
 "Try slow breathing: in for four counts, hold four, out for six. Pray one short line on each breath.",
 "Separate what you can control from what you can't. Pray about both, but only act on the first.",
 "If anxiety is hanging around most days, tell a parent or counselor. Getting help is wise, not weak."]},
doubt:{label:"Faith",
 verses:["Mark 9:24","Hebrews 11:6","Jeremiah 29:13","Proverbs 3:5-6","Isaiah 55:8-9","John 16:33","Romans 8:28","Psalm 13:1,5","James 1:5"],
 prayers:[
 "Lord, I believe; help my unbelief. I have questions I can't answer right now. Meet me in them. I'd rather wrestle with you than walk away from you. Amen.",
 "God, if you're as near as your Word says, show me. I'm going to keep seeking you with my whole heart, even when I can't feel you. Amen.",
 "Jesus, the disciples doubted too, and you didn't give up on them. Be patient with me. Give me wisdom, good people to ask, and a faith that holds up under pressure. Amen."],
 tips:[
 "Doubt isn't the opposite of faith. Write your questions down and bring them to God honestly.",
 "Ask a pastor or mature believer the hard questions. They've likely asked them too.",
 "Read one of the Gospels slowly this week. Look at who Jesus actually is.",
 "Keep showing up to prayer and church even when it feels empty. Feelings often follow faithfulness."]},
devotion:{label:"Devotion",
 verses:["Matthew 6:33","James 4:8","Psalm 63:1","John 15:5","Matthew 22:37","Exodus 20:3","1 John 5:21","Hebrews 10:24-25","Psalm 1:1-2","Joshua 1:8","Psalm 42:1-2","Mark 1:35","Matthew 6:6","1 Peter 3:15","Romans 1:16"],
 prayers:[
 "Lord, I've let other things crowd you out. I want you first again, not just squeezed in at the end. Draw me back. Make me hungry for your Word and your presence. Amen.",
 "God, I don't feel close to you right now, but I'm here anyway. Meet me in the small, ordinary moments of today. Remind me that showing up matters. Amen.",
 "Jesus, I am the branch and you are the vine. Without you I can't do anything that lasts. Help me stay connected to you every day. Amen.",
 "Father, give me boldness to live my faith out loud. Open a door to share hope with someone, and give me the words when it comes. Amen."],
 tips:[
 "Shrink the goal. Five minutes of prayer every day beats an hour once a month.",
 "Attach prayer to something you already do, like before practice, on the ride to school, or before bed.",
 "Put your Bible somewhere you'll see it before your phone in the morning.",
 "Find one friend to go to church or youth group with. Faith grows best with company."]},
selfworth:{label:"Worth",
 verses:["Psalm 139:14","Ephesians 2:10","Isaiah 43:1","Isaiah 43:4","Romans 8:1","Zephaniah 3:17","1 John 3:1","2 Corinthians 5:17","Psalm 103:12","1 Peter 2:9"],
 prayers:[
 "Lord, the voice in my head is harsh. Replace it with yours. You say I'm fearfully and wonderfully made, and I want to believe you over my feelings. Amen.",
 "God, I carry shame for things you've already forgiven. Help me put it down. There is no condemnation for me in Christ, so help me stop condemning myself. Amen.",
 "Father, you call me by name and say I'm yours. On the days I feel worthless, remind me what you paid for me. Teach me to see myself the way you do. Amen."],
 tips:[
 "Catch the thought and talk back to it. Would you say this to a friend? Then don't say it to yourself.",
 "Write down one verse about who God says you are, and read it every morning.",
 "Shame says you are bad. Conviction says you did something wrong and can make it right. Know the difference.",
 "If the self-hatred gets heavy, tell someone you trust today. You don't have to carry it alone."]},
honesty:{label:"Honesty",
 verses:["Proverbs 12:22","Ephesians 4:25","Colossians 3:9-10","Proverbs 10:9","Luke 16:10","Ephesians 4:28","Psalm 51:10","Proverbs 13:11"],
 prayers:[
 "Lord, make me a person of truth. Help me tell the truth even when it costs me something. Let my yes mean yes and my no mean no. Amen.",
 "God, I've been bending the truth to look better or avoid trouble. Forgive me. Give me the courage to come clean where I need to and the integrity to stay clean. Amen.",
 "Jesus, you are the truth. Let my life match what I say I believe, at school, at home, and online. Take away the masks. Amen."],
 tips:[
 "If you lied, go back and correct it quickly. The longer you wait, the harder it gets.",
 "Notice the moment right before a lie, usually fear of getting in trouble or wanting to impress. Pause there.",
 "Small things count. Honest effort on a quiz matters to God as much as big decisions.",
 "Ask a friend to call you out if they catch you exaggerating."]},
discipline:{label:"Discipline",
 verses:["Proverbs 6:6-8","Proverbs 13:4","Colossians 3:23-24","Ephesians 5:15-16","Psalm 90:12","Proverbs 20:13","Hebrews 12:11","1 Corinthians 9:24","Galatians 6:9"],
 prayers:[
 "Lord, I know what I should be doing and I keep putting it off. Give me strength to start, even if it's small. Help me work like I'm working for you. Amen.",
 "God, teach me to number my days and use my time well. Show me what's wasting my hours, and help me trade it for things that matter. Amen.",
 "Father, discipline doesn't feel good right now, but I trust it will grow something good in me. Help me be faithful in the small things today. Amen."],
 tips:[
 "Start with two minutes. Just begin the task. Starting is the hardest part.",
 "Plan tomorrow tonight. Write down the three things that matter most.",
 "Set a real bedtime and wake time. Most discipline battles are won or lost the night before.",
 "Remove the easy escape. Put your phone in another room while you work."]},
screens:{label:"Screens",
 verses:["1 Corinthians 6:12","Psalm 101:3","Ephesians 5:15-16","Psalm 90:12","Philippians 4:8","Romans 12:2","Matthew 6:33"],
 prayers:[
 "Lord, my phone has more of my attention than you do. I want that to change. Help me put it down and be present with you and with the people around me. Amen.",
 "God, I don't want to be controlled by anything but you. Give me self-control with screens, games, and scrolling. Fill the quiet moments with something better. Amen.",
 "Jesus, renew my mind. What I watch and scroll shapes who I become. Help me choose what's true, pure, and good. Amen."],
 tips:[
 "Turn on screen time limits for the apps that pull you in the most, and give the passcode to someone else.",
 "No phone in bed. Get a cheap alarm clock if you need one.",
 "Delete the worst app for a week. You'll be surprised how little you miss it.",
 "Replace, don't just remove. Pick what you'll do instead before you put the phone down."]},
food:{label:"Self-control",
 verses:["1 Corinthians 10:31","Proverbs 23:20-21","John 6:35","Matthew 4:4","Psalm 107:9","Galatians 5:22-23","Proverbs 25:28"],
 prayers:[
 "Lord, I keep going to food to feel better. You are the bread of life, and only you truly satisfy. Help me bring my feelings to you first. Amen.",
 "God, help me eat with thanks and with self-control, to honor you with my body. When I'm stressed or bored, remind me to pause and pray. Amen.",
 "Father, I don't want anything to have a hold on me except you. Give me self-control as a fruit of your Spirit, a little more each day. Amen."],
 tips:[
 "Before you grab food, ask: Am I hungry, or am I bored, stressed, or sad?",
 "Pray before you eat, even snacks. It builds a pause into the habit.",
 "If emotional eating is a pattern, tell a parent or trusted adult. It's worth getting real support."]},
substances:{label:"Freedom",
 verses:["1 Corinthians 6:19-20","Ephesians 5:18","1 Peter 5:8","John 8:36","Galatians 5:1","1 Corinthians 10:13","Romans 13:14","1 Corinthians 6:12"],
 prayers:[
 "Lord, I've been using something to escape instead of coming to you. I want freedom. Help me be honest about this, and give me the courage to ask for help. Amen.",
 "God, if the Son sets me free, I'm free indeed. Break this hold on me. Change my friendships, my habits, and my cravings. Amen.",
 "Father, when I want to numb out, help me feel what I'm feeling with you instead. You can handle it. Thank you for not giving up on me. Amen."],
 tips:[
 "Tell a trusted adult. Substances get stronger in secret, and this is not something to fight alone.",
 "Cut off easy access. That may mean changing who you hang out with, and that's okay.",
 "Know your triggers, like certain people, places, or feelings, and have an exit plan ready.",
 "If you feel physically dependent, talk to a parent or doctor. Getting medical help is wise."]},
money:{label:"Generosity",
 verses:["1 Timothy 6:10","Matthew 6:19-21","Matthew 6:24","Luke 12:15","Hebrews 13:5","2 Corinthians 9:7","Proverbs 23:4-5","Ecclesiastes 5:10","Luke 14:28","Proverbs 22:7","Malachi 3:10","Acts 20:35","Proverbs 13:11"],
 prayers:[
 "Lord, everything I have is yours. Loosen my grip on money and stuff. Make me generous and content. Amen.",
 "God, I've been chasing more, and more never satisfies. Teach me to store up treasure in heaven and to trust you with what I need. Amen.",
 "Father, help me handle money wisely and give cheerfully. Keep me away from anything that promises easy money and costs me my peace. Amen."],
 tips:[
 "Give first. Set aside some to give before you spend anything.",
 "Wait 48 hours before any non-essential purchase.",
 "Betting and gambling apps are built to keep you hooked. Delete them and block the sites.",
 "Track where your money goes for two weeks. It's eye-opening."]},
company:{label:"Friendships",
 verses:["1 Corinthians 15:33","Proverbs 13:20","Psalm 1:1-2","Proverbs 27:17","Ecclesiastes 4:9-10","Hebrews 10:24-25"],
 prayers:[
 "Lord, I want friends who pull me toward you, not away. Give me wisdom about who I spend time with, and courage to make changes where I need to. Amen.",
 "God, help me be the kind of friend who makes others better. Bring people into my life who sharpen me, and help me stand firm when the people around me don't. Amen.",
 "Father, saying no to some friendships is hard. Give me peace about it, and fill the gap with people who love you. Amen."],
 tips:[
 "Notice how you act after spending time with certain people. That tells you a lot.",
 "You can be kind to everyone without being close to everyone.",
 "Plug into a youth group or Bible study. That's where good friendships often start.",
 "Have your exit line ready for situations you know are going sideways."]},
general:{label:"Growth",
 verses:["Philippians 1:6","2 Corinthians 5:17","Lamentations 3:22-23","1 Corinthians 10:13","Proverbs 24:16","Psalm 37:23-24","Galatians 5:16","Psalm 139:23-24","Hebrews 12:1-2","Philippians 4:13"],
 prayers:[
 "Lord, you know exactly what I'm working through. Give me strength for today and grace for the days I fall short. Finish the good work you started in me. Amen.",
 "God, search my heart and show me what needs to change. Then give me the power to change it. I trust you with my growth. Amen.",
 "Father, your mercies are new every morning. Thank you for another chance today. Help me take one faithful step at a time. Amen."],
 tips:[
 "Name the moment it usually happens. Awareness is the first step.",
 "Tell one person you trust what you're working on.",
 "Celebrate progress, not perfection. A better day is still a win.",
 "Pray about it specifically, by name, every day this week."]}
};

 {id:"worn", name:"Worn down", hue:"lav"},
