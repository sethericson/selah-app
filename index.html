"Lord, lift the shame I've been carrying for things you've already forgiven. Help me stop picking it back up. Amen.",
"Holy Spirit, give me one person I can be honest with about how I see myself. Help me take the risk of being known. Amen.",
"Father, you call me your child. Let that be the first thing I believe about myself today, before any mistake, any mirror, and any opinion. Amen."],
honesty:[
"Lord, make me a person of truth today. When I'm tempted to exaggerate, shade the truth, or tell a small lie, stop me. Help me be honest even when it costs me something. Amen.",
"Father, I've been lying to protect myself. Give me the courage to tell the truth and face whatever comes. A clear conscience is worth more than avoiding trouble. Amen.",
"Jesus, help me do my own work honestly, even when cutting corners would be easy. Let me trust that honest effort is better than dishonest success. Amen.",
"God, I don't want to manipulate people to get what I want. Help me ask directly, speak plainly, and treat people with honesty and respect. Amen.",
"Lord, help me be the same person in private and in public. Free me from pretending. You know everything anyway, and you still love me. Amen.",
"Holy Spirit, convict me quickly when I bend the truth, and give me the courage to correct myself right away, even mid-sentence. Amen.",
"Father, if there's something I need to make right, like returning something, confessing a lie, or apologizing, give me the courage to follow through this week. Amen."],
discipline:[
"Lord, help me start the thing I've been avoiding, even if it's just the first small step. Starting is the hardest part. Give me the push I need. Amen.",
"Father, I waste time without even noticing. Help me be intentional today and choose what matters before I drift into what doesn't. Amen.",
"Jesus, give me the discipline to get up on time and give you the first moments of my day. Help me go to bed earlier tonight so tomorrow can start better. Amen.",
"God, I start strong and then fade. Give me perseverance to keep going after the excitement wears off. Help me finish what I start. Amen.",
"Lord, remind me that whatever I do, I'm doing it for you. That makes even boring work meaningful. Help me work with my whole heart today. Amen.",
"Holy Spirit, help me say no to what's easy so I can say yes to what's good. Grow self-control in me, one choice at a time. Amen.",
"Father, when I miss a day, help me get back on track instead of giving up completely. Progress, not perfection. Amen."],
screens:[
"Lord, help me put my phone down today when it matters, at meals, in conversations, and when I'm with you. Let the people in front of me get my real attention. Amen.",
"Father, when I reach for my phone out of habit, help me pause and ask why. Show me what I'm really looking for, and help me find it somewhere better. Amen.",
"Jesus, guard my mind from what I scroll. Help me close the app when I start spiraling and fill my thoughts with what is true and good. Amen.",
"God, help me enjoy games and shows without being ruled by them. Give me the self-control to stop when I said I would. Amen.",
"Lord, free me from needing notifications to feel okay. Remind me that you see me whether my phone is buzzing or not. Amen.",
"Holy Spirit, help me keep my phone out of my room tonight. Let me go to sleep with your peace instead of a screen. Amen.",
"Father, fill the time I win back from my screen with things that bring life, like people, prayer, outdoors, rest, and creativity. Amen."],
food:[
"Lord, before I reach for food today when I'm not hungry, help me pause and ask what I'm really feeling. Then help me bring that feeling to you first. Amen.",
"Father, help me eat with thankfulness and stop when I've had enough. Free me from extremes, from overdoing it and then feeling terrible. Amen.",
"Jesus, you are the bread of life. When I feel empty, remind me to come to you before I go to the pantry. Amen.",
"God, help me treat my body with care, not guilt. You made it, and you care about every part of me. Amen.",
"Lord, when I'm stressed, give me another way to cope. Help me take a walk, call a friend, pray, or rest. Amen.",
"Holy Spirit, if this is bigger than I can handle alone, give me the courage to talk to someone I trust or a doctor. Amen.",
"Father, when I overdo it, help me move on with grace instead of punishing myself. You don't give up on me. Help me not give up on myself. Amen."],
substances:[
"Lord, give me strength to say no today. If I'm going to be somewhere I'll be tempted, help me have a plan before I walk in. Amen.",
"Father, when I want to escape, help me face what I'm feeling instead. Be with me in it. I'd rather feel real pain with you than feel nothing without you. Amen.",
"Jesus, surround me with friends who don't need substances to have fun. Give me confidence in who I am so I don't need to go along with the crowd. Amen.",
"God, if this has become more than I can control, give me the humility to tell someone and get real help. That's not weakness. It's wisdom. Amen.",
"Lord, help me get rid of what tempts me and avoid the places and people that make it easy. Give me courage to make those changes. Amen.",
"Holy Spirit, fill me so I don't need to fill myself with anything else. Give me real joy and real peace that don't wear off. Amen.",
"Father, help me take this one day at a time, and celebrate each day of freedom. Thank you for every day I chose you. Amen."],
money:[
"Lord, free me from always wanting more. Help me remember that life isn't measured by how much I own. Teach me to be content with what you've given me. Amen.",
"Father, if I've been gambling or betting, give me the courage to stop, delete the apps, and tell someone. Help me trust you instead of chasing a big win. Amen.",
"Jesus, open my hands. Help me give generously, with my money, my time, and my attention. Let me experience the joy of giving. Amen.",
"God, give me wisdom with money. Help me wait before buying things, make a plan, and stick to it. Teach me to be faithful with small amounts. Amen.",
"Lord, help me see the needs around me and care about them more than I care about my next purchase. Make my heart bigger. Amen.",
"Holy Spirit, help me start giving to your work, even if it's small, as a way of trusting you to provide. Amen.",
"Father, when I'm tempted to find happiness in shopping, remind me that you're the source of what really satisfies. Amen.",
"Lord, everything I have is really yours. Help me take care of it well and use it to love people. Amen."],
company:[
"Lord, give me wisdom about who I spend time with. Show me where I need boundaries, and give me the courage to set them kindly. Amen.",
"Father, bring friends into my life who pull me toward you. Lead me to places where I can find them, and help me make the first move. Amen.",
"Jesus, help me love people without letting them lead me away from you. Give me a strong sense of who I am, so I can be a light without being pulled into the dark. Amen.",
"God, if I've been a bad influence on someone, forgive me. Help me lead my friends toward good things, not away from them. Amen.",
"Lord, if I need to step back from some friendships, comfort me in the loneliness that might come. Be my friend while I wait for better ones. Amen.",
"Holy Spirit, give me courage to stand alone when everyone else is going the wrong way. Help me do the right thing even when it's not popular. Amen.",
"Father, help me be the kind of friend I'm looking for, faithful, honest, and kind. Let my friendships be places where your love shows up. Amen."],
general:[
"Lord, I'm bringing this struggle to you honestly. Give me wisdom to see where it comes from and what keeps feeding it. Help me take one small step in the right direction today. Amen.",
"Father, I want to become more like Jesus in this area. Use this struggle to grow me, humble me, and help me depend on you more. Amen.",
"Jesus, when I'm tired of fighting the same battle, give me endurance. Help me notice the progress I've made, even when it's small. Amen.",
"God, show me what's really driving this. Bring hidden things into the light gently, and heal whatever needs healing. Amen.",
"Lord, give me one person who can walk with me through this. Help me be honest with them and let them help me. Amen.",
"Holy Spirit, grow your fruit in the places where this struggle has been growing. Love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Amen.",
"Father, thank you that I don't have to fix this alone. Walk with me through today, and help me reflect honestly tonight. Amen."]
};

/* Regular prayers for each feeling, added to the original longer ones so each has 10 */
const MORE_MP = {};
Object.assign(MORE_MP, {
weary:[
"Lord, I'm running on empty. I've been giving and giving, and there's not much left. You said your yoke is easy and your burden is light. Trade with me. Take what's too heavy and give me rest. Amen.",
"Father, I don't need a big breakthrough today. I just need enough strength for the next hour, and then the next. Give me daily bread, including daily energy. Amen.",
"Jesus, you invited the weary to come to you. I'm coming, tired and a little worn down. Let me rest in you, not just sleep, but real rest for my soul. Amen.",
"God, those who hope in you will renew their strength. I'm putting my hope in you tonight. Lift me up like an eagle when I can barely walk. Amen.",
"Lord, show me what I can let go of. Not everything on my plate is mine to carry. Give me wisdom to rest without guilt and to say no when I need to. Amen.",
"Holy Spirit, refresh me. Breathe life into the dry places. Let me wake up tomorrow with a little more than I have tonight. Amen.",
"Father, thank you that you never get tired of me, even when I'm tired of everything. Hold me up today. Amen."],
burnedout:[
"Lord, I've lost the joy in things I used to love. Everything feels like an obligation. Help me remember why I started, and help me find rest before I break. Amen.",
"Father, I've been treating rest like a reward I have to earn. But you made the Sabbath for me. Teach me to rest without guilt, and trust you while I do. Amen.",
"Jesus, even you went away to quiet places to pray and recharge. Show me where my quiet place can be this week, and help me actually go there. Amen.",
"God, I've been finding my worth in how much I can do. Free me from that. Remind me I'm loved when I'm productive and when I'm not. Amen.",
"Lord, help me talk to someone about how worn out I really am, like a parent, a coach, or a mentor. I don't want to pretend I'm fine until I collapse. Amen.",
"Holy Spirit, restore my energy and my joy. Bring back the love for the things you've called me to do. I can't manufacture it on my own. Amen.",
"Father, show me one thing I can drop, delay, or ask for help with this week. I trust you with what's left undone. Amen."],
overwhelmed:[
"Lord, there's too much and I don't know where to start. Help me pick one thing, just one, and do it. Then help me pick the next one. Amen.",
"Father, my mind is spinning with everything I have to do. Slow me down. Remind me that you're not overwhelmed, and you're right here with me. Amen.",
"Jesus, you calmed the storm with one word. Speak peace over the storm in my head right now. Amen.",
"God, I don't have to carry it all at once. Help me break this into small pieces and trust you with what I can't get to today. Amen.",
"Lord, give me the courage to ask for help. Show me who I can talk to, and help me admit that I need it. Amen.",
"Holy Spirit, I'm breathing in your peace and breathing out my panic. Steady me. Let me feel your presence in the middle of the chaos. Amen.",
"Father, thank you that this season won't last forever. Help me get through today well, and leave tomorrow with you. Amen."],
stressed:[
"Lord, I'm stressed about things I can't fully control. Help me do my best with what I can control and rest in you with the rest. Amen.",
"Father, my shoulders are tight and my mind won't settle. Help me breathe slowly and remember that you hold all of this. Amen.",
"Jesus, I want to do well, and that's not wrong. But don't let the pressure become an idol. My worth isn't in the result. Amen.",
"God, help me plan wisely and take one step at a time. Keep me from freezing up or rushing through everything in a panic. Amen.",
"Lord, give me good sleep tonight. Let me lay down every worry, knowing you never sleep and you're watching over me. Amen.",
"Holy Spirit, fill me with a calm that doesn't depend on circumstances. Let the people around me feel peace when they're around me, not stress. Amen.",
"Father, thank you for every way you've come through before. Help me trust you to come through again. Amen."],
sick:[
"Lord, my body hurts and I feel weak. You are the God who heals. Please heal me, and give my body the rest and care it needs to recover. Amen.",
"Father, being hurt and sitting out is frustrating. Help me be patient with my body. Use this time to grow me in ways I wouldn't grow otherwise. Amen.",
"Jesus, you touched the sick and made them well. I'm asking you to touch me too. And while I wait, give me peace and comfort. Amen.",
"God, help me follow the advice of the people taking care of me, rest when I need to, and not rush back too soon. Amen.",
"Lord, I feel left out while everyone else keeps going without me. Remind me that I'm still part of the team, and that my worth isn't in what I can do right now. Amen.",
"Holy Spirit, be my strength when my body is weak. Give me hope that I'll get better, and joy even while I'm recovering. Amen.",
"Father, bless the doctors, trainers, nurses, and family members helping me. Give them wisdom, and thank you for their care. Amen."],
cantsleep:[
"Lord, my mind won't stop. I'm handing you every thought one at a time, the worries, the plans, the conversations. You hold them now. Let me rest. Amen.",
"Father, you give sleep to those you love. I'm asking you for that gift tonight. Quiet my body and my mind. Amen.",
"Jesus, help me put my phone down and let the room get dark and quiet. Let my last thoughts tonight be about you. Amen.",
"God, I'll lie down and sleep in peace, because you alone make me safe. Help me believe that right now. Amen.",
"Lord, if I can't sleep, help me rest anyway. Let me pray slowly through the people I love until my mind settles. Amen.",
"Holy Spirit, slow my breathing. Relax my shoulders, my jaw, and my hands. Wrap me in your peace. Amen.",
"Father, tomorrow's problems will still be there in the morning, and so will you. I don't have to solve them tonight. Amen.",
"Lord, thank you for watching over me while I sleep. You never sleep, so I can. Amen."],
anxious:[
"Lord, I'm anxious, and I'm bringing it to you instead of just stewing in it. Here's what I'm worried about. Take it, and give me your peace that guards my heart and mind. Amen.",
"Father, my thoughts keep jumping to the worst case. Bring me back to what's true and what's actually happening right now. Amen.",
"Jesus, help me notice five things I can see, four things I can hear, and the feel of my feet on the floor. Bring me back to this moment, where you are. Amen.",
"God, I can't control the outcome. Help me do my part, and trust you with the rest. Amen.",
"Lord, if this anxiety doesn't go away, give me the courage to talk to someone about it. You often send help through people. Amen.",
"Holy Spirit, remind me that you're with me in this exact moment. I'm not alone, and I'm not out of your reach. Amen."],
afraid:[
"Lord, I'm afraid. I'm telling you honestly. Be my refuge right now, and help me feel safe in your care. Amen.",
"Father, the Bible says perfect love drives out fear. Fill me with your love until there's less room for fear. Amen.",
"Jesus, you told your disciples, 'Take heart, it is I. Don't be afraid.' Speak those words over me right now. Amen.",
"God, help me take the next brave step, even if I'm still scared. Courage isn't the absence of fear. It's trusting you anyway. Amen.",
"Lord, protect me and the people I love. Watch over us tonight, and calm my racing heart. Amen.",
"Holy Spirit, when fear tells me I'm alone, remind me that you live in me. I'm never alone. Amen.",
"Father, whatever happens, you're still good, and you're still with me. Help me hold onto that. Amen."],
nervous:[
"Lord, I'm nervous about what's coming. Help me prepare well, then let it go. Calm my body and help me focus on what's in front of me. Amen.",
"Father, I want to do well, but my worth isn't riding on this. Whatever happens, I'm still your child. Let me play, perform, or present with freedom. Amen.",
"Jesus, help me channel these nerves into focus instead of fear. Let me be fully present when it's time. Amen.",
"God, I'm giving you the outcome. My job is to give my best effort with a good attitude. The rest is in your hands. Amen.",
"Lord, help me breathe slowly before it starts. Clear my mind. Let me enjoy this moment instead of just surviving it. Amen.",
"Holy Spirit, give me courage, calm, and confidence that come from you, not from how ready I feel. Amen.",
"Father, let my attitude and effort honor you, win or lose, success or mistake. Amen."],
insecure:[
"Lord, I feel like I'm not enough. Remind me that you made me on purpose and you don't make mistakes. Help me see myself the way you see me. Amen.",
"Father, I keep comparing myself to people and coming up short. Help me stop. My worth isn't in how I measure up. It's in who I belong to. Amen.",
"Jesus, help me walk into rooms today with quiet confidence, not because I'm the best, but because I'm loved by you. Amen.",
"God, quiet the voice in my head that says I'm not good enough. Replace it with your truth. Amen.",
"Lord, help me stop seeking approval to feel okay. Your approval is enough, and I already have it in Jesus. Amen.",
"Holy Spirit, root my identity deep in your love, so it doesn't shake every time someone looks at me wrong. Amen.",
"Father, help me use the gifts you've given me without apologizing for them or hiding them. Amen."],
confused:[
"Lord, I don't know what's next, and that scares me. But you do. Help me trust you with what I can't see yet. Amen.",
"Father, your Word is a lamp to my feet. I don't need to see the whole path, just the next step. Show me that step. Amen.",
"Jesus, help me stop trying to figure out my whole future tonight. Help me be faithful today and trust you with tomorrow. Amen.",
"God, I have a lot of questions about where my life is going. Give me wise people to talk to, and patience while I wait. Amen.",
"Lord, if one door closes, help me trust that you're leading me somewhere better. Give me peace in the waiting. Amen.",
"Holy Spirit, guide my decisions. Help me pray, listen, and make wise choices, even when I'm not sure. Amen.",
"Father, you have plans for me, plans to give me a hope and a future. Help me believe that even when the future feels foggy. Amen.",
"Lord, whatever I end up doing, help me do it for you. That's the part I can be sure about. Amen.",
"God, thank you that you've never lost track of me. Even when I feel lost, you know exactly where I am. Amen."]
});

Object.assign(MORE_MP, {
sad:[
"Lord, I feel sad today, and I don't fully know why. I don't have to have it figured out to bring it to you. Sit with me in this. Hold me, and let me feel that I'm not alone in it. Amen.",
"Father, you are close to the brokenhearted. I'm not sure my heart is broken, but it's heavy. Come close. Lift a little of this weight, and give me something good to notice today. Amen.",
"Jesus, you wept. You didn't hide your sadness or pretend it away. Help me be honest about how I feel, with you and with someone I trust, instead of stuffing it down. Amen.",
"God, my soul feels low. Like the psalmist, I'm going to keep hoping in you, even if I can't feel much right now. I will yet praise you, my Savior and my God. Amen.",
"Lord, give me the energy to do one small thing that's good for me today. Help me get outside, eat something real, text a friend, or rest. Let small steps lead somewhere better. Amen.",
"Father, if this sadness keeps hanging on, give me the courage to talk to someone who can help. Asking for help is one way I trust you to take care of me. Amen.",
"Holy Spirit, comfort me the way only you can. Pray for me when I don't know what to say. Remind me that weeping may last for the night, but joy comes in the morning. Amen.",
"Jesus, thank you that sadness doesn't scare you away. You're not waiting for me to be cheerful before you come near. You're here now, and that's enough for tonight. Amen."],
grieving:[
"Lord, I miss them, and the missing comes in waves. Some moments I'm okay, and then something small reminds me and it all comes rushing back. Be near me in every wave. Amen.",
"Father, thank you for the gift of the person I've lost. Thank you for the memories, the laughs, and the ordinary days. Help me hold them close while I learn to live without them. Amen.",
"Jesus, you are the resurrection and the life. When grief makes everything feel final, remind me that death doesn't get the last word. Give me hope that runs deeper than this sorrow. Amen.",
"God, help me be patient with myself while I grieve. Give me grace on the days I can't focus, and give me people who will let me be sad without trying to fix me. Amen.",
"Lord, comfort everyone else who's missing them too. Help us lean on each other, share stories, cry together, and remember well. Let our grief draw us closer instead of pulling us apart. Amen.",
"Holy Spirit, you are the Comforter. When I lie awake missing them, wrap me in your peace. Pray for me when I don't have words, and let me rest tonight. Amen.",
"Father, help me honor them by how I live. Let the good they put into my life keep growing. Let their love make me more loving, not more bitter. Amen."],
heartbroken:[
"Lord, my heart hurts. Someone I cared about is gone, or changed, or didn't choose me. You heal the brokenhearted and bind up their wounds. Please start binding up mine. Amen.",
"Father, help me resist the urge to keep checking on them, rereading messages, and replaying everything. Give me the strength to let go a little more today, so I can actually heal. Amen.",
"Jesus, remind me that my worth wasn't in that relationship. It's in you. You loved me before I met them, and you'll love me long after this pain fades. Amen.",
"God, don't let this make my heart hard. Help me grieve what I lost without closing myself off forever. Keep me soft, honest, and open to love again someday. Amen.",
"Lord, give me good friends to lean on right now, and help me let them in. Fill my days with things that move me forward instead of keeping me stuck. Amen.",
"Holy Spirit, when the hurt comes back out of nowhere, comfort me. Help me take my thoughts to you instead of spiraling. You're with me in the hard moments too. Amen.",
"Father, I trust that you see more than I do. Maybe you're protecting me, or maybe you have something better ahead. Either way, help me trust your heart while mine heals. Amen.",
"Jesus, you were rejected by people you loved too. You understand this ache. Thank you for staying with me in it and for never walking away from me. Amen."],
lonely:[
"Lord, I feel alone right now. You promised you would never leave me or forsake me. Let me feel your presence in this quiet, and remind me that I'm known and loved by you. Amen.",
"Father, please bring real friends into my life, people who want to know the real me. Lead me to the right places and give me courage to reach out first. Amen.",
"Jesus, help me notice other people who might be lonely too. Maybe someone around me is waiting for a friend like me. Give me the courage to say hi, sit with them, or send a text. Amen.",
"God, I've been pulling away from people because it feels safer. Help me take one small step toward connection today, even if it feels awkward. Amen.",
"Lord, you set the lonely in families. Thank you that I'm part of your family. Lead me to a community where I can belong, like a church, a group, or a team. Amen.",
"Holy Spirit, you live in me, so I'm never truly alone. When the loneliness gets loud tonight, remind me that you're right here, closer than my own breath. Amen.",
"Father, help me be faithful in the friendships I do have, even if they're not as deep as I want yet. Help me invest in them and be patient while they grow. Amen.",
"Jesus, your friends fell asleep when you needed them most. You know what this feels like. Be my friend tonight, and keep me company until morning. Amen."],
rejected:[
"Lord, I got left out, and it stings more than I want to admit. You know what rejection feels like. Remind me that you chose me, and you're never going to un-choose me. Amen.",
"Father, help me not to let this rejection decide who I am. One group, one person, or one moment doesn't get to define my worth. You do. Amen.",
"Jesus, people rejected you too, even the people closest to you. Thank you for understanding this pain. Comfort me, and help me not to become bitter. Amen.",
"God, help me not to shut down or lash out because of this. Help me stay kind, stay open, and keep showing up, even when it's hard. Amen.",
"Lord, if there's something I need to learn from this, show me gently. If not, help me let it go and trust that you have better places for me. Amen.",
"Holy Spirit, heal the sting. Fill me with your love until other people's opinions don't have as much power over me. Amen.",
"Father, lead me to people who will welcome me. Help me find where I belong, and help me welcome others the way I wish I'd been welcomed. Amen.",
"Jesus, you said the stone the builders rejected became the cornerstone. Remind me that being rejected by people doesn't mean I'm rejected by you. Amen."],
unloved:[
"Lord, I don't feel loved right now. But your Word says you love me with an everlasting love. Help me believe that more than I believe what I'm feeling. Amen.",
"Father, nothing can separate me from your love, not my mistakes, not other people's opinions, and not how I feel tonight. Let that truth sink deep into me. Amen.",
"Jesus, you died for me while I was still a sinner. You didn't wait for me to be lovable. Help me receive love I didn't earn. Amen.",
"God, show me the ways I'm loved that I've been missing, by you and by people around me. Open my eyes to the quiet ways love shows up. Amen.",
"Lord, if people in my life aren't loving me well, heal those wounds. And bring safe, loving people into my life who reflect your heart. Amen.",
"Holy Spirit, pour God's love into my heart. Let me know it, not just as information, but as something I feel and live from. Amen.",
"Father, you rejoice over me with singing. I can't even imagine that, but I want to believe it. Help me rest in your delight tonight. Amen.",
"Jesus, help me love other people even when I don't feel loved. Sometimes giving love is where receiving it starts. Amen."],
betrayed:[
"Lord, someone I trusted hurt me, and it's hard to let it go. Help me bring my anger and hurt to you instead of taking it out on them or on myself. Amen.",
"Father, forgiving them feels impossible right now. I'm not there yet, but I'm asking you to start the process in my heart. Take away the bitterness before it grows. Amen.",
"Jesus, Judas betrayed you with a kiss. You understand this kind of pain. Comfort me, and help me respond the way you did, with strength and grace instead of revenge. Amen.",
"God, help me set wise boundaries without becoming cold. Show me who is safe to trust, and help me rebuild trust slowly with the right people. Amen.",
"Lord, I keep replaying what they did. Help me stop. Fill my mind with something better, and remind me that you'll deal with what's unjust. Amen.",
"Holy Spirit, heal the part of me that got wounded. Help me keep being kind, honest, and loyal, even though someone wasn't to me. Amen.",
"Father, don't let this make me cynical. Help me keep loving people, wisely but sincerely, because that's who you are. Amen.",
"Jesus, you are always faithful, even when people aren't. Let me lean on your faithfulness today. Amen."],
worthless:[
"Lord, I feel worthless today, but that's not what you say about me. You say I'm fearfully and wonderfully made. Help me believe your words over my feelings. Amen.",
"Father, you sent Jesus to die for me. That's how much I'm worth to you. When I feel like nothing, remind me of the cross. Amen.",
"Jesus, people's words have stuck with me and made me feel small. Replace their words with yours. Let your voice be the loudest in my head. Amen.",
"God, help me reach out to someone today instead of pulling away. I'm not a burden to the people who love me. Help me let them in. Amen.",
"Lord, if these thoughts get dark, give me the courage to tell someone right away, like a parent, a counselor, or a crisis line. My life matters to you. Amen.",
"Holy Spirit, testify to my spirit that I'm a child of God. Remind me again and again, especially when I forget. Amen.",
"Father, show me one way I can use my gifts today to help someone else. Remind me that you've put good things in me. Amen.",
"Jesus, you knew everything about me and chose me anyway. Help me stop trying to earn what you've already freely given. Amen.",
"Lord, give me small reasons to keep going today, a kind word, a good moment, or a reminder that I'm loved. Let them add up. Amen."],
failure:[
"Lord, I messed up and I feel like a failure. Remind me that failing at something doesn't make me a failure. You're not done with me. Amen.",
"Father, help me learn from this without beating myself up. Show me what to do differently, and give me the courage to try again. Amen.",
"Jesus, you restored Peter after he failed you three times. Restore me too. Help me get back up and keep following you. Amen.",
"God, your strength is made perfect in my weakness. Use this moment of weakness to show me how much I need you. Amen.",
"Lord, help me face the people I let down with honesty and humility. Give me grace to receive their grace if they offer it. Amen.",
"Holy Spirit, don't let this failure go to waste. Use it to make me humbler, wiser, and more compassionate toward others who fail. Amen.",
"Father, I don't want to stop trying because I'm afraid of failing again. Give me courage bigger than my fear. Amen.",
"Jesus, help me rest tonight instead of replaying every mistake. Tomorrow is a new day with new mercies. Amen."],
lost:[
"Lord, that loss stings. I wanted it badly. Help me feel the disappointment honestly, but not let it define me. My worth isn't on the scoreboard. Amen.",
"Father, help me learn what I can from this game. Show me what to work on, and give me the drive to come back stronger. Amen.",
"Jesus, help me lose with class. Let me congratulate the other side, encourage my teammates, and keep my attitude in check. Amen.",
"God, I gave it what I had, and it wasn't enough this time. Thank you that my effort still matters to you, even when the result doesn't go my way. Amen.",
"Lord, keep me from blaming others or making excuses. Help me own my part and support the people around me. Amen.",
"Holy Spirit, turn this disappointment into fuel for growth. Let it build perseverance and character in me. Amen.",
"Father, help me rest tonight and not replay every mistake. Tomorrow I'll get back to work. Tonight, I'll rest in you. Amen.",
"Jesus, thank you for the chance to compete at all. Win or lose, it's a gift from you. Help me remember that. Amen."]
});

Object.assign(MORE_MP, {
hopeless:[
"Lord, I can't see a way forward right now. Everything feels heavy and gray. You are the God of hope, so I'm asking you for even a little of it. Give me just enough light for the next step, and help me take it. Amen.",
"Father, my feelings keep telling me nothing will ever change. But your Word says you make all things new. Help me hold onto your promises when my feelings are louder than my faith. Amen.",
"Jesus, you were overwhelmed with sorrow in the garden, and you asked your friends to stay with you. Help me ask people to stay with me too. Give me the courage to tell someone how I'm really doing today. Amen.",
"God, lift me out of this pit like you've lifted others before me. Set my feet on solid ground. I'm still reaching for you, even if it's weakly. Please reach back. Amen.",
"Lord, if my thoughts get dark, help me call or text someone right away, like a parent, a counselor, or 988. Don't let me carry this alone. My life matters to you, and I want it to matter to me. Amen.",
"Holy Spirit, be my hope when I don't have any. Pray for me when I have no words. Remind me that this season isn't the end of my story, and that you're still writing it. Amen.",
"Father, help me do one small good thing today, like eating, getting outside, or texting a friend. I don't have to fix everything. I just have to take the next step with you. Amen.",
"Jesus, you are the light of the world, and darkness can't overcome you. Shine into this dark place in me. Even a small light would help right now. Amen."],
discouraged:[
"Lord, I'm discouraged. I've been working hard and it doesn't seem to be paying off. Help me not to give up. Remind me that you see every effort, even the ones nobody else notices. Amen.",
"Father, let me not grow weary of doing good. Your Word says I'll reap a harvest if I don't give up. I can't see it yet, but help me believe it's coming. Amen.",
"Jesus, your disciples got discouraged too. They wanted to quit, go back to fishing, and forget the whole thing. You came to them on the shore anyway. Come to me here too. Amen.",
"God, show me the progress I've made, even if it's small. I tend to only notice how far I still have to go. Help me see how far you've already brought me. Amen.",
"Lord, give me one encouraging word today, through Scripture, a friend, a coach, or a quiet moment with you. I need something to keep going. Amen.",
"Holy Spirit, renew my strength. When I'm running on fumes, refill me. Remind me why I started, and help me finish well. Amen.",
"Father, help me take a break if I need one, without quitting. Rest is part of the race too. Show me the difference between needing rest and needing to stop. Amen.",
"Jesus, help me encourage someone else today. Sometimes lifting someone else up is the thing that lifts me up too. Amen.",
"Lord, I put my hope in you, not in how things look right now. You're faithful, even when I'm discouraged. Help me keep going with you. Amen."],
numb:[
"Lord, I don't feel much of anything right now, not sad, not happy, just flat. I don't know what to do with that, so I'm bringing it to you. Meet me even here, where I can't feel you. Amen.",
"Father, I've been numbing out with my phone, with distractions, and with anything that keeps me from feeling. Help me slow down long enough to notice what's really going on inside me. Amen.",
"Jesus, you are the life. Breathe life back into the parts of me that have gone quiet. I don't need a big feeling. I just need to know I'm still alive inside. Amen.",
"God, help me keep showing up, praying, reading, and reflecting, even when I don't feel anything. Faithfulness matters when feelings are gone. Amen.",
"Lord, if this numbness doesn't lift, give me the courage to talk to someone about it. Sometimes numbness is a sign that something needs care. Amen.",
"Holy Spirit, gently wake up my heart. Let me notice one beautiful thing today, like the sky, a song, a kind word, or a good moment. Let it remind me what being alive feels like. Amen.",
"Father, restore to me the joy of my salvation. I remember when following you felt alive. Bring that back, slowly and gently. Amen.",
"Jesus, you don't need me to feel a certain way to love me. Thank you that your love isn't based on my emotions. Hold onto me while I wait for my heart to wake up. Amen.",
"Lord, help me move my body, get some sunlight, and spend time with people. Small things can help bring feeling back. Give me the energy to try. Amen."],
ashamed:[
"Lord, I feel ashamed. I want to hide from you and from everyone. But you came looking for Adam and Eve when they hid. Come find me too. I'm ready to come out. Amen.",
"Father, shame is telling me that I'm too far gone. But you say there is no condemnation for those who are in Christ Jesus. Help me believe your voice over shame's voice. Amen.",
"Jesus, you carried my shame on the cross so I don't have to carry it forever. Help me stop picking it back up. Let me walk in the freedom you paid for. Amen.",
"God, give me one safe person I can be honest with about this. Shame grows in the dark, and I want to bring it into the light. Amen.",
"Lord, if I need to make something right, give me the courage. Then help me let it go, because you already have. Amen.",
"Holy Spirit, replace my shame with your love. Where I feel dirty, remind me I've been washed. Where I feel unworthy, remind me I've been welcomed home. Amen.",
"Father, help me walk with my head up today, not because I'm perfect, but because I'm forgiven. Amen."],
guilty:[
"Lord, I did something wrong, and I know it. I'm not going to hide or make excuses. I confess it to you. Thank you that you're faithful and just to forgive me and wash me clean. Amen.",
"Father, show me if there's someone I need to apologize to or something I need to make right. Give me the courage to follow through soon, before I talk myself out of it. Amen.",
"Jesus, your mercy doesn't run out, even when I keep coming back with the same thing. Thank you for not getting tired of forgiving me. Help me change, not just feel bad. Amen.",
"God, help me tell the difference between your conviction, which draws me to you, and condemnation, which pushes me away. Let me listen to the first and reject the second. Amen.",
"Lord, I can't undo what I did, but you can redeem it. Bring good out of this somehow, and help me learn from it. Amen.",
"Holy Spirit, create a clean heart in me and renew a right spirit within me. Give me a fresh start, starting now. Amen.",
"Father, once I've confessed and made things right, help me walk forward without carrying the weight. You don't want me to keep punishing myself. Amen.",
"Jesus, thank you for paying for this on the cross. I receive your forgiveness tonight, fully and completely. Amen."],
hurtsomeone:[
"Lord, I hurt someone, and I feel awful about it. Help me own it completely, without excuses. Give me the courage to apologize soon and to listen to how it affected them. Amen.",
"Father, prepare their heart and prepare mine. Help me apologize in a way that's about them, not about me feeling better. And if they need time, help me be patient. Amen.",
"Jesus, heal what I broke in them. Reach them in ways I can't. Let your love cover the damage my words or actions caused. Amen.",
"God, show me what led me to act that way, whether it was stress, anger, pride, or fear. Help me deal with the root so I don't do it again. Amen.",
"Lord, I'm afraid they won't forgive me. Help me do the right thing anyway, and trust you with their response. Amen.",
"Holy Spirit, make me more gentle, more patient, and more thoughtful. Help me slow down before I speak and act. Amen.",
"Father, thank you for forgiving me even when I'm the one who did the hurting. Help me receive that grace and pass it on. Amen.",
"Jesus, if trust was broken, help me rebuild it over time with consistent actions, not just words. Amen.",
"Lord, let this experience make me more compassionate. Let me treat people with the care they deserve, because they're people you love. Amen."],
angry:[
"Lord, I'm angry right now. Help me not to say or do something I'll regret. Give me a pause, slow my breathing, and help me think before I react. Amen.",
"Father, show me what's underneath this anger. Am I hurt, embarrassed, scared, or tired? Help me deal with the real thing instead of exploding at whoever's nearby. Amen.",
"Jesus, be angry and do not sin. Help me feel this without letting it turn into something destructive. Let me handle it the way you would. Amen.",
"God, if I'm angry about something truly wrong, help me respond with wisdom and courage, not with rage. Show me the right way to speak up. Amen.",
"Lord, help me not to let the sun go down on my anger. If I need to talk to someone and make things right, help me do it soon. Amen.",
"Holy Spirit, calm my heart. Fill me with your peace until the heat goes down. Then help me see the situation clearly. Amen.",
"Father, help me walk away if I need to. Leaving a heated moment is sometimes the wisest thing I can do. Amen.",
"Jesus, a gentle answer turns away wrath. Give me gentle words today, even when I don't feel gentle. Amen.",
"Lord, if I already blew up, give me the humility to apologize quickly and honestly. Help me repair what I broke. Amen."],
bitter:[
"Lord, I've been holding onto this for too long. It's poisoning me more than it's hurting them. Help me let it go, little by little, starting today. Amen.",
"Father, I'm choosing to forgive, even though I don't feel like it yet. I'm releasing my right to get even. Let my feelings catch up over time. Amen.",
"Jesus, you forgave the people who crucified you. If you could forgive that, help me forgive this. Give me your heart. Amen.",
"God, don't let a root of bitterness grow up in me. Pull it out before it spreads to every relationship in my life. Amen.",
"Lord, every time I replay what happened, help me hand it back to you. You're the judge, and I trust you to make things right. Amen.",
"Holy Spirit, soften the hard places in my heart. Replace bitterness with compassion, even for the person who hurt me. Amen.",
"Father, bless the person I'm bitter toward. It's hard to pray, but I'm doing it anyway. Change my heart as I pray. Amen.",
"Jesus, help me see the person who hurt me as someone who's broken too. It doesn't excuse what they did, but it helps me let go. Amen.",
"Lord, set me free from this. I don't want to carry it anymore. Thank you that freedom is possible with you. Amen."],
jealous:[
"Lord, I'm jealous of what someone else has. It's making me less happy for them and less thankful for what I have. Take this out of my heart. Amen.",
"Father, help me rejoice with them, even though it's hard. Help me pray for their good on purpose until my feelings start to match. Amen.",
"Jesus, show me what I'm afraid of underneath this jealousy. Maybe it's being forgotten or not being enough. Speak your truth to that fear. Amen.",
"God, open my eyes to everything you've given me. When I'm focused on what I don't have, I miss so much of what I do have. Amen.",
"Lord, remind me that your love for me doesn't shrink when you bless someone else. There's plenty of your goodness to go around. Amen.",
"Holy Spirit, grow contentment in me. Let me be at peace with where you have me, even while I work toward more. Amen.",
"Father, help me stop comparing my life to someone else's highlight reel. I'm only seeing part of their story. Amen.",
"Jesus, help me encourage the person I'm jealous of today. Sometimes kindness is the fastest way out of envy. Amen.",
"Lord, thank you for the story you've written for me. It's different from theirs, but it's not worse. Help me believe that. Amen."],
impatient:[
"Lord, I want it now, and it isn't happening. Help me wait well. Teach me that your timing is better than mine, even when I can't see why. Amen.",
"Father, I get frustrated when things move slowly, including people, plans, and my own progress. Grow patience in me, the kind that comes from trusting you. Amen.",
"Jesus, you waited thirty years before starting your ministry. You were never in a hurry, yet you were never late. Help me trust your pace. Amen.",
"God, help me be patient with the people around me today. Let me give them the same grace I want when I'm slow or struggling. Amen.",
"Lord, waiting is hard, but it's not wasted. Use this time to grow something in me I couldn't get any other way. Amen.",
"Holy Spirit, patience is your fruit, not my effort. Grow it in me, slowly, the way all good fruit grows. Amen.",
"Father, help me focus on what I can do today, instead of obsessing over what I'm waiting for. Amen.",
"Jesus, when I start getting snappy because things aren't going fast enough, help me pause and breathe. Amen.",
"Lord, those who wait on you renew their strength. Help me wait on you, not just for what I want. Amen."],
restless:[
"God, my soul is looking for something, and I keep trying to fill it with the wrong things. Help me find my rest in you. Our hearts are restless until they rest in you. Amen.",
"Lord, I can't sit still, and I don't know why. Help me slow down long enough to hear what you might be saying. Amen.",
"Father, help me put away the distractions and sit quietly with you for a few minutes. Let stillness feel like peace, not boredom. Amen.",
"Jesus, you said, 'Come to me, all who are weary and burdened, and I will give you rest.' I'm coming. Give me the rest my soul is looking for. Amen.",
"God, if this restlessness is you stirring me toward something new, help me see it clearly. If it's just me running from something, help me stop and face it. Amen.",
"Lord, help me channel this energy into something good today, like serving someone, working hard, or getting outside. Amen.",
"Holy Spirit, quiet my mind. Let me be still and know that you are God. Amen.",
"Father, I've been looking for satisfaction in places that never deliver. Turn my heart back to you, the only one who truly satisfies. Amen.",
"Jesus, help me be content in this moment. Not always chasing the next thing, but present with you right now. Amen."],
tempted:[
"Lord, I'm being tempted right now. You promised you'd always give me a way out. Show it to me, and give me the strength to take it. Amen.",
"Father, this temptation is loud, but it's not in charge. You are. Help me get up, walk away, and do something else right now. Amen.",
"Jesus, you were tempted in every way and never gave in. You understand this. Fight for me right now. I can't win this alone. Amen.",
"God, remind me how I'll feel after if I give in, and how I'll feel if I don't. Help me choose the second one. Amen.",
"Lord, help me text someone, change where I am, or put my phone away. Small actions can break the pull. Give me the courage to take one now. Amen.",
"Holy Spirit, fill me with your strength. Let your desire in me be stronger than this desire. Amen.",
"Father, this feeling will pass. Help me hold on until it does. Every minute I wait, it gets weaker. Amen.",
"Jesus, I'd rather have you than this. Help me believe that right now, in this exact moment. Amen.",
"Lord, thank you that being tempted isn't sin. Help me fight it, and thank you for your grace if I fall. Amen."]
});

Object.assign(MORE_MP, {
doubting:[
"God, I want to know you're real in a way I can hold onto. I have questions that won't go away, and I don't want to fake faith. Meet me in my doubts the way you met Thomas, gently and honestly. Amen.",
"Lord, I believe. Help my unbelief. I'm holding on with one hand right now. Strengthen whatever faith I have, and show me you're still there even when I'm unsure. Amen.",
"Jesus, you didn't push away the people who questioned you. You answered them, sat with them, and showed them who you are. Do that for me. I'm listening. Amen.",
"Father, remind me of the times you've come through in my life before. When doubt makes me forget, help me look back and remember what you've done. Amen.",
"Lord, lead me to thoughtful people and good resources that take my questions seriously. I don't want to bury my doubts, and I don't want to be ruled by them either. Amen.",
"Holy Spirit, when I can't feel you, help me keep seeking you anyway. You promised that whoever seeks you with all their heart will find you. I'm counting on that promise. Amen.",
"God, some of my doubt comes from pain I don't understand. I'm bringing you both the hurt and the questions. Please don't let me lose you in this. Amen.",
"Jesus, thank you that my salvation doesn't depend on how strong my faith feels today. It depends on how strong you are. Hold onto me tightly. Amen.",
"Lord, use this season of questions to build something real and lasting in me. Let my faith come out deeper, not thinner, on the other side. Amen."],
distant:[
"Lord, I feel far from you, and I'm not even sure how I got here. You haven't moved. I'm the one who drifted. Help me take one step back toward you today. Amen.",
"Father, draw near to me as I draw near to you. I'm not sure how to start, so I'm just going to start talking. Here I am. Amen.",
"Jesus, you are the good shepherd who leaves the ninety-nine to find the one. I feel like the one. Thank you for coming after me. Amen.",
"God, wake up my heart. Make prayer feel real again, and make your Word come alive again. I miss feeling close to you. Amen.",
"Lord, help me keep showing up even when I don't feel anything. Feelings come and go, but your faithfulness doesn't. Amen.",
"Holy Spirit, show me what's been crowding you out, like busyness, distractions, or sin I haven't dealt with. Help me clear the space for you again. Amen.",
"Father, I don't need a big emotional moment. I just want to know you're with me. Give me a small sign of your presence today. Amen.",
"Jesus, help me find a community that will help me grow close to you again. I don't want to do this alone. Amen."],
waiting:[
"Lord, I'm waiting on something, and it's taking longer than I hoped. Help me trust your timing. You're never late, even when it feels like it. Give me patience and peace while I wait. Amen.",
"Father, waiting is hard. I want answers, and I want them now. Teach me to wait with hope instead of anxiety, trusting that you're working even when I can't see it. Amen.",
"Jesus, help me be faithful in the waiting. Let me keep doing what's right, keep praying, and keep growing, even while I don't have what I'm waiting for yet. Amen.",
"God, those who wait on you will renew their strength. Renew mine. I'm tired of waiting, but I'm choosing to keep hoping in you. Amen.",
"Lord, if the answer is no, help me accept it and trust that you have something better. If it's not yet, help me be patient. If it's yes, help me be thankful. Amen.",
"Holy Spirit, use this waiting season to grow something in me I couldn't get any other way, like patience, trust, or character. Don't let it be wasted. Amen.",
"Father, Abraham waited, Joseph waited, and David waited. You were working the whole time. Help me believe you're working in my waiting too. Amen.",
"Jesus, help me not to rush ahead of you or force things to happen. I want your best, not just my fastest. Amen.",
"Lord, give me joy today, not someday when I get what I'm waiting for. Help me be present in this season instead of just enduring it. Amen.",
"God, I'm putting my hope in you, not just in the outcome. Whatever happens, you're enough for me. Amen."],
direction:[
"Lord, I have a decision to make, and I don't know which way to go. Give me wisdom. You promised to give it generously to anyone who asks, so I'm asking. Amen.",
"Father, trust in the Lord with all your heart and lean not on your own understanding. Help me do that. In all my ways, I'm acknowledging you. Make my path straight. Amen.",
"Jesus, help me slow down and pray before I decide. Give me peace about the right choice, and unrest about the wrong one. Amen.",
"God, give me wise people to talk to, like parents, mentors, and coaches, who will help me think clearly and point me toward you. Amen.",
"Lord, if both options are good, help me trust that you can work through either one. Free me from the fear of choosing wrong. Amen.",
"Holy Spirit, guide me. Speak through your Word, through wise counsel, and through the circumstances you open and close. Amen.",
"Father, help me remember that your main will for me is to love you and love people, wherever I end up. That part I already know. Amen.",
"Jesus, whatever I decide, help me commit to it fully and do it for your glory. Amen.",
"Lord, thank you that you don't expect me to see the whole future. Just the next step. Show me that step clearly. Amen."],
grateful:[
"Lord, thank you. You've been so good to me, and I don't say it enough. Thank you for my family, my friends, my health, and every good thing in my life. Let gratitude spill over into everything I do today. Amen.",
"Father, every good and perfect gift comes from you. Help me notice them today, the big ones and the small ones I usually overlook. Amen.",
"Jesus, thank you for saving me. When I think about what you did on the cross, everything else feels smaller. Let my life be a thank-you note to you. Amen.",
"God, help me say thank you to the people around me today. Let my gratitude to you overflow into gratitude to them. Amen.",
"Lord, thank you for the hard things too, the challenges that made me stronger, the losses that taught me, and the waiting that grew my trust. Amen.",
"Holy Spirit, make gratitude my first reaction, not my last. When I'm tempted to complain, remind me how much I've been given. Amen.",
"Father, thank you for this moment. I don't want to rush past it. Help me enjoy it fully and thank you for it. Amen.",
"Jesus, thank you for never giving up on me. Your patience and kindness amaze me. Amen.",
"Lord, help me give generously because I've received so generously. Let my thankful heart turn into open hands. Amen."],
joyful:[
"Lord, I'm happy today, and I want to thank you for it. Every good thing comes from you. Let this joy point me back to you, the source of all of it. Amen.",
"Father, thank you for this good day. Help me share this joy with someone who's having a hard time. Let me be a light today. Amen.",
"Jesus, you came so I could have life to the full. Today I feel that. Thank you. Help me remember this feeling on harder days. Amen.",
"God, help me enjoy this without holding back, and without worrying about when it might end. Today is a gift. Amen.",
"Lord, the joy of the Lord is my strength. Let this joy make me stronger, kinder, and more generous. Amen.",
"Holy Spirit, joy is part of your fruit. Thank you for growing it in me. Let it go deeper than circumstances. Amen.",
"Father, help me celebrate well, with thankfulness, humility, and love for the people around me. Amen.",
"Jesus, let my joy be contagious in a good way. Let people see you in my happiness. Amen.",
"Lord, thank you that in your presence there is fullness of joy. Help me stay close to you today. Amen."],
peaceful:[
"Lord, I feel at peace right now, and I want to thank you for it. This calm is a gift from you. Help me hold onto it and carry it into the rest of my day. Amen.",
"Father, thank you for a quiet moment. Help me slow down and enjoy it, instead of rushing to the next thing. Let me rest in your presence. Amen.",
"Jesus, you said, 'Peace I leave with you; my peace I give to you.' Thank you for giving me your peace. Help me guard it and share it. Amen.",
"God, let this peace go deeper than my circumstances. When things get hard again, help me remember that you're the source of this calm, not my situation. Amen.",
"Lord, help me be a peacemaker today. Let the calm in me help calm the people around me. Amen.",
"Holy Spirit, thank you for this stillness. Help me hear your voice more clearly in it. Amen.",
"Father, thank you that I don't have to earn your peace. It's a gift. Help me receive it fully. Amen.",
"Jesus, help me build habits that protect this peace, like time with you, rest, and fewer distractions. Amen.",
"Lord, I'm grateful for this moment. Let me remember it on harder days, as proof of your faithfulness. Amen.",
"God, you keep in perfect peace those whose minds are fixed on you. Help me keep my mind on you today. Amen."],
hopeful:[
"God, I feel hopeful today, and I want to thank you for it. Fill me with joy and peace as I trust you, so I overflow with hope by the power of the Holy Spirit. Amen.",
"Lord, thank you for the new things you're doing in my life. Help me trust you with what's ahead and keep walking in faith. Amen.",
"Father, let this hope be rooted in you, not just in circumstances. Even if things change, help me keep hoping in you. Amen.",
"Jesus, you are my living hope. Thank you that because you rose, I have a future that can't be taken away. Amen.",
"Lord, help me share this hope with someone who's struggling. Let me be an encouragement to them today. Amen.",
"Holy Spirit, keep this hope alive in me on harder days. Remind me of what you've promised. Amen.",
"Father, thank you for the progress I've seen. Help me keep going, and give you credit for every step forward. Amen.",
"Jesus, help me not to get ahead of you, but to walk with you step by step into whatever you have for me. Amen.",
"God, hope doesn't disappoint, because your love has been poured into my heart. Thank you for that love. Amen."],
won:[
"Lord, thank you for this win. Not to me, but to your name be the glory. Help me celebrate with humility and remember that every ability I have came from you. Amen.",
"Father, thank you for my teammates, coaches, and everyone who helped make this happen. Help me give credit freely and thank them well. Amen.",
"Jesus, help me win with class. Let me be gracious to the other side, humble in front of others, and thankful in private. Amen.",
"God, don't let this go to my head. Keep me grounded and hungry to keep growing. One win doesn't define me, and neither does one loss. Amen.",
"Lord, let this success give me opportunities to point people to you. Let my attitude in winning say something about who I follow. Amen.",
"Holy Spirit, help me enjoy this moment fully, without pride and without worrying about the next game. Amen.",
"Father, thank you for the hard work that led to this. Help me keep working with the same dedication. Amen.",
"Jesus, thank you for the joy of competing. Win or lose, it's a gift. Today, it's a really good gift. Amen."],
motivated:[
"Lord, I feel ready to go. Point this energy in the right direction. Help me use it on what matters most, not just what's in front of me. Amen.",
"Father, whatever I do, help me work at it with all my heart, as working for you and not for people. Let my effort be an act of worship today. Amen.",
"Jesus, help me channel this motivation into steady progress, not just a burst that fades. Build habits in me that last. Amen.",
"God, help me run the race with endurance, keeping my eyes on you. Let this drive come from love for you, not from pressure or pride. Amen.",
"Lord, help me finish what I start. Give me perseverance for when the excitement fades. Amen.",
"Holy Spirit, give me wisdom about where to focus this energy. Help me say no to distractions so I can say yes to what matters. Amen.",
"Father, I can do all things through Christ who strengthens me. Let your strength fuel me today. Amen.",
"Jesus, help me encourage others with this energy. Let my motivation lift up the people around me. Amen.",
"Lord, thank you for this fire. Keep it burning in the right way, for the right reasons. Amen."],
newstart:[
"Lord, I'm starting something new, and I'm excited and a little nervous. Go before me. Prepare the way, give me courage, and help me take the first step with you. Amen.",
"Father, thank you for fresh starts. Your mercies are new every morning, and so is this chapter. Help me leave behind what I need to and carry forward what's good. Amen.",
"Jesus, help me walk into this new season with humility and faith. I don't know everything ahead, but I know you're with me. Amen.",
"God, help me make good choices from the very beginning, about who I spend time with, how I use my time, and how I keep you first. Amen.",
"Lord, give me the courage to introduce myself, ask questions, and try new things. Help me find the people you've prepared for me here. Amen.",
"Holy Spirit, guide me through all the newness. When I feel out of place, remind me that I belong to you wherever I go. Amen.",
"Father, help me not to compare this to what came before. Let me be fully present in this new season. Amen.",
"Jesus, behold, you make all things new. Make me new too. Amen.",
"Lord, help me be patient with myself while I learn and adjust. New things take time. Amen.",
"God, I commit this new start to you. Let it bring glory to you and good to the people around me. Amen."],
loved:[
"Lord, I feel loved today, and I want to thank you for it. Thank you for the people who show me your love and for your love that never runs out. Amen.",
"Father, thank you for the people in my life who care about me. Help me not take them for granted. Show me how to love them back well. Amen.",
"Jesus, your love for me is the reason I can love anyone at all. Thank you for loving me first. Let that love spill over onto everyone around me today. Amen.",
"God, help me remember this feeling on harder days. Remind me that your love doesn't change, even when my feelings do. Amen.",
"Lord, show me someone who needs to feel loved today, and help me be your love to them. Amen.",
"Holy Spirit, pour God's love into my heart even more. Let it shape how I treat everyone I meet. Amen.",
"Father, thank you that nothing can separate me from your love. Not anything, not ever. Amen.",
"Jesus, help me receive love well, without pushing it away or feeling like I don't deserve it. Amen.",
"Lord, let my life be marked by love, the patient, kind, humble, and faithful kind you show me. Amen.",
"God, thank you for every way you've shown me love today. Help me notice even more of it tomorrow. Amen."]
});

/* Longer prayers (one or two paragraphs), shown with "Pray a longer one" */
const LONG = {t:{}, m:{}, mo:{}};
Object.assign(LONG.t, {
purity:[
"Lord, I'm coming to you honestly, because hiding hasn't worked. You already know where my eyes go and what my mind replays when I'm alone. I'm tired of the cycle of giving in, feeling sick about it, promising it won't happen again, and then ending up right back here. I don't want to live like that anymore, and I don't believe you want me to either.\n\nSo I'm asking you to do what I can't do on my own. Change what I want, not just what I do. Show me the moments when I'm most likely to fall, like late at night, when I'm bored, or when I'm stressed or lonely, and help me set things up differently before those moments come. Give me the courage to tell someone I trust. Thank you that there is no condemnation for me in Christ, and that your grace is stronger than this habit. I want a pure heart. Make it mine. Amen.",
"Jesus, you were tempted in every way I am, and you never gave in. That means you understand exactly what this feels like, and it also means you know the way through it. I need you to walk me through it. My willpower runs out fast, especially when the pull is strong and nobody's watching.\n\nWhen temptation shows up today, remind me that it's not an order I have to obey. Help me get up and leave the room, put the phone down, or call someone. Help me see people as your image-bearers, made with dignity, and never as objects for me to use. Guard my eyes, my thoughts, and my imagination. And when I'm tempted to believe that this is just who I am, remind me that I'm a new creation and that you are making me free. Amen.",
"Father, I think a lot of this is about something deeper than lust. When I feel empty, rejected, anxious, or just bored, this is where I run. It promises comfort and gives me shame instead. I don't want to keep feeding a hunger that never gets full.\n\nTeach me to bring that emptiness to you first. When I'm lonely, let me come to you and to real people instead of a screen. When I'm stressed, let me pray, move, or rest instead of numbing out. Fill the places I've been trying to fill with this. I believe you are better than anything this offers me, even when I don't feel it in the moment. Help my feelings catch up with what I believe. Amen.",
"God, I fell again, and I hate how it feels. Part of me wants to hide from you until I feel clean enough to come back. But that's exactly backwards. You don't ask me to clean myself up first. You ask me to come as I am and let you wash me.\n\nSo here I am. I confess what I did, and I receive your forgiveness, not because I deserve it but because Jesus already paid for it. Help me not to pick the shame back up after you've taken it. Show me what led up to this, so I can change it tomorrow. And help me keep fighting instead of giving up, because one fall isn't the end of the story. You're still writing it. Amen.",
"Lord, my body belongs to you. It was bought with a price, and your Spirit lives in me. I want to honor you with it, not because I'm afraid of getting caught, but because I love you and I believe your way is good for me.\n\nGive me wisdom in my relationships, and help me set boundaries before I'm in the moment, not during it. Give me the self-control to wait, the courage to say no, and the humility to admit when I need help. Protect the people I care about from my selfishness, and protect my future marriage, if that's your plan for me, from habits I'm forming now. Thank you that purity isn't about being perfect. It's about walking with you, one honest day at a time. Amen.",
"Holy Spirit, this fight has been long, and some days I wonder if I'll ever really be free. I've prayed about this so many times. But I'm not giving up, because you haven't given up on me. You've already brought me further than I was, even if I can't always see it.\n\nKeep me honest with you, with myself, and with the people helping me. Give me patience with the slow parts of change, and joy in the small wins. Let me remember the days I said no and walked away, because those days were real. Grow in me a love for you that is stronger than this pull, until purity is not just something I'm trying to do, but something I actually want. I trust you to finish what you started in me. Amen."],
anger:[
"Lord, I'm angry, and I don't want to pretend I'm not. You can handle my honesty. But I also don't want this anger to run my life or wreck my relationships. I've said things I regret and reacted in ways I'm not proud of. I want to be slow to anger, like you are, and I need your help to get there.\n\nShow me what's underneath this. Is it hurt? Embarrassment? Feeling disrespected, or unheard, or tired? Help me name it instead of just exploding. Give me a pause before I speak, long enough to breathe and pray. And when I do get it wrong, give me the humility to go back and make it right quickly. Make me someone people feel safe around. Amen.",
"Father, someone hurt me, and I keep replaying it. Every time I think about it, the anger comes back like it just happened. I want them to understand what they did. Part of me wants them to hurt the way I did. I know that isn't the way of Jesus, but it's honestly where I am.\n\nSo I'm bringing it all to you instead of carrying it alone. You see what happened. You're a just God, and nothing is hidden from you. I'm choosing to leave the justice part with you, so I don't have to hold onto it anymore. I don't feel like forgiving yet, but I'm asking you to start that work in me. Heal the part of me that got wounded, and don't let bitterness take root. Amen.",
"Jesus, when I look at how you were treated, mocked, betrayed, and beaten, and yet you still prayed for the people who did it, I'm amazed. I can't even let go of a rude comment. I need your heart, because mine isn't there yet.\n\nTeach me how to forgive the way you forgive. Not by pretending it didn't happen, and not by letting people keep hurting me, but by releasing my right to get even. Help me set wise boundaries where I need them, and still wish good for the people who wronged me. Soften the hard places in my heart. I want to be free of this grudge more than I want to win. Amen.",
"God, I blew up today, and I'm ashamed of it. I said things in the heat of the moment that hurt someone, and I can't take them back. I'm sorry. I'm sorry to you, and I need to be sorry to them too.\n\nGive me the courage to apologize without making excuses, without saying 'but you…' and without waiting for them to apologize first. Help me own my part completely. Then show me what set me off, so I can be ready next time. Maybe I was tired, stressed, or already carrying something else. Teach me to notice the early signs and walk away before I say something I'll regret. Thank you for your patience with me, which is so much bigger than mine. Amen.",
"Lord, a lot of my anger comes out at the people closest to me, like my family, my teammates, and my friends. They get the worst of me because I feel safe enough to let it out. That isn't fair to them, and it isn't who I want to be.\n\nHelp me treat the people I love with the same patience I'd show a stranger, and even more. When I'm frustrated, help me speak calmly and listen before I respond. When I'm wrong, help me admit it. When they're wrong, help me be gentle instead of harsh. Let my home and my team be places where your peace shows up through me. Amen.",
"Holy Spirit, I want your fruit in my life: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Right now, patience and self-control feel the furthest away. But you are the one who grows them, not me.\n\nWork in me slowly and steadily, and I'll keep showing up. When I keep my temper, help me notice it and thank you. When I lose it, help me come back quickly instead of beating myself up. Make me a peacemaker, someone who calms situations down instead of heating them up. I trust you to change me from the inside out. Amen."],
speech:[
"Lord, my words have been a problem, and I know it. Sometimes it's gossip, sometimes it's sarcasm that cuts too deep, sometimes it's complaining, and sometimes it's language I wouldn't want you to hear, even though you always do. Jesus said that what comes out of the mouth shows what's in the heart. That scares me a little, because it means this isn't just a habit. It's a heart thing.\n\nSo change my heart, and let my words follow. Set a guard over my mouth. Help me pause before I speak and ask whether it's true, kind, and needed. Let me be someone whose words build people up. And when I slip, help me notice right away and make it right. Amen.",
"Father, I've been talking about people behind their backs. It feels harmless in the moment, and it makes me feel like I'm on the inside. But I know it isn't harmless. It tears people down, breaks trust, and makes me someone nobody can really trust either.\n\nGive me the courage to change the subject, or say something good about the person, or just stay quiet. Help me treat absent people the way I'd want to be treated if I weren't in the room. If I've damaged someone's reputation, show me how to repair it. And keep me from being the kind of person who enjoys hearing bad news about others. Make my mouth a safe place. Amen.",
"Jesus, I use sarcasm and jokes to cut people down, and I tell myself it's just funny. But I've seen people laugh along while their faces fell a little. I don't want to be clever at someone else's expense.\n\nTeach me to use humor that brings people together instead of humor that makes someone smaller. Help me notice when a joke has gone too far, and give me the humility to say sorry, even if it feels awkward. Remind me that the people I'm joking about are people you love and died for. Give me a sense of humor that reflects your kindness. Amen.",
"God, I complain a lot. About school, practice, my family, the weather, and whatever isn't going my way. I don't think I even notice how often I do it. But the Bible says to do everything without grumbling, and I'm far from that.\n\nOpen my eyes to how much I've been given. Help me catch myself in the middle of complaining and turn it into thanks, or at least into a prayer about what's bothering me. Where there's a real problem, help me work on it instead of just whining about it. Make me someone who brings good energy into a room, not someone who drains it. Amen.",
"Lord, my language isn't what it should be. Cursing and crude jokes slip out easily, especially around certain people. I want my mouth to reflect that I belong to you, but right now it often reflects the people around me more than it reflects you.\n\nHelp me change what comes out, starting with what goes in. Make me aware of the music, shows, and conversations that shape how I talk. Give me the confidence to talk differently even when everyone else doesn't. Not in a holier-than-thou way, just quietly and consistently. Let the words of my mouth and the thoughts of my heart be pleasing to you. Amen.",
"Holy Spirit, I want to be known for my encouragement. I want people to leave a conversation with me feeling stronger, not smaller. There are people around me right now who are discouraged and could use a kind word, and I usually walk right past them.\n\nShow me who needs encouragement today, and give me the specific words to say. Help me be generous with praise and slow with criticism. When I do need to correct someone, help me do it gently and in private. Turn my mouth into a tool you can use to heal and help. Thank you for every kind word that's ever been spoken to me. Help me pass that on. Amen."],
pride:[
"Lord, I think I'm prouder than I realize. I like being right. I like being noticed. I compare myself to others and quietly feel better when I come out ahead. I don't want to admit it, but you already know. So I'm saying it out loud: I struggle with pride.\n\nHumble me gently. Remind me that every good thing I have, my talent, my mind, my opportunities, came from you. Help me celebrate other people's wins without feeling threatened. Teach me to listen more than I talk and to ask questions instead of always having the answer. Jesus, you were God and you still washed feet. Give me that kind of heart. Amen.",
"Father, I've been judging people. I see their mistakes so clearly, and I'm quick to decide what kind of person they are. Meanwhile, I make excuses for my own failures. That's exactly what Jesus warned about, looking at the speck in someone else's eye while ignoring the log in mine.\n\nForgive me. Show me my own heart honestly, so I'll have more compassion for others. Help me assume the best about people instead of the worst. When I notice someone struggling, help me pray for them instead of criticizing them. Remind me how much grace you've shown me, so I'll be quick to show it to others. Amen.",
"Jesus, I hate being wrong. I argue until I win, even when I'm not sure I'm right. I get defensive when someone corrects me, and I struggle to apologize. I think it's because I feel like being wrong makes me less. But that's not true in your kingdom.\n\nGive me the security to say 'You're right' and 'I was wrong' without feeling like I've lost something. Help me care more about the truth and about people than about winning arguments. Teach me to be teachable, because the people who grow are the ones who are willing to learn. Thank you that my worth is in you, not in being right. Amen.",
"God, I want to do something big with my life, and I don't think that's wrong. But sometimes I want it for me, for my name, my status, and my highlight reel, not for you. I don't want selfish ambition to drive me.\n\nShape my dreams so they line up with yours. Help me work hard because it honors you, not just because it puts me ahead. Make me the kind of person who lifts up teammates and shares credit freely. If you give me success, keep me humble. If you don't, keep me faithful. Either way, let my life point to you, not to me. Amen.",
"Lord, the Bible says you oppose the proud but give grace to the humble. I need your grace, so I need to be humble. I don't know how to make myself humble, but I can stop pretending, stop performing, and start being honest about my weaknesses.\n\nHelp me admit when I need help. Help me ask questions when I don't understand. Help me let someone else get the credit, the spotlight, or the last word. Keep me grounded in who you are, because the more I see your greatness, the more clearly I see my own size. And remind me that being small in your hands is the safest place to be. Amen.",
"Holy Spirit, show me the places where pride is hiding in me, in my thoughts about other people, in how I talk about myself, and in what I'm quietly chasing. Some of it I can see, but some of it is buried deep, and I need your light.\n\nGrow genuine humility in me, not fake modesty, but real love that puts others first. Teach me to consider others better than myself and to look out for their interests, not just mine. When I succeed, let me thank you first. When I fail, let me learn without falling apart. Make me more like Jesus every day. Amen."],
envy:[
"Lord, I've been comparing myself to everyone. Their bodies, their stats, their grades, their families, their friend groups, their stuff. Every time I scroll or look around, I find someone who has what I want, and it leaves me feeling like I'm not enough and I don't have enough.\n\nI know that comparison steals joy. It's stealing mine. Help me stop measuring my life against someone else's highlight reel. Open my eyes to what you've already given me, and help me be genuinely thankful for it. Remind me that you've written a different story for me than for them, and that mine isn't worse, just different. Amen.",
"Father, I'm jealous of someone, and it's starting to change how I treat them. I'm less happy for them, I find myself hoping they fail a little, and I talk about them differently. I don't like what this is doing to me.\n\nPlease take this out of my heart. Help me rejoice with them when they win, even when it's hard. Help me pray for their good on purpose, until my feelings start to match. Show me what I'm really afraid of underneath this jealousy. Maybe it's being forgotten, or not being good enough. Speak to that fear directly. Thank you that your love for me doesn't shrink when you bless someone else. Amen.",
"Jesus, I always want more. More stuff, more attention, more success, more of whatever the next thing is. And when I get it, the satisfaction lasts about a day. Paul learned to be content in every situation. I haven't learned that yet.\n\nTeach me the secret of contentment. Help me find joy in what's in front of me today, instead of always waiting for something better. Remind me that you are enough, that if I have you, I have what matters most. Free me from the restlessness of always wanting more. Let me rest in your goodness right now. Amen.",
"God, I've been ungrateful. I take my family, my health, my home, my friends, and my opportunities for granted, and I complain about the small things that don't go my way. I know so many people would give anything for what I have.\n\nForgive me for my ingratitude. Open my eyes to how much I've been given. Help me say thank you more, to you and to the people around me. Help me notice good things before I notice what's missing. Make gratitude my first reaction instead of my last. Every good and perfect gift comes from you, and you've given me so many. Amen.",
"Lord, social media makes this so much harder. Everyone's life looks perfect online, and mine feels boring and small by comparison. I know it's not real, but it still gets under my skin and shapes how I feel about myself.\n\nGive me the wisdom to set limits on what I see. Help me unfollow accounts that make me feel worse and spend less time scrolling. When I do look, remind me that I'm only seeing the best moments of other people's lives. Let my real life, with real people, be more important to me than a feed. And let my satisfaction come from you, not from how my life looks next to someone else's. Amen.",
